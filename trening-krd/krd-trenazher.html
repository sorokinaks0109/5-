<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Путь джедая КРД</title>
<style>
  :root {
    --bg: #eef3fb;
    --bg2: #f5f8fd;
    --card: #ffffff;
    --line: #d6dfee;
    --line2: #bccbe3;
    --text: #14213d;
    --muted: #5b6b8c;
    --blue: #1a6fe0;
    --blue-soft: #e6f0ff;
    --green: #139a52;
    --green-soft: #e3f7ec;
    --red: #d9304f;
    --red-soft: #fdebef;
    --amber: #c26b00;
    --amber-soft: #fff4e0;
    --violet: #6d3fd6;
    --shadow: 0 6px 24px rgba(30, 60, 120, .09);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(900px 480px at 100% -5%, #dbe8ff 0%, transparent 60%),
      radial-gradient(800px 460px at -10% 105%, #e9e2ff 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 19px;
    line-height: 1.5;
    min-height: 100vh;
  }
  .wrap { position: relative; max-width: 1080px; margin: 0 auto; padding: 28px 16px 60px; }
  h1, h2, h3 { margin: 0; line-height: 1.2; }
  .saber { height: 5px; border-radius: 5px; margin: 16px 0 24px;
    background: linear-gradient(90deg, #7d8aa6 0 8%, var(--blue) 8% 100%);
    box-shadow: 0 0 14px rgba(26,111,224,.45); }
  .kicker { color: var(--blue); letter-spacing: .14em; text-transform: uppercase; font-size: 14px; font-weight: 800; }
  .muted { color: var(--muted); }
  button { font: inherit; cursor: pointer; color: inherit; }

  /* Главный экран */
  .hero h1 { font-size: 40px; margin-top: 8px; }
  .hero p { margin: 10px 0 0; color: var(--muted); max-width: 760px; font-size: 20px; }
  .tiles { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .tile { text-align: left; background: var(--card); border: 2px solid transparent; border-radius: var(--radius);
    padding: 22px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow);
    transition: transform .18s, border-color .18s, box-shadow .18s; position: relative; overflow: hidden; }
  .tile::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 6px; background: var(--accent, var(--blue)); }
  .tile:hover, .tile:focus-visible { transform: translateY(-5px); border-color: var(--accent, var(--blue)); box-shadow: 0 14px 34px rgba(30,60,120,.16); outline: none; }
  .tile .emo { font-size: 44px; line-height: 1; transition: transform .25s; }
  .tile:hover .emo { transform: scale(1.15) rotate(-6deg); }
  .tile .num { font-size: 14px; font-weight: 800; color: var(--accent, var(--blue)); letter-spacing: .1em; text-transform: uppercase; }
  .tile h3 { font-size: 24px; }
  .tile p { margin: 0; color: var(--muted); font-size: 17px; }
  .tile .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; font-size: 16px; color: var(--muted); }
  .badge { font-size: 14px; padding: 3px 12px; border-radius: 999px; background: var(--green-soft); color: var(--green); font-weight: 700; }
  .codex { margin-top: 28px; background: var(--card); border-radius: var(--radius); padding: 18px 22px; box-shadow: var(--shadow); }
  .codex h3 { font-size: 18px; color: var(--amber); margin-bottom: 10px; }
  .codex dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; font-size: 18px; }
  .codex dt { font-weight: 800; }
  .codex dd { margin: 0; color: var(--muted); }

  /* Игровой экран */
  .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .back { background: var(--card); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 8px 16px; font-size: 16px; }
  .back:hover { color: var(--text); border-color: var(--line2); }
  .top h2 { font-size: 28px; flex: 1; min-width: 220px; }
  .stat { font-size: 17px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .stat > span { background: var(--card); border-radius: 999px; padding: 4px 12px; box-shadow: 0 1px 4px rgba(30,60,120,.08); }
  .stat b { color: var(--text); }
  .stat .streak { background: var(--amber-soft); color: var(--amber); font-weight: 800; }
  .streak.bump { animation: bump .4s; }
  @keyframes bump { 50% { transform: scale(1.25); } }
  .progress { height: 10px; background: #dde5f3; border-radius: 10px; overflow: hidden; margin: 16px 0 22px; }
  .progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4c9bff, var(--blue)); border-radius: 10px; transition: width .4s; }

  .case { --cc: var(--violet); background: var(--card); border: 2px solid var(--cc); border-left-width: 10px; border-radius: 18px;
    padding: 16px 22px 18px; margin-bottom: 16px; box-shadow: var(--shadow); animation: pop .3s; }
  .case .chead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .case .cnum { background: var(--cc); color: #fff; font-weight: 900; font-size: 18px; border-radius: 10px; padding: 4px 14px; }
  .case .ctag { font-weight: 800; font-size: 22px; color: var(--cc); }
  .case .cof { margin-left: auto; color: var(--muted); font-size: 16px; }
  .case .row { display: grid; grid-template-columns: 190px 1fr; gap: 12px; font-size: 22px; font-weight: 600; line-height: 1.4; }
  .case .row + .row { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line2); }
  .case .lbl { color: var(--cc); font-size: 14px; text-transform: uppercase; letter-spacing: .08em; padding-top: 6px; font-weight: 800; }
  .mlabel { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; color: var(--muted); margin: 4px 0 6px 4px; }
  .card { background: var(--card); border: 3px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px 22px; font-size: 20px; font-weight: 600; text-align: left; min-height: 0; display: block;
    animation: pop .3s ease-out; }
  .card.small { font-size: 19px; }
  @keyframes pop { from { transform: scale(.94) translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  .card.ok { border-color: var(--green); background: var(--green-soft); }
  .card.bad { border-color: var(--red); background: var(--red-soft); animation: shake .4s; }
  @keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }

  .choices { display: grid; gap: 12px; margin-top: 18px; }
  .choices.c3 { grid-template-columns: repeat(3, 1fr); }
  .choices.c5 { grid-template-columns: repeat(5, 1fr); }
  .choice { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 16px 10px; box-shadow: 0 2px 8px rgba(30,60,120,.06);
    display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform .12s, border-color .12s, background .12s; }
  .choice:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-soft); transform: translateY(-3px); }
  .choice:active:not(:disabled) { transform: scale(.97); }
  .choice .ic { font-size: 32px; line-height: 1; }
  .choice .t { font-weight: 800; font-size: 19px; }
  .choice .d { font-size: 15px; color: var(--muted); text-align: center; }
  .choice .k { font-size: 12px; color: var(--muted); opacity: .7; }
  .choice.right { border-color: var(--green); background: var(--green-soft); }
  .choice.wrong { border-color: var(--red); background: var(--red-soft); }
  .choice:disabled { cursor: default; }
  .choice:disabled:not(.right):not(.wrong) { opacity: .4; }

  .list { display: grid; gap: 12px; margin-top: 16px; }
  .opt { text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 16px 20px; font-size: 19px; box-shadow: 0 2px 8px rgba(30,60,120,.06); transition: transform .12s, border-color .12s, background .12s; }
  .opt:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-soft); transform: translateX(4px); }
  .opt.right { border-color: var(--green); background: var(--green-soft); }
  .opt.wrong { border-color: var(--red); background: var(--red-soft); animation: shake .4s; }
  .opt:disabled { cursor: default; }
  .opt .why { display: block; margin-top: 6px; font-size: 16px; color: var(--muted); }
  .opt.pick { display: flex; gap: 14px; align-items: flex-start; }
  .opt .let { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--blue-soft); color: var(--blue); }
  .opt.right .let { background: var(--green); color: #fff; }
  .opt.wrong .let { background: var(--red); color: #fff; }
  .opt.dim { opacity: .75; }
  .opt .lab { display: table; margin-top: 8px; font-size: 14px; font-weight: 800; padding: 2px 10px; border-radius: 999px; background: var(--red-soft); color: var(--red); }
  .opt .lab.good { background: var(--green-soft); color: var(--green); }

  .fb { margin-top: 18px; border-radius: 16px; padding: 16px 20px; font-size: 19px; border-left: 6px solid; animation: pop .25s; box-shadow: var(--shadow); }
  .fb.ok { background: var(--green-soft); border-color: var(--green); }
  .fb.bad { background: var(--red-soft); border-color: var(--red); }
  .fb b.h { display: block; margin-bottom: 4px; font-size: 20px; }
  .fb.ok b.h { color: var(--green); }
  .fb.bad b.h { color: var(--red); }
  .fb .fix { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line2); }
  .fb .fix span { color: var(--amber); font-weight: 800; }
  .next { margin-top: 16px; display: flex; justify-content: flex-end; }
  .btn { background: var(--blue); color: #fff; border: 0; border-radius: 999px; padding: 13px 28px; font-weight: 800; font-size: 19px;
    box-shadow: 0 6px 18px rgba(26,111,224,.35); transition: transform .12s, filter .12s; }
  .btn:hover { filter: brightness(1.08); transform: translateY(-2px); }
  .btn.ghost { background: var(--card); color: var(--text); border: 2px solid var(--line); box-shadow: none; font-weight: 700; }

  /* 5 почему */
  .chain { display: grid; gap: 8px; margin-bottom: 16px; }
  .link { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: start; background: var(--card); border-left: 5px solid var(--blue);
    border-radius: 12px; padding: 12px 16px; font-size: 18px; animation: pop .3s; box-shadow: 0 2px 8px rgba(30,60,120,.06); }
  .link .n { color: var(--blue); font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; padding-top: 3px; }
  .link.problem { border-color: var(--amber); }
  .link.problem .n { color: var(--amber); }
  .link.root { border-color: var(--green); background: var(--green-soft); }
  .link.root .n { color: var(--green); }
  .q { font-size: 24px; font-weight: 800; margin: 8px 0 2px; }
  .therefore { background: var(--card); border-radius: 16px; padding: 16px 22px; box-shadow: var(--shadow); font-size: 20px; }
  .therefore ol { margin: 6px 0 0; padding-left: 26px; }
  .therefore li { margin: 8px 0; opacity: 0; animation: pop .4s forwards; }
  .therefore li em { color: var(--green); font-style: normal; font-weight: 800; }

  /* Рыбья кость */
  .fishhint { display: flex; gap: 14px; align-items: stretch; margin-bottom: 18px; flex-wrap: wrap; }
  .fcard { flex: 1; min-width: 260px; background: var(--card); border: 3px solid var(--blue); border-radius: 16px; padding: 16px 20px;
    font-size: 22px; font-weight: 700; box-shadow: 0 10px 26px rgba(26,111,224,.2); cursor: grab; touch-action: none; user-select: none;
    display: flex; gap: 14px; align-items: center; animation: pop .3s; }
  .fcard .grip { font-size: 26px; color: var(--blue); }
  .fcard.bad { border-color: var(--red); background: var(--red-soft); animation: shake .4s; }
  .ghost-card { position: fixed; z-index: 50; pointer-events: none; opacity: .92; transform: rotate(-2deg) scale(.9); cursor: grabbing; }
  .trash { min-width: 170px; background: var(--card); border: 3px dashed var(--line2); border-radius: 16px; padding: 12px 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 800; color: var(--muted); transition: all .15s; }
  .trash .ic { font-size: 30px; }
  .trash small { font-weight: 500; font-size: 14px; }
  .trash:hover, .trash.over { border-color: var(--red); color: var(--red); background: var(--red-soft); transform: scale(1.03); }

  .fish { position: relative; display: grid; grid-template-columns: 70px 1fr 1fr 1fr 250px; grid-template-rows: auto 90px auto; column-gap: 16px; }
  .fish svg.skel { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .zone { position: relative; z-index: 1; background: rgba(255,255,255,.88); border: 2px dashed var(--line2); border-radius: 16px; padding: 10px 12px; min-height: 120px;
    transition: border-color .15s, background .15s, transform .15s; cursor: pointer; }
  .zone.ztop { grid-row: 1; align-self: end; }
  .zone.zbot { grid-row: 3; align-self: start; }
  .zone .zt { font-weight: 800; font-size: 17px; display: flex; gap: 8px; align-items: center; color: var(--zc, var(--blue)); }
  .zone .zt .ic { font-size: 24px; }
  .zone .empty { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .zone:hover, .zone.over { border-style: solid; border-color: var(--zc, var(--blue)); background: #fff; transform: scale(1.02); }
  .zone.wrongflash { border-color: var(--red); background: var(--red-soft); animation: shake .4s; }
  .zone.okflash { border-color: var(--green); background: var(--green-soft); }
  .chips { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .chip { font-size: 15px; line-height: 1.3; background: var(--bg2); border-left: 4px solid var(--zc, var(--blue)); border-radius: 8px; padding: 6px 9px; text-align: left; border-top: 0; border-right: 0; border-bottom: 0; }
  .chip.new { animation: chipIn .5s; }
  @keyframes chipIn { 0% { transform: scale(.6); opacity: 0; background: var(--green-soft); } 60% { transform: scale(1.05); } 100% { transform: none; opacity: 1; } }
  .picking .chip { cursor: pointer; transition: transform .12s, box-shadow .12s; }
  .picking .chip:hover { transform: scale(1.04); box-shadow: 0 4px 14px rgba(30,60,120,.18); background: #fff; }
  .picking .zone { cursor: default; }
  .picking .zone:hover { transform: none; border-style: dashed; border-color: var(--line2); background: rgba(255,255,255,.88); }
  .chip.main { background: var(--amber-soft); border-left-color: var(--amber); font-weight: 800; box-shadow: 0 0 0 2px var(--amber); }
  .chip.nope { background: var(--red-soft); animation: shake .4s; }
  .spine { grid-row: 2; grid-column: 1 / 5; }
  .head { grid-row: 1 / 4; grid-column: 5; align-self: center; position: relative; z-index: 1; background: linear-gradient(135deg, #ffe7b8, #ffd07a);
    border-radius: 24px 50% 50% 24px / 24px 50% 50% 24px; padding: 26px 34px 26px 22px; font-weight: 800; font-size: 18px; line-height: 1.35;
    box-shadow: 0 10px 26px rgba(194,107,0,.25); min-height: 200px; display: flex; flex-direction: column; justify-content: center; }
  .head small { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); margin-bottom: 6px; }
  .head::after { content: ""; position: absolute; right: 44px; top: 22px; width: 14px; height: 14px; border-radius: 50%; background: #14213d; box-shadow: inset -3px -3px 0 #3b4c78, 0 0 0 4px #fff; }
  .fishlegend { margin-top: 16px; color: var(--muted); font-size: 16px; text-align: center; }

  /* Всплывашка */
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(140%); z-index: 60; width: min(720px, calc(100% - 32px));
    background: var(--card); border-left: 6px solid var(--blue); border-radius: 16px; padding: 14px 20px; font-size: 18px; box-shadow: 0 14px 40px rgba(20,33,61,.22);
    visibility: hidden; transition: transform .3s ease-out, visibility 0s .3s; }
  .toast { cursor: pointer; }
  .toast.show { transform: translateX(-50%) translateY(0); visibility: visible; transition: transform .3s ease-out; }
  .toast.ok { border-color: var(--green); }
  .toast.bad { border-color: var(--red); }
  .toast b { display: block; font-size: 19px; }
  .toast.ok b { color: var(--green); }
  .toast.bad b { color: var(--red); }

  /* Конфетти */
  .confetti { position: fixed; z-index: 70; width: 10px; height: 14px; border-radius: 2px; pointer-events: none; animation: fall 1s ease-out forwards; }
  @keyframes fall { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }

  /* Финал */
  .final { text-align: center; padding: 16px 0; }
  .final .score { font-size: 80px; font-weight: 900; color: var(--blue); }
  .final .rank { font-size: 30px; font-weight: 800; margin-top: 2px; }
  .final .lesson { margin: 24px auto 0; max-width: 700px; text-align: left; background: var(--card); border-left: 6px solid var(--amber);
    border-radius: 16px; padding: 18px 24px; box-shadow: var(--shadow); }
  .final .lesson h3 { color: var(--amber); font-size: 20px; margin-bottom: 8px; }
  .final .lesson ul { margin: 0; padding-left: 22px; }
  .final .lesson li { margin: 6px 0; }
  .final .acts { display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
  .mist { margin: 18px auto 0; max-width: 700px; text-align: left; font-size: 17px; }
  .mist summary { cursor: pointer; color: var(--muted); }
  .mist li { margin: 6px 0; }

  @media (max-width: 860px) {
    .fish { grid-template-columns: 1fr; grid-template-rows: none; row-gap: 12px; }
    .fish svg.skel, .spine { display: none; }
    .zone.ztop, .zone.zbot { grid-row: auto; grid-column: auto !important; }
    .head { grid-row: 1; grid-column: auto; min-height: 0; border-radius: 18px; }
    .head::after { display: none; }
    .trash { flex: 1 1 100%; flex-direction: row; gap: 10px; }
    .trash small { display: none; }
  }
  @media (max-width: 720px) {
    body { font-size: 17px; }
    .hero h1 { font-size: 30px; }
    .top h2 { font-size: 23px; }
    .choices.c5 { grid-template-columns: repeat(2, 1fr); }
    .choices.c5 .choice:first-child { grid-column: 1 / -1; }
    .choices.c3 { grid-template-columns: 1fr; }
    .choice { flex-direction: row; justify-content: flex-start; text-align: left; gap: 12px; }
    .choice .d { text-align: left; }
    .choice .k { display: none; }
    .card { font-size: 18px; padding: 14px 16px; }
    .case .row, .link { grid-template-columns: 1fr; gap: 2px; }
    .case .row { font-size: 19px; }
    .case .cof { margin-left: 0; }
    .codex dl { grid-template-columns: 1fr; }
    .final .score { font-size: 60px; }
  }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" onclick="hideToast()"></div>

<script>
/* ============================================================
   ДАННЫЕ. Кейсы можно менять прямо здесь, формат простой.
   ============================================================ */

var CASES = {
  sklad1054: {
    color: "#1a6fe0",
    tag: "Склад №1054",
    nc: "В секторе А-5 катушки с кабелем хранятся вплотную к батарее отопления.",
    cause: "Нет техники для перемещения катушек, быстро подать заявку на неё нельзя."
  },
  ploshadka1076: {
    color: "#139a52",
    tag: "Площадка №1076",
    nc: "На открытой площадке в секторе В-17 отходы не разделяются по видам.",
    cause: "Не заключён договор на вывоз отходов: у ответственного нет доступа к системе закупки услуг."
  },
  zhurnal: {
    color: "#6d3fd6",
    tag: "Журнал склада",
    nc: "Замеры температуры и влажности за неделю не внесены в журнал.",
    cause: "Журнал лежит в кабинете начальника склада, у кладовщиков ночной смены к нему нет доступа."
  },
  vygruzka: {
    color: "#c26b00",
    tag: "Повреждение МТР",
    nc: "При выгрузке уронили паллету, повреждён корпус электродвигателя.",
    cause: "Паллета длиннее вил, удлинителей нет. О длинных паллетах склад узнаёт только в момент выгрузки: заранее габариты никто не проверяет."
  },
  evakuaciya: {
    color: "#d9304f",
    tag: "Эвакуационный выход",
    nc: "Путь к эвакуационному выходу заставлен пустыми поддонами.",
    cause: "Пустые поддоны после приёмки копятся: порядка их возврата поставщикам или вывоза нет, ставят куда придётся."
  }
};

/* Игра 1: коррекция / КРД / мимо */
var SORT = [

    c.style.background = colors[i % colors.length];
    var a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 120;

  var deck = shuffle(F.cards.map(function (c, i) { return i; }));

  function zoneHtml(c, where, col) {

      s += '<button class="chip' + (ci === fresh ? " new" : "") + (ci === mainIdx ? " main" : "") + '" data-ci="' + ci + '">' + esc(F.cards[ci].t) + '</button>';

  }

  function fishHtml() {
    var top = F.cats.slice(0, 3), bot = F.cats.slice(3);
    var s = '<div class="fish' + (phase === "main" ? " picking" : "") + '" id="fish"><svg class="skel" id="skel"></svg>';
    top.forEach(function (c, k) { s += zoneHtml(c, "ztop", k + 2); });
    s += '<div class="spine" id="spine"></div>';
    s += '<div class="head" id="head"><small>Проблема</small>' + esc(F.problem) + '</div>';
    bot.forEach(function (c, k) { s += zoneHtml(c, "zbot", k + 2); });
    return s + '</div>';
  }

  function draw() {
    var html = header("🐟 Рыбья кость", phase === "place" ? pos : F.cards.length + (phase === "main" ? 0 : 1), total, score, "Шаг");
    if (phase === "place") {
      var card = F.cards[deck[pos]];
      html += '<div class="fishhint"><div class="fcard" id="fcard"><span class="grip">⠿</span><span>' + esc(card.t) + '</span></div>' +
        '<button class="trash" data-zone="none" id="trash"><span class="ic">🗑️</span>Не причина<small>симптом, «кто», пустые слова</small></button></div>';

    if (phase === "krd") html += krdHtml();
    h(html);
    fresh = null;
    drawBones();
    window.onresize = drawBones;
    bind();
  }

  function drawBones() {

/* ---------- Игра «Коррекция или КРД?» ---------- */
function runCards(mode) {
  streak = 0;
  var cfg = { title: "Коррекция или КРД?", items: SORT, bins: SORT_BINS, cls: "c3" };
  var caseOrder = [];
  SORT.forEach(function (it) { if (caseOrder.indexOf(it.c) < 0) caseOrder.push(it.c); });
  {
    // кейсы идут по порядку, а карточки внутри кейса перемешиваются, чтобы ответ нельзя было угадать по позиции
    var byCase = [], seen = {};
    SORT.forEach(function (it) { if (!seen[it.c]) { seen[it.c] = []; byCase.push(seen[it.c]); } seen[it.c].push(it); });

  }
  var i = 0, score = 0, answered = false, mistakes = [];
  startTimer();

  function draw() {
    answered = false;
    var it = cfg.items[i];

    var inCase = cfg.items.filter(function (x) { return x.c === it.c; }), k = inCase.indexOf(it);
    var html = header(cfg.title, i, cfg.items.length, score, "Карточка") +

        '</span><span class="d">' + b.d + '</span><span class="k">клавиша ' + (k + 1) + '</span></button>';

      var n = parseInt(ev.key, 10);
      if (!answered && n >= 1 && n <= cfg.bins.length) answer(cfg.bins[n - 1].k);

function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function runWhy(idx) {
  streak = 0;
  var w = WHY[idx], step = 0, score = 0, firstTry = true, chain = [];
  var total = w.steps.length + 1;
  startTimer();

  function chainHtml() {
    var s = '<div class="chain"><div class="link problem"><span class="n">Проблема</span><span>' + esc(w.problem) + '</span></div>';
    chain.forEach(function (c, k) {
      s += '<div class="link' + (k === w.steps.length - 1 ? " root" : "") + '"><span class="n">' +
        (k === w.steps.length - 1 ? "Корень" : "Почему " + (k + 1)) + '</span><span>' + esc(c) + '</span></div>';
    });
    return s + '</div>';
  }

  function drawStep() {
    firstTry = true;
    var st = w.steps[step];
    var opts = shuffle(st.opts);
    var html = header(esc(w.title), step, total, score) + chainHtml() +
      '<div class="q">' + (step + 1) + '. ' + esc(st.q) + '</div><div class="list">';
    opts.forEach(function (o, k) { html += '<button class="opt" data-i="' + st.opts.indexOf(o) + '">' + esc(o.t) + '</button>'; });
    html += '</div><div id="fb"></div>';
    h(html);
    bindOpts(st.opts, function () {
      chain.push(st.opts.filter(function (o) { return o.ok; })[0].t);
      step++;
      if (step < w.steps.length) drawStep(); else drawTherefore();
    });
  }

  function bindOpts(list, onDone) {
    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (btn) {
      btn.onclick = function () {
        var o = list[+btn.getAttribute("data-i")];
        btn.disabled = true;
        btn.innerHTML = esc(o.t) + '<span class="why">' + esc(o.why) + '</span>';
        hit(!!o.ok, btn);
        if (o.ok) {
          btn.classList.add("right");
          if (firstTry) score++;
          Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (b) { b.disabled = true; });
          document.getElementById("fb").innerHTML = '<div class="next"><button class="btn" id="nx">Дальше →</button></div>';
          document.getElementById("nx").onclick = onDone;
          document.getElementById("nx").focus();
        } else {
          btn.classList.add("wrong");
          firstTry = false;
        }
      };
    });
  }

  function drawTherefore() {
    var html = header(esc(w.title), step, total, score) +
      '<div class="q">Проверка: читаем цепочку снизу вверх через «поэтому»</div>' +
      '<p class="muted">Корневая причина должна быть связана с проблемой. Если каждое «поэтому» звучит логично, корень найден верно.</p>' +
      '<div class="therefore"><ol>' + w.therefore.map(function (t) { return "<li>" + t + "</li>"; }).join("") + '</ol></div>' +
      '<div class="next"><button class="btn" id="nx">Сходится! Выбрать КРД →</button></div>';
    h(html);
    document.getElementById("nx").onclick = drawKrd;
  }

  function drawKrd() {
    firstTry = true;
    var opts = shuffle(w.krd);
    var html = header(esc(w.title), w.steps.length, total, score) +
      '<div class="link root" style="margin-bottom:14px"><span class="n">Корень</span><span>' + esc(w.root) + '</span></div>' +
      '<div class="q">Какое мероприятие будет настоящим КРД?</div><div class="list">';
    opts.forEach(function (o) { html += '<button class="opt" data-i="' + w.krd.indexOf(o) + '">' + esc(o.t) + '</button>'; });
    html += '</div><div id="fb"></div>';
    h(html);
    bindOpts(w.krd, function () {
      var ms = stopTimer(), r = rankOf(score / total);
      results["why-" + w.id] = score + "/" + total + " · " + r.t;
      results.why = results["why-" + w.id];
      saveResults();
      renderFinal(w.title, score, total, ms, r, [
        "Спрашивайте «почему?», а не «кто?». Виноватый человек почти никогда не корень.",
        "Каждый ответ должен быть фактом, который можно проверить, а не догадкой.",
        "Проверяйте цепочку через «поэтому»: от корня к проблеме без натяжек.",
        "КРД бьёт в корень. Заменить испорченное или отремонтировать сломанное: это коррекция."
      ], null, function () { runWhy(idx); });
    });
  }

  drawStep();
}

home();
</script>
