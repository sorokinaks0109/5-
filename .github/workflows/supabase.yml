# Публикация серверной функции «game» в Supabase.
# Нужны секреты репозитория SUPABASE_ACCESS_TOKEN и SUPABASE_PROJECT_REF (см. README).
# Запускается, когда меняются задания (content/), игровая логика или функция, и вручную.
name: Сервер Supabase

on:
  push:
    branches: [main]
    paths:
      - content/**
      - src/core/**
      - supabase/**
      - scripts/prepare-function.mjs
  workflow_dispatch:

jobs:
  deploy-function:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Проверка заданий и логики
        run: npm test
      - name: Подготовка функции
        run: node scripts/prepare-function.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Проверка кода функции
        run: deno check supabase/functions/game/index.ts
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Публикация функции
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Секреты SUPABASE_ACCESS_TOKEN и SUPABASE_PROJECT_REF не заданы — пропускаем публикацию (демо-режим)."
            exit 0
          fi
          supabase functions deploy game --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
