<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мурфография переехала</title>
<meta name="theme-color" content="#ff8a1a">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<style>
html, body { margin: 0; min-height: 100%; }
body { background: #ff8a1a; color: #fff; font: 700 18px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px 16px; box-sizing: border-box; min-height: 100vh; }
.box { max-width: 420px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
img { width: 170px; height: 170px; border-radius: 36px; }
h1 { font-size: 30px; line-height: 1.15; margin: 0; }
p { margin: 0; }
.btn { display: inline-block; background: #fff; color: #c95200; border-radius: 16px; padding: 14px 26px; text-decoration: none; font-weight: 900; font-size: 20px; box-shadow: 0 5px 0 rgba(150,50,0,.35); }
small { font-weight: 600; opacity: .95; font-size: 15px; }
</style>
</head>
<body>
<div class="box">
  <img src="icon-512.png" alt="">
  <h1>Мурфография переехала!</h1>
  <p>Новый адрес: <b>murfografia.ru</b></p>
  <a class="btn" id="go" href="https://murfografia.ru/">Перейти</a>
  <small id="note">Если приложение установлено на телефон, удалите старую иконку и установите заново с нового адреса.</small>
</div>
<script>
/* Прогресс хранится в браузере отдельно для каждого адреса, поэтому переносим его ссылкой:
   https://murfografia.ru/#import=<данные>. Переносим один раз, дальше просто переходим. */
(function () {
  var url = 'https://murfografia.ru/', data = null;
  try { if (!localStorage.getItem('slovarik:moved')) data = localStorage.getItem('slovarik:v1'); } catch (e) {}
  if (data) {
    url += '#import=' + btoa(unescape(encodeURIComponent(data))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    document.getElementById('note').textContent = 'Слова, звёзды и подсказки перенесутся сами. Рисунки остаются здесь — их можно нарисовать заново. Потом удалите старую иконку и установите приложение с нового адреса.';
  }
  var go = document.getElementById('go');
  go.href = url;
  function leave() { try { localStorage.setItem('slovarik:moved', '1'); } catch (e) {} }
  go.addEventListener('click', leave);
  setTimeout(function () { leave(); location.replace(url); }, 3000);
})();
</script>
</body>
</html>
