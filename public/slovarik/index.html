<meta property="og:title" content="Мурфография — словарные слова с котами">
<meta property="og:description" content="Словарные слова 1–8 класса: смешные истории, рисунки и тренировка. Бесплатно.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Neucha&family=Nunito:wght@500;700;800;900&display=swap" media="print" onload="this.media='all'">
<style>
:root {
  --paper: #fbfbf6;
  --paper-2: #ffffff;
  --grid: #dbe6f4;
  --ink: #1d2b4f;
  --ink-soft: #5a6785;
  --pen: #2451c7;
  --pen-soft: #e6edff;
  --red: #d7322b;
  --red-soft: #fde9e7;
  --green: #22844d;
  --green-soft: #e3f5ea;
  --pencil: #f3c233;
  --pencil-soft: #fff5d6;
  --orange: #f08a24;
  --orange-soft: #fff0df;
  --line: #d6dbe8;
  --shadow: 0 2px 0 #cfd6e6;
  --hand: "Neucha", "Comic Sans MS", cursive;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #17231f; --paper-2: #1f2e29; --grid: #22342e;
    --ink: #eef3ec; --ink-soft: #a9b8b0;
    --pen: #8fb4ff; --pen-soft: #25375a;
    --red: #ff7a6b; --red-soft: #4a2622;
    --green: #6fd79a; --green-soft: #1d3d2b;
    --pencil: #f3c233; --pencil-soft: #3d3418;
    --orange: #ffa552; --orange-soft: #43301c;
    --line: #34473f; --shadow: 0 2px 0 #0e1714;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #17231f; --paper-2: #1f2e29; --grid: #22342e;
  --ink: #eef3ec; --ink-soft: #a9b8b0;
  --pen: #8fb4ff; --pen-soft: #25375a;
  --red: #ff7a6b; --red-soft: #4a2622;
  --green: #6fd79a; --green-soft: #1d3d2b;
  --pencil: #f3c233; --pencil-soft: #3d3418;
  --orange: #ffa552; --orange-soft: #43301c;
  --line: #34473f; --shadow: 0 2px 0 #0e1714;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 500 17px/1.45 var(--body);
  padding-inline: 16px;
  padding-block: 0 96px;
  min-height: 100%;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

/* Шапка */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 16px; }
.logo { font: 400 34px/1 var(--hand); color: var(--pen); margin: 0; letter-spacing: .5px; }
.logo b { color: var(--red); font-weight: 400; }
.grades { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.grades span { font-size: 13px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .08em; margin-right: 4px; font-weight: 800; }
.grade {
  width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line);
  background: var(--paper-2); font-weight: 900; font-size: 18px; color: var(--ink-soft);
}
.grade[aria-pressed="true"] { background: var(--pen); border-color: var(--pen); color: var(--paper-2); }

/* Нижнее меню */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--paper-2); border-top: 2px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tab { border: 0; background: none; padding: 8px 2px 10px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 800; color: var(--ink-soft); }
.tab i { font-style: normal; font-size: 22px; line-height: 1.2; }
.tab[aria-current="page"] { color: var(--pen); }
.tab[aria-current="page"] i { transform: translateY(-2px); }

h2 { font: 400 30px/1.1 var(--hand); margin: 0; color: var(--ink); text-wrap: balance; }
.lead { margin: 0; color: var(--ink-soft); max-width: 60ch; }
.panel { background: var(--paper-2); border: 2px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.muted { color: var(--ink-soft); font-size: 15px; }
.label { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-soft); }

.btn {
  border: 2px solid var(--pen); background: var(--pen); color: var(--paper-2);
  border-radius: 14px; padding: 10px 18px; font-weight: 800; min-height: 46px;
}
.btn.ghost { background: var(--paper-2); color: var(--pen); }
.btn.small { min-height: 36px; padding: 5px 12px; font-size: 15px; border-radius: 11px; }
.btn:disabled { opacity: .45; cursor: default; }

/* Трудная буква — красная ручка учителя */
.t { color: var(--red); font-weight: 900; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 4px; }

/* Список слов */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--paper-2); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.stat .muted { font-size: 13px; line-height: 1.25; display: block; }
.stat b { display: block; font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
.stat.sel b { color: var(--pen); } .stat.ok b { color: var(--green); }
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.word {
  display: flex; align-items: center; gap: 8px; text-align: left;
  border: 2px solid var(--line); background: var(--paper-2); border-radius: 14px;
  padding: 9px 10px; font-size: 18px; font-weight: 700; position: relative;
}
.word .e { font-size: 22px; }
.word[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-soft); }
.word .dot { position: absolute; top: 6px; right: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.word .dot.learning { background: var(--pencil); }
.word .dot.learned { background: var(--green); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; color: var(--ink-soft); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }

/* Карточка */
.card { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; padding: 26px 18px; }
.card .pic { font-size: 72px; line-height: 1; }
.big { font-size: clamp(34px, 9vw, 56px); font-weight: 900; letter-spacing: .04em; line-height: 1.1; word-break: break-word; }
.hint { background: var(--pencil-soft); border-radius: 14px; padding: 12px 16px; max-width: 52ch; text-align: left; font-size: 18px; }
.hint .label { display: block; margin-bottom: 4px; }
.mine { width: 100%; max-width: 52ch; display: flex; flex-direction: column; gap: 6px; text-align: left; }
textarea, input[type="text"] {
  width: 100%; border: 2px solid var(--line); border-radius: 14px; background: var(--paper);
  padding: 10px 12px; font-size: 18px;
}
textarea { min-height: 80px; resize: vertical; font-family: var(--hand); font-size: 21px; }
.dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.dots button { width: 12px; height: 12px; padding: 0; border-radius: 50%; border: 0; background: var(--line); }
.dots button[aria-current="true"] { background: var(--pen); }

/* Истории */
.story { font-family: var(--hand); font-size: 23px; line-height: 1.5; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px; background: var(--paper-2); font-weight: 700; font-size: 16px; }
.chip.on { border-color: var(--green); background: var(--green-soft); }
.chip[aria-pressed="true"] { border-color: var(--pen); background: var(--pen); color: var(--paper-2); }
.group { display: flex; flex-direction: column; gap: 10px; }
.group + .group { border-top: 2px dashed var(--line); padding-top: 14px; }
.letter { font: 400 44px/1 var(--hand); color: var(--red); }
.saved { border-left: 4px solid var(--pencil); padding: 4px 0 4px 12px; }

/* Тренировка */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.mode { text-align: left; border: 2px solid var(--line); background: var(--paper-2); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); }
.mode b { font-size: 19px; }
.mode .e { font-size: 30px; }
.progress { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress div { height: 100%; background: var(--green); transition: width .3s; }
.gapword { font-size: clamp(34px, 10vw, 58px); font-weight: 900; letter-spacing: .06em; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; }
.gap { display: inline-block; min-width: .7em; border-bottom: 4px solid var(--ink-soft); text-align: center; margin: 0 2px; }
.gap.now { border-color: var(--pen); background: var(--pen-soft); border-radius: 6px 6px 0 0; animation: blink 1.2s ease-in-out infinite; }
.gap.filled { border-color: var(--green); color: var(--green); }
@keyframes blink { 50% { background: transparent; } }
.shrink { width: 100%; height: 100%; background: var(--pencil) !important; animation: shrink 5s linear forwards; }
@keyframes shrink { to { width: 0; } }
.opts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.opt { min-width: 76px; min-height: 64px; border-radius: 16px; border: 3px solid var(--line); background: var(--paper-2); font-size: 32px; font-weight: 900; }
.opt.wide { font-size: 22px; padding: 8px 16px; min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
.opt.right { border-color: var(--green); background: var(--green-soft); color: var(--green); }
.opt.wrong { border-color: var(--red); background: var(--red-soft); color: var(--red); }
.answer { font-size: 30px; text-align: center; font-weight: 800; letter-spacing: .04em; max-width: 420px; }
.verdict { border-radius: 14px; padding: 12px 16px; font-weight: 800; width: 100%; max-width: 52ch; }
.verdict.good { background: var(--green-soft); color: var(--green); }
.verdict.bad { background: var(--red-soft); color: var(--red); }
.verdict .your { font-weight: 700; color: var(--ink); display: block; margin-top: 4px; }
.miss { color: var(--red); text-decoration: line-through; }
.lost { background: var(--red-soft); color: var(--red); border-radius: 4px; }
.speak { border: 2px solid var(--line); background: var(--paper-2); border-radius: 50%; width: 64px; height: 64px; font-size: 28px; }
.result { font: 400 64px/1 var(--hand); color: var(--pen); }
.empty { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 12px; font-weight: 700; z-index: 9; max-width: calc(100% - 32px); }
details summary { cursor: pointer; font-weight: 800; color: var(--pen); }
/* Звёзды */
.stars { background: var(--pencil-soft); border: 2px solid var(--pencil); border-radius: 999px; padding: 2px 10px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stars.pop { animation: pop .5s ease; }
@keyframes pop { 40% { transform: scale(1.35); } }
.confetti { position: fixed; left: 50%; top: 45%; z-index: 20; pointer-events: none; }
.confetti span { position: absolute; font-size: 26px; animation: burst 1.3s ease-out forwards; }
@keyframes burst { 0% { transform: translate(0, 0) scale(.4); opacity: 1; } 100% { transform: translate(var(--x), calc(var(--y) + 120px)) scale(1.1) rotate(200deg); opacity: 0; } }

/* Рисунки */
img.drawn { width: 180px; height: 180px; border-radius: 18px; border: 3px solid var(--line); background: #fff; object-fit: cover; }
.bolt img.drawn { width: 120px; height: 120px; }
img.thumb { width: 28px; height: 28px; border-radius: 7px; object-fit: cover; border: 1px solid var(--line); flex: none; }
.draw { display: flex; flex-direction: column; gap: 14px; }
.canvasWrap { position: relative; width: 100%; max-width: 440px; aspect-ratio: 1; background: #fff; border: 3px solid var(--line); border-radius: 18px; overflow: hidden; }
.canvasWrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.ghostWord { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: clamp(34px, 11vw, 64px); font-weight: 900; color: #d9dee9; letter-spacing: .05em; padding: 10px; text-align: center; word-break: break-word; }
.ghostWord .t { color: #f4b4b0; text-decoration: none; }
.palette { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--paper-2); box-shadow: 0 0 0 2px var(--line); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); transform: scale(1.1); }

/* Истории */
.chip.pick[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
.chip.faded { opacity: .55; border-style: dashed; }
.chip[aria-pressed="true"] small { color: inherit; opacity: .8; }
.sgap { font: inherit; font-family: var(--body); font-weight: 900; min-width: 1.1em; padding: 0 2px; margin: 0; border: 0; border-bottom: 3px solid var(--pen); background: var(--pen-soft); color: var(--pen); border-radius: 6px 6px 0 0; line-height: 1.2; }
.sgap.right { border-color: var(--green); background: var(--green-soft); color: var(--green); }
.sgap.wrong { border-color: var(--red); background: var(--red-soft); color: var(--red); }

/* Молния */
.bolt { position: relative; }
.clock { position: absolute; top: 12px; right: 16px; font: 400 40px/1 var(--hand); color: var(--red); font-variant-numeric: tabular-nums; }
.bolt .opts { flex-direction: column; width: 100%; max-width: 440px; }
.boltopt { min-height: 70px; width: 100%; overflow-wrap: anywhere; line-height: 1.15; }

/* Буквы в списке слов */
.abc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; display: flex; gap: 4px; overflow-x: auto; padding: 8px 0; background: var(--paper); scrollbar-width: none; }
.abc button { flex: none; min-width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--line); background: var(--paper-2); font-weight: 900; color: var(--pen); }
.letterblock { display: flex; flex-direction: column; gap: 8px; scroll-margin-top: 60px; }
.alpha { font: 400 36px/1 var(--hand); color: var(--red); margin: 6px 0 0; display: flex; align-items: baseline; gap: 10px; border-bottom: 2px dashed var(--line); padding-bottom: 4px; }
.alpha span { font: 700 13px/1 var(--body); color: var(--ink-soft); }

/* Заставка */
/* Заставка: видна сразу из HTML, прячется скриптом (или сама через 4 с, если скрипт не сработал) */
.splash { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; overflow: hidden; background: #ff8a1a; color: #fff; text-align: center; cursor: pointer; transition: opacity .45s ease, transform .45s ease; animation: splashout .5s ease 4s forwards; -webkit-tap-highlight-color: transparent; user-select: none; }
.splash::before { content: ""; position: absolute; left: 50%; top: 42%; width: 240vmax; height: 240vmax; margin: -120vmax 0 0 -120vmax; background: repeating-conic-gradient(from 0deg, rgba(255,226,120,.28) 0 10deg, rgba(255,255,255,0) 10deg 20deg); animation: spin 26s linear infinite; }
.splash::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, rgba(255,214,90,.75), rgba(255,138,26,0) 45%), radial-gradient(circle at 50% 120%, rgba(232,70,40,.55), rgba(232,70,40,0) 60%); }
.splash > * { position: relative; z-index: 1; }
.splash.hide { opacity: 0; transform: scale(1.06); pointer-events: none; }
.splashcat { width: min(76vw, 320px); aspect-ratio: 220 / 240; filter: drop-shadow(0 8px 0 rgba(150,50,0,.22)); }
.bigcat { animation: hop .9s cubic-bezier(.3,1.6,.5,1) both; transform-origin: 50% 100%; overflow: visible; }
.bigcat .wavepaw { animation: hello .9s ease-in-out infinite; }
.bigcat .tail { animation: swish 1.6s ease-in-out infinite; }
.bigcat .head { animation: tilt 2.4s ease-in-out infinite; }
.bigcat .ears { animation: ears 2.6s ease-in-out infinite; }
.bigcat .blink { animation: blink 3.4s infinite; }
.bigcat .sparks { animation: twinkle 1.4s ease-in-out infinite; }
.splash.tap .bigcat { animation: hop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes hello { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(14deg); } }
@keyframes swish { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(10deg); } }
@keyframes tilt { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes twinkle { 50% { opacity: .3; } }
.splashname { font: 400 clamp(42px, 13vw, 76px)/1 var(--hand); letter-spacing: .5px; white-space: nowrap; }
.splashname i { display: inline-block; font-style: normal; text-shadow: 0 4px 0 rgba(150,50,0,.35); animation: letterpop .55s cubic-bezier(.3,1.7,.5,1) both; animation-delay: calc(.25s + var(--i) * 55ms); }
.splashname i.m { color: #fff27a; }
.splashsub { font: 800 17px/1.3 var(--body); letter-spacing: .04em; animation: fadeup .5s ease .95s both; }
.splashfly { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.splashfly b { position: absolute; bottom: -60px; font: 400 44px/1 var(--hand); color: rgba(255,255,255,.55); animation: flyup 5s linear infinite; }
.splashfly b:nth-child(1) { left: 8%; animation-delay: 0s; font-size: 52px; }
.splashfly b:nth-child(2) { left: 26%; animation-delay: 1.4s; color: rgba(255,242,122,.8); }
.splashfly b:nth-child(3) { left: 44%; animation-delay: .6s; font-size: 34px; }
.splashfly b:nth-child(4) { left: 62%; animation-delay: 2.1s; font-size: 56px; }
.splashfly b:nth-child(5) { left: 80%; animation-delay: .2s; color: rgba(255,242,122,.8); }
.splashfly b:nth-child(6) { left: 90%; animation-delay: 1.8s; font-size: 30px; }
.splashfly b:nth-child(7) { left: 16%; animation-delay: 2.9s; font-size: 30px; }
.splashfly b:nth-child(8) { left: 70%; animation-delay: 3.4s; color: rgba(255,242,122,.8); }
.splashpop { position: absolute; z-index: 2; font-size: 28px; pointer-events: none; animation: popfly .7s ease-out forwards; }
@keyframes splashout { to { opacity: 0; visibility: hidden; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes letterpop { 0% { opacity: 0; transform: translateY(40px) scale(.3) rotate(-15deg); } 100% { opacity: 1; transform: none; } }
@keyframes fadeup { from { opacity: 0; transform: translateY(12px); } to { opacity: .95; transform: none; } }
@keyframes flyup { 0% { transform: translateY(0) rotate(-10deg); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-115vh) rotate(20deg); opacity: 0; } }
@keyframes popfly { to { transform: translate(var(--dx), var(--dy)) scale(1.4); opacity: 0; } }

/* Знакомство */
.setup { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 420px; text-align: center; }
.setup .answer { max-width: none; }
.kbd { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 520px; margin: 4px auto 0; user-select: none; }
.kbdrow { display: flex; gap: 4px; justify-content: center; }
.key { flex: 1 1 0; min-width: 0; max-width: 44px; height: 46px; padding: 0; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 10px; background: var(--paper-2); color: var(--ink); font: 800 20px/1 var(--body); touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.key:active { transform: translateY(2px); border-bottom-width: 2px; background: var(--pen-soft); }
.key.wide { max-width: 64px; flex-grow: 1.5; }
.key.space { max-width: none; flex-grow: 5; font-size: 15px; font-weight: 700; color: var(--ink-soft); }
.pickbig { flex: 1 1 140px; min-height: 58px; border-radius: 16px; border: 3px solid var(--line); background: var(--paper-2); font-size: 19px; font-weight: 800; }
.pickbig[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-soft); color: var(--pen); }
.gradepick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.gradepick .grade { width: auto; height: 52px; border-radius: 14px; font-size: 22px; }
.hi { border: 2px solid var(--line); background: var(--paper-2); border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: 14px; color: var(--ink); }
.hellocat { width: 150px; height: 140px; }
.resultcat { width: 120px; height: 112px; }
.meme { background: #1d2b4f; color: #fff; font: 900 15px/1.2 var(--body); letter-spacing: .03em; padding: 8px 14px; border-radius: 12px; max-width: 340px; }

/* Повторение и прогресс */
.word .dot.due { background: var(--orange); }
.duebanner { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; background: var(--orange-soft); border: 2px solid var(--orange); border-radius: 16px; padding: 10px 14px; font-weight: 700; }
.nextbtn { position: relative; overflow: hidden; }
.nextbar { position: absolute; left: 0; bottom: 0; height: 5px; width: 100%; background: var(--pencil); transform-origin: left; animation: nextbar 1.3s linear forwards; }
@keyframes nextbar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.chart { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; height: 140px; align-items: end; }
.chart .bar { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
.chart .stack { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; background: var(--grid); border-radius: 6px; overflow: hidden; }
.chart i { display: block; width: 100%; }
.chart i.g { background: var(--green); }
.chart i.b { background: var(--red); }
.chart span { font-size: 11px; color: var(--ink-soft); }
.tablewrap { overflow-x: auto; }
.gtable { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.gtable th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); text-align: right; padding: 4px; }
.gtable td { text-align: right; padding: 8px 4px; border-top: 1px solid var(--line); font-weight: 700; }
.gtable th:first-child, .gtable td:first-child { text-align: left; }
.gtable td.ok { color: var(--green); } .gtable td.due { color: var(--orange); }
.report { display: flex; flex-direction: column; gap: 10px; border-color: var(--orange); }
.report textarea { font-family: var(--body); font-size: 16px; }
.blog { display: flex; gap: 14px; align-items: center; text-decoration: none; color: var(--ink); }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }

/* Живые коты */
.kitty .ears { animation: ears 2.6s ease-in-out infinite; transform-origin: 60px 40px; }
.kitty .blink { animation: blink 3.4s infinite; }
.kitty .floaty { animation: floaty 1.6s ease-in-out infinite; }
.kitty .bob { animation: floaty 1.2s ease-in-out infinite; }
.kitty .wave { animation: wave 1s ease-in-out infinite; }
.happy .kitty, .hellocat .kitty, .resultcat .kitty { animation: hop .7s cubic-bezier(.3,1.6,.5,1); transform-origin: 50% 100%; }
.sad .kitty { animation: sadwobble .9s ease-in-out; transform-origin: 50% 100%; }
@keyframes ears { 0%, 86%, 100% { transform: none; } 90% { transform: scaleY(.9) rotate(-2deg); } 94% { transform: rotate(2deg); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes floaty { 50% { transform: translateY(-4px); } }
@keyframes wave { 50% { transform: rotate(-12deg); } }
@keyframes hop { 0% { transform: translateY(12px) scale(1.08, .88); } 55% { transform: translateY(-8px) scale(.95, 1.06); } 100% { transform: none; } }
@keyframes sadwobble { 0%, 100% { transform: none; } 25% { transform: rotate(-5deg); } 60% { transform: rotate(4deg); } }

/* Коты-реакции */
.react { position: fixed; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 15; width: 118px; background: #fff; border: 3px solid #1d2b4f; border-radius: 18px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,.25); transform: translateY(-20px) scale(.7) rotate(6deg); opacity: 0; transition: transform .25s cubic-bezier(.3,1.6,.5,1), opacity .2s; pointer-events: none; }
.react.show { transform: none; opacity: 1; }
.react.bad { border-color: #d7322b; }
.react .rimg { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; padding: 6px; background: #fff; }
.react .rimg img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
.react .rcap { background: #1d2b4f; color: #fff; font: 900 11px/1.15 var(--body); text-align: center; padding: 6px 6px 7px; letter-spacing: .03em; }
.react.bad .rcap { background: #d7322b; }
.ownreact { position: relative; }
.ownreact img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; border: 2px solid var(--line); display: block; }
.ownreact button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--red); color: #fff; font-size: 12px; line-height: 22px; padding: 0; }

@media (prefers-reduced-motion: reduce) { *:not(.splash) { animation: none !important; transition: none !important; } }
.word > span:nth-child(2) { min-width: 0; overflow-wrap: break-word; hyphens: auto; }
@media (max-width: 420px) {
  .words { grid-template-columns: repeat(2, 1fr); }
  .word { font-size: 15px; padding: 8px; gap: 6px; }
  .word .e { font-size: 19px; }
  .grades { gap: 4px; }
  .grade { width: 34px; height: 34px; font-size: 16px; }
}
</style>
