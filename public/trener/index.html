<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>МурМемо</title>
<link rel="icon" href="img/cat-sit.webp" type="image/webp">
<link rel="apple-touch-icon" href="img/cat-sit.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Lora:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Макет: тёмная «игровая» сцена, яркие объёмные кнопки-плитки, одна колонка под телефон.
   Тема одна (тёмная) — так задумано, на любом фоне выглядит одинаково. */
:root {
  --bg: #140f35;
  --card: #262063;
  --card2: #322a7a;
  --line: #3e3592;
  --ink: #ffffff;
  --muted: #bab3ec;
  --page: #fffdf8;
  --page-ink: #1d1840;
  --page-muted: #6b6690;
  --mark: #ffe377;
  --violet: #8a6bff; --violet-d: #5b40d6;
  --pink: #ff5d8f;   --pink-d: #cf3468;
  --orange: #ff9a3c; --orange-d: #d4701a;
  --mint: #2fe0a6;   --mint-d: #13a576;
  --sky: #4cb8ff;    --sky-d: #1f86d4;
  --yellow: #ffd23f; --yellow-d: #d4a50c;
  --bad: #ff5468;    --bad-d: #c42d42;
  --dark-text: #1a1240;
  --f-display: "Unbounded", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-verse: "Lora", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background:
    radial-gradient(900px 520px at 85% -8%, #3b2a96 0, transparent 62%),
    radial-gradient(760px 480px at -12% 108%, #5b1d70 0, transparent 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font: 600 16px/1.45 var(--f-body);
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 110px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Появление экрана */
.enter .screen > * { animation: rise .42s cubic-bezier(.2,.8,.2,1) backwards; }
.enter .screen > *:nth-child(2) { animation-delay: .05s; }
.enter .screen > *:nth-child(3) { animation-delay: .1s; }
.enter .screen > *:nth-child(4) { animation-delay: .15s; }
.enter .screen > *:nth-child(n+5) { animation-delay: .2s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.screen { display: grid; gap: 18px; }

/* Объёмная кнопка: цвет задаётся классом c-* */
.b3 {
  --c: var(--violet); --cd: var(--violet-d);
  background: var(--c); color: #fff; border-radius: 18px;
  box-shadow: 0 5px 0 var(--cd); transition: transform .08s ease, box-shadow .08s ease, filter .15s;
}
.b3:hover { filter: brightness(1.06); }
.b3:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--cd); }
.b3:disabled { filter: grayscale(.7) brightness(.8); cursor: not-allowed; transform: none; }
.c-violet { --c: var(--violet); --cd: var(--violet-d); }
.c-pink { --c: var(--pink); --cd: var(--pink-d); }
.c-orange { --c: var(--orange); --cd: var(--orange-d); }
.c-mint { --c: var(--mint); --cd: var(--mint-d); color: var(--dark-text); }
.c-sky { --c: var(--sky); --cd: var(--sky-d); }
.c-yellow { --c: var(--yellow); --cd: var(--yellow-d); color: var(--dark-text); }
.c-card { --c: var(--card2); --cd: #1c1650; }
.btn { padding: 15px 22px; font-weight: 800; font-size: 17px; text-align: center; }

/* Звёзды */
.stars { display: inline-flex; gap: 3px; }
.star { width: 18px; height: 18px; }
.star path { fill: rgba(255,255,255,.22); }
.star.on path { fill: var(--yellow); }

/* Главная */
.hello { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hello .eyebrow { color: var(--muted); font-weight: 700; }
.hello h1 { font: 800 30px/1.1 var(--f-display); letter-spacing: -.01em; }
.round { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: 0 4px 0 #120d38; flex: none; }
.round:active { transform: translateY(3px); box-shadow: 0 1px 0 #120d38; }
.total { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 99px; background: var(--card); font-weight: 800; }
.total .star { width: 20px; height: 20px; }
.lessons { display: grid; gap: 14px; }
.lesson-card {
  position: relative; overflow: hidden; display: grid; gap: 6px; text-align: left;
  padding: 20px 20px 18px; min-height: 150px;
}
.lesson-card .subj { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.lesson-card h2 { font: 800 25px/1.12 var(--f-display); max-width: 80%; }
.lesson-card .meta { display: flex; align-items: center; gap: 10px; font-weight: 700; opacity: .92; margin-top: 4px; }
.lesson-card .art { position: absolute; right: -18px; bottom: -22px; width: 130px; height: 130px; opacity: .22; }
.lesson-card .art svg { width: 100%; height: 100%; fill: none; stroke: #fff; stroke-width: 1.6; }
.photo {
  display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 18px;
  border: 2px dashed var(--line); color: var(--muted); text-align: left;
}
.photo b { display: block; color: var(--ink); font-size: 16px; }
.photo .tag { margin-left: auto; padding: 4px 10px; border-radius: 99px; background: var(--card2); font-size: 12px; font-weight: 800; color: var(--yellow); white-space: nowrap; }

/* Экран урока */
.bar-top { display: flex; align-items: center; gap: 12px; }
.bar-top .grow { flex: 1; min-width: 0; }
.crumb { color: var(--muted); font-weight: 700; font-size: 14px; }
.lesson-h1 { font: 800 30px/1.1 var(--f-display); }
.lesson-sub { color: var(--muted); font-weight: 700; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tile { display: grid; align-content: space-between; gap: 14px; min-height: 172px; padding: 16px; text-align: left; }
.tile .ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: rgba(255,255,255,.22); }
.tile .ico .i { width: 26px; height: 26px; }
.tile .name { font: 700 17px/1.15 var(--f-display); }
.tile .sub { font-size: 13.5px; font-weight: 700; opacity: .88; line-height: 1.3; margin-top: 4px; }
.tile .stars .star path { fill: rgba(0,0,0,.18); }
.tile .stars .star.on path { fill: #fff; }
.tile.c-mint .stars .star.on path, .tile.c-yellow .stars .star.on path { fill: var(--dark-text); }

/* Путь заучивания */
.frag { display: grid; gap: 10px; padding: 16px 18px; border-radius: 18px; background: var(--card); }
.frag .lbl { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.frag .q { font: italic 500 17px/1.5 var(--f-verse); color: #fff; }
.frag .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.frag .n { color: var(--yellow); font-weight: 800; }
.path { display: grid; gap: 14px; position: relative; padding-block: 6px; }
.path::before { content: ""; position: absolute; left: 34px; top: 30px; bottom: 30px; width: 6px; border-radius: 6px; background: repeating-linear-gradient(to bottom, var(--line) 0 12px, transparent 12px 20px); }
.step { position: relative; display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 14px; text-align: left; }
.step .node { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; }
.step .node .i { width: 32px; height: 32px; }
.step .txt { display: grid; gap: 2px; padding: 12px 14px; border-radius: 16px; background: var(--card); }
.step .num { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.step .name { font: 700 17px/1.2 var(--f-display); }
.step .sub { color: var(--muted); font-size: 14px; font-weight: 700; }

/* Выбор отрывка */
.page {
  background: var(--page); color: var(--page-ink); border-radius: 20px; padding: 18px 14px;
  font: 500 18px/1.5 var(--f-verse); box-shadow: 0 10px 30px -12px rgba(0,0,0,.6);
}
.page .gap { height: 14px; }
.pl { display: grid; grid-template-columns: 30px 1fr; gap: 8px; width: 100%; text-align: left; padding: 3px 6px; border-radius: 8px; color: var(--page-ink); font: inherit; }
.pl .no { font: 700 12px/2.1 var(--f-body); color: var(--page-muted); text-align: right; font-variant-numeric: tabular-nums; }
.pl:hover { background: #f1eefc; }
.pl.in { background: var(--mark); border-radius: 0; }
.pl.first { border-radius: 8px 8px 0 0; font-weight: 600; }
.pl.last { border-radius: 0 0 8px 8px; font-weight: 600; }
.pl.first.last { border-radius: 8px; }
.pl.solo { background: var(--mark); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(255,210,63,.5); } }
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
  background: rgba(20,15,53,.94); border-top: 1px solid var(--line);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.dock .in { max-width: 560px; margin: 0 auto; display: grid; gap: 10px; }
.dock .say { text-align: center; font-weight: 800; }
.dock .say span { color: var(--yellow); }
.dock .row { display: flex; gap: 10px; }
.dock .row .btn { flex: 1; }

/* Игра: шапка */
.gtop { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.prog { height: 14px; border-radius: 99px; background: var(--card); overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--mint), var(--sky)); transition: width .35s cubic-bezier(.2,.8,.2,1); box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
.score { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 99px; background: var(--card); font-weight: 900; font-variant-numeric: tabular-nums; }
.score .star { width: 18px; height: 18px; }
.score.bump { animation: bump .35s ease; }
@keyframes bump { 40% { transform: scale(1.25); } }
.gtitle { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.gtitle h2 { font: 800 22px/1.15 var(--f-display); }
.combo { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 99px; background: linear-gradient(90deg, var(--orange), var(--pink)); font-weight: 900; font-size: 14px; white-space: nowrap; }
.combo svg { width: 16px; height: 16px; fill: #fff; }
.combo.bump { animation: bump .35s ease; }
.hint { color: var(--muted); font-weight: 700; margin: -6px 0 0; }

@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
@keyframes pop { from { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.06); } }
.shake { animation: shake .4s ease; }
.pop { animation: pop .35s cubic-bezier(.2,.8,.2,1) backwards; }

/* Соедини */
.names { display: flex; flex-wrap: wrap; gap: 10px; }
.name-chip { padding: 11px 16px; font-weight: 800; font-size: 15.5px; }
.name-chip.sel { --c: var(--yellow); --cd: var(--yellow-d); color: var(--dark-text); transform: translateY(-2px); }
.deeds { display: grid; gap: 10px; }
.deed { display: grid; gap: 4px; width: 100%; text-align: left; padding: 14px 16px; border-radius: 16px; background: var(--card); border: 2px solid var(--line); font-weight: 700; font-size: 15.5px; line-height: 1.35; }
.deed.sel { border-color: var(--yellow); background: var(--card2); }
.deed.ok { background: var(--mint); border-color: var(--mint); color: var(--dark-text); pointer-events: none; }
.deed.bad { border-color: var(--bad); background: #4a1f4a; }
.deed .who { font: 700 13px var(--f-display); }

/* Мемори */
.memo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; perspective: 900px; }
.mc { min-height: 128px; border-radius: 18px; padding: 12px; display: grid; align-content: center; justify-items: center; gap: 6px; text-align: center; }
.mc.back { color: #fff; }
.mc.back .q { font: 800 34px/1 var(--f-display); opacity: .95; }
.mc .lbl { font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
.mc.face { background: var(--page); color: var(--page-ink); box-shadow: 0 5px 0 #c9c3e8; font-weight: 700; font-size: 14.5px; line-height: 1.3; }
.mc.face .lbl { color: var(--page-muted); }
.mc.face.term .t { font: 700 17px/1.2 var(--f-display); }
.mc.flip { animation: flip .35s ease backwards; }
@keyframes flip { from { transform: rotateY(90deg); } }
.mc.face.miss { box-shadow: 0 0 0 3px var(--bad), 0 5px 0 var(--bad-d); }
.mc.face.done { background: var(--mint); color: var(--dark-text); box-shadow: 0 5px 0 var(--mint-d); }
.mc.face.done .lbl { color: var(--dark-text); }
.banner { padding: 12px 16px; border-radius: 14px; background: #4a1f4a; border: 2px solid var(--bad); font-weight: 800; }

/* Лента времени */
.ask { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 3; padding: 16px 18px; border-radius: 20px; box-shadow: 0 6px 0 var(--pink-d), 0 18px 30px -12px rgba(0,0,0,.6); }
.ask .lbl { font-size: 12px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
.ask p { margin: 4px 0 0; font: 700 18px/1.3 var(--f-display); }
.tl { list-style: none; margin: 0; padding: 0; position: relative; display: grid; gap: 10px; }
.tl::before { content: ""; position: absolute; left: 43px; top: 10px; bottom: 10px; width: 6px; border-radius: 6px; background: var(--card); }
.tl li { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: center; min-height: 52px; }
.yr { position: relative; z-index: 1; width: 92px; padding: 11px 0; font: 800 18px var(--f-display); font-variant-numeric: tabular-nums; }
.yr.ok { --c: var(--mint); --cd: var(--mint-d); color: var(--dark-text); pointer-events: none; }
.yr.bad { --c: var(--bad); --cd: var(--bad-d); }
.tl .tx { font-weight: 700; font-size: 15.5px; line-height: 1.35; min-width: 0; }
.tl .tx.empty { height: 3px; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 14px); }

/* Карта */
.mapbox { border-radius: 20px; overflow: hidden; background: #1b3a5e; box-shadow: 0 6px 0 #0f2440; }
.mapbox svg { display: block; width: 100%; height: auto; }
.m-land { fill: #23506f; }
.m-grid { stroke: rgba(255,255,255,.06); stroke-width: 1; }
.m-river { fill: none; stroke: #7cc8ff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.m-lake { fill: #7cc8ff; }
.m-cap { fill: #a9d8ff; font: italic 700 15px var(--f-body); }
.m-scale { stroke: #a9d8ff; stroke-width: 2; fill: none; }
.pt { cursor: pointer; }
.pt .hit { fill: transparent; }
.pt .dot { fill: var(--yellow); stroke: #fff; stroke-width: 3.5; }
.pt.sel .dot { fill: var(--pink); }
.pt.ok .dot { fill: var(--mint); }
.pt.bad .dot { fill: var(--bad); }
.pt .halo { fill: none; stroke: var(--yellow); stroke-width: 3; opacity: 0; }
.pt.sel .halo { opacity: 1; stroke: var(--pink); animation: halo 1s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes halo { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
.pt text { fill: #fff; font: 800 19px var(--f-body); paint-order: stroke; stroke: #163a55; stroke-width: 6px; stroke-linejoin: round; pointer-events: none; }

/* Стих: тексты на «странице» */
.verse { padding: 20px 18px; }
.verse .ln { display: block; }
.verse .gap { display: block; height: 12px; }
.w-hid { display: inline; color: var(--violet-d); font: inherit; border-bottom: 3px solid var(--violet); border-radius: 2px; padding: 0 1px; }
.w-hid .w-mute { color: #cfc8f2; letter-spacing: .04em; }
.w-hid.peek { background: #ece6ff; color: var(--page-ink); }
.dots { display: flex; gap: 6px; }
.dots i { flex: 1; height: 10px; border-radius: 10px; background: var(--card); }
.dots i.on { background: linear-gradient(90deg, var(--violet), var(--pink)); }
.row2 { display: flex; gap: 12px; }
.row2 .btn { flex: 1; }

.built { min-height: 110px; padding: 18px; }
.built .ctx { color: var(--page-muted); }
.cursor { display: inline-block; width: 3px; height: 1.05em; background: var(--violet); vertical-align: -0.15em; margin-left: 2px; border-radius: 2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.wchip { padding: 11px 16px; font: 600 18px var(--f-verse); }

.prompt { padding: 18px; border-radius: 20px; box-shadow: 0 6px 0 var(--violet-d); background: var(--violet); }
.prompt .lbl { font-size: 12px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
.prompt .v { font: 500 19px/1.5 var(--f-verse); margin-top: 6px; }
.prompt .faint { opacity: .6; }
.prompt .blank { display: inline-block; min-width: 4.5em; border-bottom: 3px solid var(--yellow); }
.prompt b { color: var(--yellow); }
.opts { display: grid; gap: 10px; }
.opt { width: 100%; text-align: left; padding: 15px 18px; font: 500 18px/1.4 var(--f-verse); }
.opt.ok { --c: var(--mint); --cd: var(--mint-d); color: var(--dark-text); }
.opt.bad { --c: var(--bad); --cd: var(--bad-d); }

.recite .ln.hidden { color: transparent; background: #ebe7fb; border-radius: 8px; margin: 7px 0; height: 1.15em; }
.recite .ln.cur.hidden { background: repeating-linear-gradient(90deg, #d9d1ff 0 14px, #ebe7fb 14px 28px); animation: pulse 1.2s ease-in-out infinite; }
.recite .ok-mark { color: var(--mint-d); font: 900 15px var(--f-body); }
.recite .ln.miss { color: var(--bad-d); }

/* План по дням */
.today { display: grid; gap: 12px; padding: 18px; border-radius: 22px; background: linear-gradient(135deg, #2f2680, #4a2a8a); box-shadow: 0 6px 0 #120d38; }
.today .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.today .lbl { font-size: 12px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--yellow); }
.today h2 { font: 800 21px/1.2 var(--f-display); }
.today .sub { color: var(--muted); font-weight: 700; }
.ring { width: 54px; height: 54px; flex: none; }
.ring circle { fill: none; stroke-width: 6; }
.ring .bgc { stroke: rgba(255,255,255,.15); }
.ring .fgc { stroke: var(--mint); stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; }
.ring text { fill: #fff; font: 900 14px var(--f-body); }
.tasks { display: grid; gap: 8px; }
.task { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 16px; background: var(--card); }
.task .ti { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; }
.task .ti .i { width: 22px; height: 22px; }
.task .tn { font-weight: 800; line-height: 1.25; }
.task .ts { color: var(--muted); font-size: 13.5px; font-weight: 700; }
.task .tick { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line); display: grid; place-items: center; font-weight: 900; }
.task.done { opacity: .75; }
.task.done .tick { background: var(--mint); border-color: var(--mint); color: var(--dark-text); }
.days { display: grid; gap: 14px; }
.day { display: grid; gap: 10px; padding: 14px; border-radius: 20px; background: rgba(255,255,255,.04); border: 2px solid var(--line); }
.day.now { border-color: var(--yellow); background: rgba(255,210,63,.07); }
.day.past { opacity: .7; }
.day .dh { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.day .dh b { font: 700 16px var(--f-display); }
.day .dh span { color: var(--muted); font-weight: 800; font-size: 13px; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quick .btn { padding: 14px 10px; font-size: 15px; }
.quick .btn.sel { --c: var(--yellow); --cd: var(--yellow-d); color: var(--dark-text); }
.datein { width: 100%; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); color: #fff; font: 800 17px var(--f-body); }
.plan-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-radius: 18px; background: var(--card); }
.plan-row .t { font-weight: 800; }
.plan-row .t small { display: block; color: var(--muted); font-weight: 700; font-size: 13px; }
.link { color: var(--muted); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; justify-self: center; padding: 6px; }

/* Кадры к строфам */
.scene { border-radius: 20px; overflow: hidden; background: #9fd3f5; box-shadow: 0 6px 0 #0d0a2a; }
.scene svg { display: block; width: 100%; height: auto; }
.scene .em { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.scene-cap { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.scene-cap h3 { font: 700 18px/1.2 var(--f-display); }
.scene-cap .n { color: var(--muted); font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
.frame-text { padding: 16px 18px; }
.frame-text .ln { display: block; }
.frame-text .ln.hidden { color: transparent; background: #ebe7fb; border-radius: 8px; margin: 7px 0; height: 1.15em; }
.strip { display: flex; flex-wrap: wrap; gap: 6px; }
.strip span { padding: 6px 10px; border-radius: 10px; background: var(--card); font-weight: 800; font-size: 13px; }
.strip span.on { background: var(--mint); color: var(--dark-text); }
.thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.thumb { border-radius: 16px; overflow: hidden; background: #9fd3f5; box-shadow: 0 5px 0 #0d0a2a; border: 3px solid transparent; transition: transform .08s; }
.thumb:active { transform: translateY(3px); }
.thumb svg { display: block; width: 100%; height: auto; pointer-events: none; }
.thumb.bad { border-color: var(--bad); }

/* Итог */
.result { justify-items: center; text-align: center; padding-top: 18px; }
.big-stars { display: flex; gap: 8px; }
.big-stars .star { width: 66px; height: 66px; filter: drop-shadow(0 5px 0 rgba(0,0,0,.25)); }
.big-stars .star.on { animation: starpop .5s cubic-bezier(.2,.8,.2,1) backwards; }
.big-stars .star.on:nth-child(2) { animation-delay: .18s; }
.big-stars .star.on:nth-child(3) { animation-delay: .36s; }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.25) rotate(8deg); } }
.result h2 { font: 800 26px/1.15 var(--f-display); }
.result .pts { font: 800 44px/1 var(--f-display); color: var(--yellow); }
.result .pts small { display: block; font: 700 14px var(--f-body); color: var(--muted); margin-top: 6px; }
.result .stat { color: var(--muted); font-weight: 700; }
.review { width: 100%; text-align: left; display: grid; gap: 10px; }
.review h3 { font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.review .item { padding: 14px 16px; border-radius: 16px; background: var(--card); font-weight: 700; }
.review .item b { display: block; color: var(--mint); margin-top: 4px; }
.review .item.verse-item { font: 500 17px/1.45 var(--f-verse); }
.actions { display: grid; gap: 12px; width: 100%; }

#toast {
  position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -20px);
  max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 14px; background: var(--page); color: var(--page-ink);
  font-weight: 800; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 20;
  box-shadow: 0 10px 30px -10px rgba(0,0,0,.6);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }


/* ===== Стиль А «Тёплый»: кремовый фон, оранжевый и тёмно-синий, как на логотипе МурМемо ===== */
:root {
  --bg: #fbf4ea; --card: #ffffff; --card2: #fff8ef; --line: #eedfca; --shadow: #efdcc3;
  --ink: #1b2a4a; --muted: #8a7e70; --navy: #1b2a4a; --navy-d: #0f1a33;
  --page: #ffffff; --page-ink: #1b2a4a; --page-muted: #9a8f82; --mark: #ffe08a;
  --orange: #f58a1f; --orange-d: #c9650a; --dark-text: #1b2a4a;
  --f-display: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
body { background: var(--bg); color: var(--ink); }
button:focus-visible, [tabindex]:focus-visible { outline-color: var(--orange); }
.round { background: #fff; color: var(--ink); box-shadow: 0 3px 0 var(--shadow); }
.round:active { box-shadow: 0 1px 0 var(--shadow); }
.c-card { --c: #fff; --cd: var(--shadow); color: var(--ink); }
.star path { fill: #e9dccb; }
.total { background: #fff; box-shadow: 0 3px 0 var(--shadow); }
.lesson-h1, .gtitle h2, .result h2 { font-weight: 900; }
.frag, .step .txt, .plan-row, .review .item, .task, .strip span { background: #fff; box-shadow: 0 3px 0 var(--shadow); }
.frag .q { color: var(--ink); }
.frag .n { color: var(--orange-d); }
.page { box-shadow: 0 4px 0 var(--shadow); }
.pl:hover { background: #fff3e3; }
.dock { background: rgba(251,244,234,.96); }
.dock .say span { color: var(--orange-d); }
.prog, .dots i, .tl::before { background: #f0e4d3; }
.score { background: #fff; box-shadow: 0 3px 0 var(--shadow); }
.deed { background: #fff; border-color: var(--line); }
.deed.sel { border-color: var(--orange); background: #fff8ef; }
.deed.bad { background: #ffe9ea; }
.mc.face { box-shadow: 0 5px 0 var(--shadow); }
.banner { display: flex; align-items: center; gap: 12px; background: #fff; color: var(--ink); }
.banner img { width: 54px; height: auto; flex: none; }
.ask { box-shadow: 0 6px 0 var(--pink-d), 0 14px 24px -14px rgba(120,60,20,.35); }
.today { background: var(--navy); color: #fff; box-shadow: 0 6px 0 var(--navy-d); }
.today .lbl { color: #ffb36b; }
.today .sub { color: #c9d1e4; }
.today .task { background: rgba(255,255,255,.08); box-shadow: none; color: #fff; }
.today .task .ts { color: #c9d1e4; }
.today .link { color: #c9d1e4; }
.today-cat { width: 92px; height: auto; flex: none; }
.ring .bgc { stroke: #f0e4d3; }
.ring text { fill: var(--ink); }
.today .ring .bgc { stroke: rgba(255,255,255,.18); }
.today .ring text { fill: #fff; }
.task .tick { border-color: #d9cbb6; }
.day { background: #fff; border-color: var(--line); }
.day.now { border-color: var(--orange); background: #fff8ef; }
.quick .btn.sel { --c: var(--orange); --cd: var(--orange-d); color: #fff; }
.datein { background: #fff; color: var(--ink); border-color: var(--line); }
.scene, .thumb { box-shadow: 0 5px 0 var(--shadow); }
.result .pts { color: var(--orange); }
.review .item b { color: var(--mint-d); }
#toast { background: var(--navy); color: #fff; }

/* Кот */
.cat { display: block; user-select: none; -webkit-user-drag: none; transform-origin: 50% 92%; animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.025) translateY(-1px); } }
.cat.jump { animation: jump .7s cubic-bezier(.3,.6,.4,1); }
@keyframes jump { 15% { transform: scale(1.06,.92); } 45% { transform: translateY(-22%) scale(.96,1.05); } 70% { transform: translateY(0) scale(1.05,.94); } 100% { transform: none; } }
.cat.jump-in { animation: jumpin .8s cubic-bezier(.2,.9,.3,1.3) backwards; }
@keyframes jumpin { from { transform: translateY(40%) scale(.5); opacity: 0; } }
.catbtn { display: block; }

/* Главная */
.home-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.home-top .r { display: flex; align-items: center; gap: 10px; }
.logo { font: 900 26px/1 var(--f-display); letter-spacing: -.01em; }
.logo b { color: var(--orange); font-weight: 900; }
.logo span { color: var(--navy); }
.hero { display: grid; grid-template-columns: 1fr 128px; align-items: end; gap: 6px; padding: 16px 6px 0 18px; border-radius: 26px; background: #fff; box-shadow: 0 4px 0 var(--shadow); overflow: hidden; }
.hero .hi { color: var(--muted); font-weight: 800; font-size: 15px; }
.hero h1 { margin: 2px 0 10px; font: 900 25px/1.1 var(--f-display); }
.hero .bubble { margin-bottom: 16px; padding: 10px 12px; border-radius: 16px 16px 16px 4px; background: #fff3e3; font-weight: 800; font-size: 14px; line-height: 1.3; }
.hero .cat { width: 128px; height: auto; }
.photo-btn { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 12px; width: 100%; padding: 10px 16px 10px 10px; border-radius: 22px; background: var(--orange); color: #fff; text-align: left; box-shadow: 0 6px 0 var(--orange-d); }
.photo-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--orange-d); }
.photo-btn img { width: 76px; height: auto; background: #fff7ec; border-radius: 16px; padding: 4px; }
.photo-btn b { display: block; font-size: 18px; font-weight: 900; line-height: 1.2; }
.photo-btn small { display: block; font-weight: 700; opacity: .9; margin-top: 2px; }
.h3 { font-size: 13px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.subj { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.s { display: grid; gap: 4px; padding: 0 0 14px; border-radius: 22px; background: #fff; box-shadow: 0 4px 0 var(--shadow); text-align: left; overflow: hidden; }
.s:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.s .pic { display: grid; place-items: end center; height: 118px; padding-top: 8px; margin-bottom: 6px; background: #faf3e8 !important; border-top: 6px solid var(--tint, #f0e4d3); }
.s .pic img { height: 110px; width: auto; }
.s b { font-size: 17px; font-weight: 900; padding-inline: 14px; }
.s small { color: var(--muted); font-weight: 800; font-size: 13px; padding-inline: 14px; }
.s .stars { padding-inline: 14px; }
.s.soon { opacity: .9; }
.s.soon b::after { content: " · скоро"; font-size: 12px; color: var(--orange-d); font-weight: 800; }

/* Урок, выбор отрывка, план */
.lesson-head { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 10px; }
.lesson-head .cat { width: 104px; height: auto; }
.mini-cat { width: 64px; height: auto; flex: none; }
.mini-cat.flip { transform: scaleX(-1); }
.shelf-empty { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 12px; padding: 14px; border-radius: 20px; border: 2px dashed var(--line); color: var(--muted); font-weight: 800; }
.shelf-empty img { width: 70px; height: auto; }
.shelf-note { color: var(--muted); font-weight: 700; font-size: 13.5px; text-align: center; }
.card-pic { display: block; width: 100%; max-width: 260px; justify-self: center; border-radius: 22px; box-shadow: 0 4px 0 var(--shadow); }
.res-cat .cat { width: 170px; height: auto; margin-inline: auto; }

/* Математика: решение по шагам */
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-variant-numeric: tabular-nums; line-height: 1.05; margin: 0 2px; }
.fr > span { padding: 0 3px; min-width: 1.2em; text-align: center; }
.fr > span:first-child { border-bottom: 2.5px solid currentColor; }
.fr .mul { color: var(--orange-d); background: #fff1dc; border-radius: 4px; padding: 0 2px; }
.mtask { padding: 16px; border-radius: 20px; background: var(--navy); color: #fff; box-shadow: 0 5px 0 var(--navy-d); }
.mtask .lbl { font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: #ffb36b; }
.mtask .q { margin-top: 6px; font-size: 19px; font-weight: 800; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.mtask .fr { font-size: 24px; }
.levels { display: flex; gap: 8px; }
.levels button { flex: 1; padding: 9px 6px; border-radius: 12px; background: #fff; box-shadow: 0 3px 0 var(--shadow); font-size: 14px; font-weight: 800; }
.levels button.on { background: var(--navy); color: #fff; box-shadow: 0 3px 0 var(--navy-d); }
.msol { display: grid; gap: 8px; }
.mst { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 16px; background: #fff; box-shadow: 0 3px 0 var(--shadow); }
.mst .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #f0e4d3; font-weight: 900; }
.mst.done .n { background: var(--mint); color: #fff; }
.mst.cur { box-shadow: 0 0 0 3px var(--orange), 0 3px 0 var(--shadow); }
.mst.wait { opacity: .45; }
.mst .what { font-size: 13.5px; color: var(--muted); font-weight: 700; }
.mst .math { font-size: 19px; font-weight: 800; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.mst .math .fr { font-size: 19px; }
.mslot { display: inline-grid; place-items: center; min-width: 2.2em; height: 1.6em; padding: 0 6px; border-radius: 8px; border: 2.5px dashed var(--orange); color: var(--orange-d); background: #fff8ee; }
.mslot.filled { border-style: solid; }
.mslot.bad { border-color: var(--bad); color: var(--bad-d); background: #ffe9ea; animation: shake .35s; }
.mans { color: var(--mint-d); }
.mhint { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 16px; background: #fff3e3; font-weight: 700; }
.mhint img { width: 64px; height: auto; }
.mhint .mults { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.mhint .mults span { padding: 2px 7px; border-radius: 8px; background: #fff; font-variant-numeric: tabular-nums; }
.mhint .mults span.hit { background: var(--mint); color: #fff; }
.mpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mpad button { padding: 13px 0; font-size: 22px; font-weight: 900; }
.mpad .help { font-size: 15px; }
.mdone { display: grid; gap: 12px; justify-items: center; text-align: center; padding: 16px; border-radius: 20px; background: #fff; box-shadow: 0 4px 0 var(--shadow); }
.mdone img { width: 110px; height: auto; }
.mdone .final { font-size: 20px; font-weight: 800; }

/* Разложение, НОД, НОК и объяснения кота */
.xrule { padding: 10px 14px; border-radius: 14px; background: #fff; border-left: 5px solid var(--orange); font-size: 14px; color: var(--muted); font-weight: 700; }
.xrule b { color: var(--ink); }
.xrule ol { margin: 4px 0 0; padding-left: 20px; }
.xrule li.now { color: var(--ink); font-weight: 900; }
.xrule li.ok { color: var(--mint-d); }
.xbar { display: grid; grid-template-columns: auto auto; justify-content: center; font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; padding: 12px 0; background: #fff; border-radius: 18px; box-shadow: 0 3px 0 var(--shadow); }
.xbar.flat { box-shadow: none; padding: 0; }
.xbar > span { padding: 2px 14px; min-height: 40px; display: flex; align-items: center; }
.xbar .l { justify-content: flex-end; border-right: 3px solid var(--ink); }
.xbar .r { color: var(--orange-d); }
.xbar .cur { background: #fff1dc; border-radius: 8px 0 0 8px; }
.xresult { text-align: center; font-size: 20px; font-weight: 900; padding: 10px; border-radius: 14px; background: #e6f8f0; color: var(--mint-d); }
.xnote { color: var(--muted); font-size: 14px; text-align: center; font-weight: 700; }
.xfact { display: grid; gap: 10px; }
.xfrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 12px; border-radius: 16px; background: #fff; box-shadow: 0 3px 0 var(--shadow); font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }
.xfrow.pick { cursor: pointer; box-shadow: 0 0 0 2px #f6c48f, 0 3px 0 var(--shadow); }
.xfrow .eq, .xdot { color: var(--muted); }
.xchip { min-width: 40px; padding: 4px 8px; border-radius: 10px; background: #f6efe4; font-size: 20px; font-weight: 900; border-bottom: 4px solid transparent; text-align: center; }
.xchip.marked { background: #fff1dc; border-bottom-color: var(--orange); color: var(--orange-d); }
.xchip.used { opacity: .35; }
.xres { min-height: 54px; border: 2.5px dashed var(--orange); background: #fffaf2; }
.xres .from-b { background: #e8f1ff; }
.xres .added { background: #fff1dc; color: var(--orange-d); }
.xprimes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.xprimes button { padding: 12px 0; font-size: 21px; font-weight: 900; }
.mhint.err { background: #ffecec; }
.xhow { align-self: start; padding: 8px 14px; font-size: 14.5px; font-weight: 900; border-radius: 12px; }
.xexplain { display: grid; gap: 12px; }
.xsay { display: grid; grid-template-columns: 84px 1fr; gap: 10px; align-items: end; }
.xsay img { width: 84px; height: auto; }
.xbubble { padding: 14px 16px; border-radius: 18px 18px 18px 4px; background: #fff; box-shadow: 0 3px 0 var(--shadow); font-size: 16.5px; line-height: 1.45; font-weight: 700; }
.xbubble b { color: var(--orange-d); }
.xboard { padding: 14px; border-radius: 18px; background: #fff; box-shadow: 0 3px 0 var(--shadow); display: grid; gap: 8px; justify-items: center; font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; text-align: center; }
.xboard .ln { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; }
.xboard .u { border-bottom: 4px solid var(--orange); color: var(--orange-d); padding: 0 3px; }
.xboard .x { color: #c9bfb2; text-decoration: line-through; }
.xboard .g { color: var(--mint-d); }
.xboard .muted { color: var(--muted); font-size: 15px; font-weight: 700; }
.xboard .fr { font-size: 20px; }
.xpair { display: grid; gap: 6px; justify-items: center; font-size: 16px; }
.xpair span { padding: 8px 12px; border-radius: 12px; background: #f6efe4; }
.xpair span:first-child { background: var(--navy); color: #fff; }
.xpair i { font-style: normal; color: var(--orange-d); }
.xcards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; font-size: 15px; }
.xcards span { padding: 12px 8px; border-radius: 12px; color: #fff; display: grid; place-items: center; }
.xcards .v { background: var(--violet); } .xcards .s { background: var(--sky); }
.xtruth { width: 100%; text-align: left; font-size: 15px; font-weight: 700; display: grid; gap: 4px; }
.xtruth span { justify-self: start; padding: 2px 8px; border-radius: 8px; color: #fff; font-size: 12.5px; font-weight: 900; }
.xtruth .ok { background: var(--mint-d); } .xtruth .no { background: var(--bad); }
.xlist { display: grid; gap: 6px; width: 100%; text-align: left; font-size: 15px; font-weight: 700; }
.xlist div { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; }
.xlist b { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--orange); color: #fff; font-size: 13px; }
.xtag { padding: 6px 12px; border-radius: 99px; background: #f6efe4; font-size: 15px; }
.xverse { font: 500 18px/1.5 var(--f-verse); }
.xdots { display: flex; gap: 6px; justify-content: center; }
.xdots i { width: 8px; height: 8px; border-radius: 50%; background: #e6d9c6; }
.xdots i.on { background: var(--orange); }

/* Снятые страницы */
.shots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.shot { position: relative; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 4px 0 var(--shadow); aspect-ratio: 3 / 4; max-width: 100%; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot .no { position: absolute; left: 8px; top: 8px; min-width: 28px; height: 28px; border-radius: 14px; display: grid; place-items: center; background: var(--navy); color: #fff; font-weight: 900; }
.shot .del { position: absolute; right: 8px; top: 8px; width: 34px; height: 34px; border-radius: 50%; background: rgba(27,42,74,.85); color: #fff; font-size: 22px; line-height: 1; display: grid; place-items: center; }
.btn .i { width: 20px; height: 20px; vertical-align: -4px; }
/* Порядок, группы, вопросы */
.order { display: grid; gap: 8px; counter-reset: st; }
.order .done-step { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--mint); color: var(--dark-text); font-weight: 800; }
.order .done-step b { width: 32px; height: 32px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
.order .slot { height: 46px; border-radius: 14px; border: 2px dashed var(--line); }
.pool { display: grid; gap: 8px; }
.pool .opt { font: 700 15.5px/1.35 var(--f-body); }
.groups { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.groups .btn { padding: 14px 10px; font-size: 15px; }
.groups .gcount { display: block; font-size: 12px; opacity: .85; margin-top: 2px; }
.qopts { display: grid; gap: 10px; }
.qopts .opt { font: 700 16px/1.35 var(--f-body); }

/* Кот-подсказчик в играх */

    x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 18 * devicePixelRatio,
    vy: (-Math.random() * 16 - 6) * devicePixelRatio, s: (6 + Math.random() * 7) * devicePixelRatio,
    r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.floor(Math.random() * cols.length)],
  }));
  let t = 0;

    ctx.clearRect(0, 0, W, H);
    ps.forEach((p) => {
      p.vy += .45 * devicePixelRatio; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;

/* ---------- План по дням: «к какому дню выучить» ---------- */
const DAY = 864e5;
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fromYmd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayYmd = () => ymd(new Date());
const addDays = (s, n) => ymd(new Date(fromYmd(s).getTime() + n * DAY + 3600e3));
const daysBetween = (a, b) => Math.round((fromYmd(b) - fromYmd(a)) / DAY);
function dayLabel(s) {
  const d = daysBetween(todayYmd(), s);
  const long = fromYmd(s).toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  return d === 0 ? 'Сегодня' : d === 1 ? 'Завтра' : d === -1 ? 'Вчера' : long[0].toUpperCase() + long.slice(1);
}
const shortDate = (s) => fromYmd(s).toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' });
let plan = store.get('plan');       // { due, a, b, days: [{ date, tasks: [{ id, game, a, b, kind }] }] }
let doneTasks = store.get('done') || {};
const linesTxt = (a, b) => (a === b ? `строка ${a + 1}` : `строки ${a + 1}–${b + 1}`);

function makePlan(due) {
  const r = range, start = todayYmd();
  const n = Math.max(1, daysBetween(start, due));           // дней до сдачи (сам день сдачи не считаем)
  // Порции — кадры стиха внутри отрывка; маленькие склеиваем, чтобы в порции было хотя бы 4 строки.
  const parts = [];
  SCENES.filter((x) => x.b >= r.a && x.a <= r.b).forEach((x) => {
    const p = { a: Math.max(x.a, r.a), b: Math.min(x.b, r.b) }, last = parts[parts.length - 1];
    if (last && last.b - last.a + 1 < 4) last.b = p.b; else parts.push(p);
  });
  const learnDays = n >= 2 ? n - 1 : 1;
  const per = Math.ceil(parts.length / learnDays);
  const days = [];
  let learned = null;
  const T = (date, game, a, b, kind) => ({ id: `${date}:${game}:${a}-${b}`, game, a, b, kind });
  for (let k = 0; k < learnDays; k++) {
    const date = addDays(start, k), bucket = parts.slice(k * per, (k + 1) * per), tasks = [];
    if (bucket.length) {
      const a = bucket[0].a, b = bucket[bucket.length - 1].b;
      tasks.push(T(date, 'frames', a, b, 'new'), T(date, 'fade', a, b, 'new'), T(date, 'build', a, b, 'new'));
      if (learned) tasks.push(T(date, 'next', r.a, b, 'join'));
      learned = { a: r.a, b };
    } else if (learned) {
      tasks.push(T(date, 'fade', learned.a, learned.b, 'repeat'), T(date, 'next', learned.a, learned.b, 'repeat'));
    }
    days.push({ date, tasks });
  }
  const finalDay = n >= 2 ? { date: addDays(start, n - 1), tasks: [] } : days[0];
  finalDay.tasks.push(T(finalDay.date, 'gap', r.a, r.b, 'final'), T(finalDay.date, 'recite', r.a, r.b, 'final'));
  if (n >= 2) days.push(finalDay);
  plan = { lesson: POEM.id, due, a: r.a, b: r.b, days };
  store.set('plan', plan);
}
const planLesson = () => (plan && lessonById(plan.lesson || 'perchatka')) || PERCHATKA;
function todayPlan() {
  if (!plan) return null;
  const t = todayYmd();
  if (daysBetween(t, plan.due) <= 0) {
    // День сдачи (или позже): одно задание — рассказать целиком.
    return { date: t, due: true, tasks: [{ id: `${t}:recite:${plan.a}-${plan.b}`, game: 'recite', a: plan.a, b: plan.b, kind: 'final' }] };
  }
  // Невыполненное с прошлых дней переносим на сегодня.
  const past = plan.days.filter((d) => d.date < t).flatMap((d) => d.tasks).filter((x) => !doneTasks[x.id]);
  const now = plan.days.find((d) => d.date === t);
  return { date: t, tasks: [...past, ...(now ? now.tasks : [])] };
}

/* ===== История ===== */
function makeMatch(L, o = {}) {
  const items = o.items || L.persons;
  const g = base(items.length);
  g.title = o.title || 'Соедини';
  g.rounds = chunk(shuffle(items), 5); g.r = 0; g.doneIds = new Set();
  const setup = () => { const it = g.rounds[g.r]; g.left = shuffle(it); g.deeds = shuffle(it); g.sel = null; };
  setup();
  g.done = () => g.doneIds.size;
  g.hint = () => `${o.hint || 'Нажми на имя, потом на то, что сделал этот человек.'} Раунд ${g.r + 1} из ${g.rounds.length}`;
  g.body = () => `
    <div class="names">${g.left.filter((p) => !g.doneIds.has(p.id)).map((p) => `<button class="b3 c-violet name-chip${g.sel && g.sel.side === 'l' && g.sel.id === p.id ? ' sel' : ''}" data-act="l" data-id="${p.id}">${esc(p.name)}</button>`).join('')}</div>
    <div class="deeds">${g.deeds.map((p) => {
      const ok = g.doneIds.has(p.id), bad = g.flash === p.id, sel = g.sel && g.sel.side === 'r' && g.sel.id === p.id;
      return `<button class="deed${ok ? ' ok' : ''}${sel ? ' sel' : ''}${bad ? ' bad shake' : ''}${g.just === p.id ? ' pop' : ''}" data-act="r" data-id="${p.id}">${ok ? `<span class="who">${esc(p.name)}</span>` : ''}${esc(p.text)}</button>`;
    }).join('')}</div>`;
  g.on = (side, id) => {
    if (g.doneIds.has(id)) return;
    if (!g.sel || g.sel.side === side) { g.sel = { side, id }; sfx('tap'); return draw(); }
    const name = side === 'l' ? id : g.sel.id, deed = side === 'r' ? id : g.sel.id;
    g.sel = null;
    if (name === deed) {
      g.ok(name); g.doneIds.add(name); draw();
      if (g.rounds[g.r].every((p) => g.doneIds.has(p.id)) && g.r < g.rounds.length - 1) { later(() => { g.r++; setup(); g.just = null; toast('Раунд ' + (g.r + 1)); draw(); }, 700); return; }
      maybeFinish();
    } else {
      const p = items.find((x) => x.id === name);
      g.bad(name, p.name, p.text); flash(deed);
    }
  };
  return g;
}

function makeMemory(L, o = {}) {
  const items = o.items || L.terms, [la, lb] = o.labels || ['термин', 'значение'];
  const g = base(items.length);
  g.title = o.title || 'Мемори';
  g.rounds = chunk(shuffle(items), 4); g.r = 0; g.pairs = 0; g.open = []; g.stuck = false;
  const setup = () => { g.cards = shuffle(g.rounds[g.r].flatMap((t) => [{ pid: t.id, type: 'term', text: t.term }, { pid: t.id, type: 'def', text: t.text }])); g.open = []; g.stuck = false; };
  setup();
  g.done = () => g.pairs;
  g.hint = () => g.stuck

  g.body = () => `
    ${g.stuck ? `<div class="banner pop"><img src="${CAT('think')}" alt=""><span>Не пара. Прочитай обе карточки и нажми на любую, чтобы играть дальше</span></div>` : ''}
    <div class="memo">${g.cards.map((c, i) => {
      const shown = c.matched || g.open.includes(i);
      if (!shown) {
        return `<button class="mc back b3 ${c.type === 'term' ? 'c-violet' : 'c-sky'}" data-act="card" data-id="${i}" aria-label="Закрытая карточка: ${c.type === 'term' ? la : lb}">
          <span class="lbl">${c.type === 'term' ? la : lb}</span><span class="q">?</span></button>`;
      }
      const cls = c.matched ? ' done' : g.stuck ? ' miss' : '';
      return `<button class="mc face ${c.type}${cls}${g.just === i ? ' flip' : ''}" data-act="card" data-id="${i}">
        <span class="lbl">${c.matched ? '✓ ' : ''}${c.type === 'term' ? la : lb}</span><span class="t">${esc(c.text)}</span></button>`;
    }).join('')}</div>`;
  g.on = (act, id) => {
    const i = +id;
    if (g.stuck) {
      // Неверная пара висит открытой, пока ребёнок сам не нажмёт: можно спокойно прочитать.
      const was = g.open; g.open = []; g.stuck = false; g.just = null;
      if (was.includes(i) || g.cards[i].matched) return draw();
    }
    const c = g.cards[i];
    if (c.matched || g.open.includes(i)) return;
    g.open.push(i); g.just = i;
    if (g.open.length < 2) { sfx('tap'); return draw(); }
    const [a, b] = g.open.map((k) => g.cards[k]);
    if (a.pid === b.pid) {
      a.matched = b.matched = true; g.open = []; g.pairs++; g.ok(i); draw();
      if (g.cards.every((x) => x.matched) && g.r < g.rounds.length - 1) { later(() => { g.r++; setup(); g.just = null; toast('Раунд ' + (g.r + 1)); draw(); }, 1200); return; }
      maybeFinish();
    } else {
      g.stuck = true; g.bad(null); draw();
    }
  };
  g.stars = () => { const k = g.wrong / g.total; return k <= 1 ? 3 : k <= 2 ? 2 : 1; };
  g.stat = () => `Пар: ${g.total} · промахов: ${g.wrong}`;
  g.review = () => L.terms.map((t) => ({ q: t.term.replace('­', ''), right: t.text }));
  g.reviewTitle = 'Все термины параграфа';
  return g;
}

function makeTimeline(L) {
  const g = base(L.events.length);
  g.title = 'Лента времени';
  g.queue = shuffle(L.events); g.placed = new Set();
  g.done = () => g.placed.size;
  g.hint = () => 'Нажми на год, когда это случилось';
  g.body = () => {
    const cur = g.queue[0];
    const ys = [...L.events].sort((a, b) => a.year - b.year);
    return `${cur ? `<div class="ask b3 c-pink" style="cursor:default"><div class="lbl">Когда это было?</div><p class="${g.just !== 'ask' ? 'pop' : ''}">${esc(cur.text)}</p></div>` : ''}
      <ol class="tl">${ys.map((e) => {
        const ok = g.placed.has(e.id), bad = g.flash === e.id;
        return `<li><button class="b3 c-card yr${ok ? ' ok' : ''}${bad ? ' bad shake' : ''}" data-act="year" data-id="${e.id}">${e.year}</button>
          <div class="tx${ok ? '' : ' empty'}${g.just === e.id ? ' pop' : ''}">${ok ? esc(e.text) : ''}</div></li>`;
      }).join('')}</ol>`;
  };
  g.on = (act, id) => {
    const cur = g.queue[0];
    if (!cur || g.placed.has(id)) return;

    else { g.just = 'ask'; g.bad(cur.id, cur.text, String(cur.year)); flash(id); }
  };

}

const MAP_W = 640, MAP_H = 360, K = 62;

    <g transform="translate(${MAP_W - 130} ${MAP_H - 22})"><path class="m-scale" d="M0 -6V0H${km100}V-6"/><text class="m-cap" x="${km100 + 8}" y="4">100 км</text></g>

function makeMap(L) {
  const M = L.map;

  const name = (id) => M.points.find((p) => p.id === id).name;
  g.body = () => {
    if (g.phase === 'label') {
      return mapSvg(L, g, (id) => g.named.has(id)) + `<div class="names">${g.chips.filter((p) => !g.named.has(p.id)).map((p) =>
        `<button class="b3 c-mint name-chip${g.chip === p.id ? ' sel' : ''}" data-act="chip" data-id="${p.id}">${esc(p.name)}</button>`).join('')}</div>`;
    }
    const q = g.qs[g.qi];
    return (q ? `<div class="ask b3 c-pink" style="cursor:default"><div class="lbl">Где это было? ${g.qi + 1} из ${g.qs.length}</div><p class="pop">${esc(q.q)}</p></div>` : '') + mapSvg(L, g, () => true);
  };
  g.on = (act, id) => {
    if (g.phase === 'label') {
      if (g.named.has(id)) return;
      if (act === 'chip') g.chip = g.chip === id ? null : id;
      if (act === 'pt') g.sel = g.sel === id ? null : id;
      if (!g.chip || !g.sel) { sfx('tap'); if (!g.chip && g.sel) toast('Теперь выбери название'); return draw(); }
      const chip = g.chip, pt = g.sel; g.chip = null; g.sel = null;
      if (chip === pt) {
        g.ok(pt); g.named.add(pt); draw();
        if (g.named.size === M.points.length) later(() => { g.phase = 'where'; toast('Все города на месте! Теперь вопросы'); draw(); }, 700);
      } else { g.bad('l:' + chip, 'Где находится ' + name(chip) + '?', 'Подпиши карту ещё раз'); flash(pt); }
      return;
    }
    const q = g.qs[g.qi];
    if (!q || act !== 'pt') return;
    if (id === q.point) {
      g.ok(id); g.qi++; g.okFlash = id; toast(name(id) + ' — верно!'); draw();
      later(() => { g.okFlash = null; draw(); }, 700); maybeFinish();
    } else { g.bad('q:' + q.point, q.q, name(q.point)); flash(id); }

      ${st.decimal ? '<button class="b3 c-card help" data-act="mhelp" style="grid-column:1 / -1">Подсказка</button>' : ''}

    if (act === 'md') return g.key(id);
    if (act === 'mdel') return g.key('Backspace');
    if (act === 'mok') return check();
    if (act === 'mhelp') { g.showHint = true; return draw(); }
    if (act === 'mlvl') { mathLevel = +id; store.set('mlevel', mathLevel); setup(); return draw(); }
    if (act === 'mnext' && g.k >= g.ex.steps.length) {
      g.solved++; g.n++;
      if (g.clean) { g.right++; g.combo++; }
      if (g.n >= g.total) { draw(); return maybeFinish(); }
      setup(); window.scrollTo(0, 0); return draw();
    }
  };

  g.review = () => [...g.missed.values()];
  g.reviewTitle = 'Где были ошибки';
  return g;
}

const PR = [2, 3, 5, 7, 11, 13];
const pick1 = (a) => a[rnd(0, a.length - 1)];
const prod = (a) => a.reduce((x, y) => x * y, 1);

  { pool: [2, 2, 3, 3, 5], k: [3, 3], max: 100 },
  { pool: [2, 2, 2, 3, 3, 5, 7], k: [3, 4], max: 400 },
  { pool: [2, 2, 2, 3, 3, 5, 7, 11, 13], k: [4, 5], max: 2000 },

function genNumber(l) {
  for (;;) { const f = []; const k = rnd(...LV[l].k); for (let i = 0; i < k; i++) f.push(pick1(LV[l].pool)); const n = prod(f); if (n <= LV[l].max && n >= 12) return n; }

function genPair(l) {
  for (;;) {

    for (let i = 0, k = rnd(1, l + 2); i < k; i++) c.push(pick1(LV[l].pool));
    for (let i = 0, k = rnd(1, 2); i < k; i++) ea.push(pick1(LV[l].pool));
    for (let i = 0, k = rnd(1, 2); i < k; i++) eb.push(pick1(LV[l].pool));

  nod: { title: 'Найди наибольший общий делитель', item: '7',

  nok: { title: 'Найди наименьшее общее кратное', item: '8',

  setup();
  g.done = () => g.cnt;
  g.hint = () => `Нажимай шаги по порядку: что сначала, что потом.${g.lists.length > 1 ? ` Задание ${g.li + 1} из ${g.lists.length}` : ''}`;
  g.body = () => {
    const cur = g.lists[g.li];
    return `<div class="ask b3 c-orange" style="cursor:default;box-shadow:0 6px 0 var(--orange-d)"><div class="lbl">Расставь по порядку</div><p>${esc(cur.title || 'Порядок действий')}</p></div>
      <div class="order">${cur.items.map((t, k) => (k < g.pos ? `<div class="done-step pop"><b>${k + 1}</b><span>${esc(t)}</span></div>` : '<div class="slot"></div>')).join('')}</div>
      <div class="pool">${g.pool.filter((x) => x.k >= g.pos).map((x) => `<button class="b3 c-card opt${g.flash === 's' + x.k ? ' bad shake' : ''}" data-act="step" data-id="${x.k}">${esc(x.t)}</button>`).join('')}</div>`;
  };
  g.on = (act, id) => {
    if (act !== 'step') return;
    const k = +id, cur = g.lists[g.li];
    if (k < g.pos || g.pos >= cur.items.length) return;
    if (k === g.pos) {
      g.ok(null); g.pos++; g.cnt++; draw();
      if (g.pos === cur.items.length) { if (g.li < g.lists.length - 1) later(() => { g.li++; setup(); draw(); }, 800); else maybeFinish(); }
    } else { g.bad('s' + g.li + '-' + g.pos, `${cur.title}: шаг ${g.pos + 1}`, cur.items[g.pos]); flash('s' + k); }
  };
  return g;
}

/* Разложи по группам: пример появляется по одному, нажать на его группу. */
function makeGroups(L) {
  const groups = L.groups || [];
  const items = shuffle(groups.flatMap((x, gi) => x.items.map((t) => ({ t, gi }))));
  const g = base(items.length);
  g.title = 'Разложи по группам';
  g.items = items; g.k = 0; g.placed = groups.map(() => 0);
  g.done = () => g.k;
  g.hint = () => 'К какой группе это относится?';
  g.body = () => {
    const it = g.items[g.k];
    if (!it) return '';
    return `<div class="ask b3 c-mint" style="cursor:default;box-shadow:0 6px 0 var(--mint-d);color:var(--dark-text)"><div class="lbl">${g.k + 1} из ${g.items.length}</div><p class="pop">${esc(it.t)}</p></div>
      <div class="groups">${groups.map((x, gi) => `<button class="b3 c-card btn${g.flash === 'g' + gi ? ' bad shake' : ''}" data-act="grp" data-id="${gi}" ${g.flash === 'g' + gi ? 'style="--c:var(--bad);--cd:var(--bad-d);color:#fff"' : ''}>${esc(x.name)}<span class="gcount">${g.placed[gi]} из ${x.items.length}</span></button>`).join('')}</div>`;
  };
  g.on = (act, id) => {
    const it = g.items[g.k];
    if (act !== 'grp' || !it) return;
    if (+id === it.gi) { g.ok(null); g.placed[it.gi]++; g.k++; draw(); maybeFinish(); }
    else { g.bad('i' + g.k, it.t, groups[it.gi].name); flash('g' + id); }
  };
  g.review = () => [...g.missed.values()];
  return g;
}

/* Вопрос — ответ: варианты, после ответа видно верный. */
function makeQuiz(L) {
  const qs = shuffle(L.quiz || []).map((x) => { const order = shuffle(x.options.map((o, k) => k)); return { q: x.q, options: order.map((k) => x.options[k]), answer: order.indexOf(x.answer) }; });
  const g = base(qs.length);
  g.title = 'Вопрос — ответ';
  g.qs = qs; g.k = 0; g.picked = null;
  g.done = () => g.k;
  g.hint = () => 'Выбери правильный ответ';
  g.body = () => {
    const q = g.qs[g.k];
    if (!q) return '';
    const shown = g.picked != null;
    return `<div class="ask b3 c-violet" style="cursor:default;box-shadow:0 6px 0 var(--violet-d)"><div class="lbl">${g.k + 1} из ${g.qs.length}</div><p class="pop">${esc(q.q)}</p></div>
      <div class="qopts">${q.options.map((o, k) => {
        const cls = shown && k === q.answer ? ' ok pop' : shown && k === g.picked ? ' bad shake' : '';
        return `<button class="b3 c-card opt${cls}" data-act="qa" data-id="${k}" ${shown ? 'disabled style="filter:none"' : ''}>${esc(o)}</button>`;
      }).join('')}</div>
      ${shown ? '<button class="b3 c-yellow btn" data-act="qnext">Дальше</button>' : ''}`;
  };
  g.on = (act, id) => {
    const q = g.qs[g.k];
    if (!q) return;
    if (act === 'qa' && g.picked == null) {
      g.picked = +id;
      if (g.picked === q.answer) g.ok(null); else g.bad('q' + g.k, q.q, q.options[q.answer]);
      return draw();
    }
    if (act === 'qnext' && g.picked != null) { g.picked = null; g.k++; if (g.k < g.qs.length) draw(); else maybeFinish(); }
  };
  return g;
}

function makeTruth(L) {
  const items = shuffle(L.facts).map((f) => { const t = Math.random() < 0.5; return { text: t ? f.text : f.false, truth: t, right: f.text }; });
  const g = base(items.length);
  g.title = 'Правда или нет';
  g.items = items; g.k = 0; g.shown = null;
  g.done = () => g.k;
  g.hint = () => 'Так написано в параграфе или здесь ошибка?';
  g.body = () => {
    const it = g.items[g.k];
    if (!it) return '';
    return `<div class="ask b3 c-sky" style="cursor:default;box-shadow:0 6px 0 var(--sky-d)"><div class="lbl">${g.k + 1} из ${g.items.length}</div><p class="pop">${esc(it.text)}</p></div>
      ${g.shown ? `<div class="banner pop"><img src="${CAT(g.shown.ok ? 'happy' : 'think')}" alt=""><span>${g.shown.ok ? 'Верно!' : 'Не так.'} ${it.truth ? 'Это правда.' : 'Правильно: ' + esc(it.right)}</span></div>` : ''}
      <div class="row2"><button class="b3 c-mint btn" data-act="ans" data-id="1" ${g.shown ? 'disabled' : ''}>Правда</button><button class="b3 c-pink btn" data-act="ans" data-id="0" ${g.shown ? 'disabled' : ''}>Ошибка</button></div>
      ${g.shown ? '<button class="b3 c-yellow btn" data-act="next-q">Дальше</button>' : ''}`;
  };
  g.on = (act, id) => {
    const it = g.items[g.k];
    if (!it) return;
    if (act === 'ans' && !g.shown) {
      const ok = (id === '1') === it.truth;
      if (ok) g.ok(null); else g.bad('t' + g.k, it.text, it.truth ? 'Это правда' : it.right);
      g.shown = { ok }; return draw();
    }
    if (act === 'next-q' && g.shown) { g.shown = null; g.k++; if (g.k < g.items.length) draw(); else maybeFinish(); }
  };
  return g;
}

/* ===== Стих ===== */
/* Картинки к строфам: посмотреть → вспомнить по картинке → разложить кадры по порядку. */
function makeFrames() {
  const r = curRange() || { a: 0, b: LINES.length - 1 };
  const sc = SCENES.filter((x) => x.b >= r.a && x.a <= r.b)
    .map((x) => ({ ...x, lines: LINES.slice(Math.max(x.a, r.a), Math.min(x.b, r.b) + 1), pic: x.svg() }));
  const withOrder = sc.length >= 3;
  const g = base(sc.length * 2 + (withOrder ? sc.length : 0));
  g.title = 'Картинки к строфам';
  g.sc = sc; g.phase = 'look'; g.i = 0; g.shown = false; g.placed = []; g.pool = [];
  g.done = () => (g.phase === 'look' ? g.i : g.phase === 'recall' ? sc.length + g.i : sc.length * 2 + g.placed.length);
  g.hint = () => ({
    look: 'Прочитай вслух и рассмотри картинку. Что на ней — то и в строках',
    recall: g.shown ? 'Ты так и рассказал? Отметь честно' : 'Посмотри на картинку и расскажи эти строки вслух',
    order: 'Нажимай на картинки по порядку: что было сначала, что потом',
  })[g.phase];
  const text = (lines, hidden) => `<div class="page verse frame-text">${lines.map((l) => hidden
    ? `<span class="ln hidden">${esc(l.t)}</span>` : `<span class="ln">${esc(l.t)}</span>`).join('')}</div>`;
  g.body = () => {
    if (g.phase === 'order') {
      return `<div class="strip">${sc.map((x, k) => `<span class="${k < g.placed.length ? 'on' : ''}">${k + 1}${k < g.placed.length ? ' ✓' : ''}</span>`).join('')}</div>
        <div class="thumbs">${g.pool.filter((k) => !g.placed.includes(k)).map((k) =>
          `<button class="thumb${g.flash === 't' + k ? ' bad shake' : ''}" data-act="thumb" data-id="${k}" aria-label="Картинка">${sc[k].pic}</button>`).join('')}</div>`;
    }
    const x = sc[g.i];
    const cap = `<div class="scene-cap"><h3>${g.phase === 'look' || g.shown ? esc(x.title) : 'Что здесь происходит?'}</h3><span class="n">${g.i + 1} / ${sc.length}</span></div>`;
    if (g.phase === 'look') {
      return `<div class="scene${g.just === g.i ? ' pop' : ''}">${x.pic}</div>${cap}${text(x.lines, false)}
        <div class="row2">${g.i > 0 ? '<button class="b3 c-card btn" data-act="prev">Назад</button>' : ''}
          <button class="b3 c-yellow btn" data-act="next">${g.i < sc.length - 1 ? 'Дальше' : 'Теперь вспоминай!'}</button></div>`;
    }
    return `<div class="scene${g.just === g.i ? ' pop' : ''}">${x.pic}</div>${cap}${text(x.lines, !g.shown)}
      <div class="row2">${g.shown
        ? '<button class="b3 c-pink btn" data-act="miss">Сбился</button><button class="b3 c-mint btn" data-act="ok">Рассказал</button>'
        : '<button class="b3 c-violet btn" data-act="show">Проверить</button>'}</div>`;
  };
  g.on = (act, id) => {
    if (g.phase === 'look') {
      if (act === 'prev' && g.i > 0) { g.i--; g.just = g.i; return draw(); }
      if (act !== 'next') return;
      g.score += 5; g.bumped = true; sfx('tap');
      if (g.i < sc.length - 1) { g.i++; g.just = g.i; return draw(); }
      g.phase = 'recall'; g.i = 0; g.just = 0; window.scrollTo(0, 0); toast('Теперь вспоминай по картинкам'); return draw();
    }
    if (g.phase === 'recall') {
      if (act === 'show') { g.shown = true; sfx('tap'); return draw(); }
      if (act !== 'ok' && act !== 'miss') return;
      const x = sc[g.i];
      if (act === 'ok') g.ok(null); else g.bad('f' + g.i, x.lines.map((l) => l.t).join('\n'), x.title);
      g.shown = false;
      if (g.i < sc.length - 1) { g.i++; g.just = g.i; window.scrollTo(0, 0); return draw(); }
      if (!withOrder) { g.i = sc.length; return maybeFinish(); }
      g.phase = 'order'; g.i = sc.length; g.pool = shuffle(sc.map((_, k) => k)); window.scrollTo(0, 0); toast('Разложи картинки по порядку'); return draw();
    }
    if (g.phase === 'order' && act === 'thumb') {
      const k = +id;
      if (g.placed.includes(k) || g.placed.length >= sc.length) return;
      if (k === g.placed.length) { g.placed.push(k); g.ok(null); draw(); maybeFinish(); }
      else { g.bad('o' + g.placed.length, 'Что было после кадра «' + (g.placed.length ? sc[g.placed.length - 1].title : 'начало') + '»?', sc[g.placed.length].title); flash('t' + k); }
    }
  };
  g.head = () => { const n = g.stars(); return n === 3 ? 'Картинки запомнились!' : n === 2 ? 'Хорошо! Пересмотри трудные кадры' : 'Посмотри картинки ещё раз'; };
  return g;
}

function makeFade() {
  const g = base(5);
  g.title = 'Исчезающий текст';
  g.lines = selLines(); g.level = 0; g.peek = new Set(); g.peeks = 0; g.rank = {};
  g.lines.forEach((l) => { let k = 0; tokens(l.t).forEach((t) => { if (t.w) g.rank[l.i + ':' + k++] = Math.random(); }); });
  g.done = () => g.level;
  g.hint = () => [
    'Прочитай отрывок вслух два раза. Потом нажми «Спрятать слова»',
    'Читай вслух, пропуски говори по памяти. Забыл — нажми на пропуск',
    'Спрятана половина. Читай вслух!',
    'Спрятаны почти все слова. Получится!',
    'Остались первые буквы. Читай целиком',
    'Только первое слово строки. Рассказал? Жми «Готово»',
  ][g.level];
  const hide = (key, first) => (g.level === 0 ? false : g.level === 5 ? !first : g.level === 4 ? true : g.rank[key] < g.level * 0.25);
  g.body = () => {
    const html = verseHtml(g.lines, (l) => {
      let k = 0;
      const parts = tokens(l.t).map((t) => {
        if (!t.w) return { s: t.s };
        const key = l.i + ':' + k, first = k === 0; k++;
        if (!hide(key, first)) return { h: esc(t.s) };
        if (g.peek.has(key)) return { h: `<button class="w-hid peek" data-act="peek" data-id="${key}">${esc(t.s)}</button>` };
        const shown = g.level === 5 ? '' : t.s[0];
        return { h: `<button class="w-hid" data-act="peek" data-id="${key}" aria-label="Подсказка">${esc(shown)}<span class="w-mute">${'_'.repeat(Math.max(2, Math.round((t.s.length - shown.length) * 0.6)))}</span></button>` };
      });
      // Знак препинания сразу после слова не должен уезжать на новую строку.
      return parts.map((p, n) => {
        if (p.h == null) { const prev = parts[n - 1]; return esc(prev && prev.h != null ? p.s.replace(/^[^\s]*/, '') : p.s); }
        const nx = parts[n + 1], punct = nx && nx.h == null ? (nx.s.match(/^[^\s]*/) || [''])[0] : '';
        return punct ? `<span style="white-space:nowrap">${p.h}${esc(punct)}</span>` : p.h;
      }).join('');
    });
    return `<div class="page verse">${html}</div>
      <div class="dots">${[1, 2, 3, 4, 5].map((n) => `<i class="${n <= g.level ? 'on' : ''}"></i>`).join('')}</div>
      <div class="row2">
        <button class="b3 c-card btn" data-act="less" ${g.level === 0 ? 'disabled' : ''}>Показать</button>
        ${g.level < 5 ? '<button class="b3 c-violet btn" data-act="more">Спрятать слова</button>' : '<button class="b3 c-mint btn" data-act="fin">Готово</button>'}
      </div>`;
  };
  g.on = (act, id) => {
    if (act === 'peek') { if (g.peek.has(id)) g.peek.delete(id); else { g.peek.add(id); g.peeks++; } sfx('tap'); return draw(); }
    if (act === 'more') { g.level++; g.peek.clear(); g.score += 10; g.bumped = true; sfx('ok'); return draw(); }
    if (act === 'less') { g.level--; g.peek.clear(); return draw(); }
    if (act === 'fin') { g.level = 5; g.right = 5; maybeFinish(); }
  };
  g.stars = () => (g.peeks <= 2 ? 3 : g.peeks <= 6 ? 2 : 1);
  g.stat = () => (g.peeks ? `Подсмотрел ${g.peeks} ${plural(g.peeks, 'раз', 'раза', 'раз')}` : 'Ни разу не подсмотрел!');
  g.review = () => [];
  return g;
}

function makeBuild() {
  const lines = selLines(), units = [];
  let cur = [];
  lines.forEach((l, k) => {
    cur.push(l);
    const n = cur.reduce((s, x) => s + wordsOf(x.t).length, 0);
    const nextSame = lines[k + 1] && lines[k + 1].st === l.st;
    if (n >= 4 || !nextSame) { units.push(cur); cur = []; }
  });
  if (cur.length) units.push(cur);
  const g = base(units.length);
  g.title = 'Собери строку';
  g.units = units; g.u = 0;
  const setup = () => { g.words = g.units[g.u].flatMap((l) => wordsOf(l.t)); g.pos = 0; g.chips = shuffle(g.words.map((w) => ({ w }))); g.used = new Set(); };
  setup();
  g.done = () => g.u;
  g.hint = () => 'Нажимай на слова по порядку. Знаки препинания встанут сами';
  g.body = () => {
    const unit = g.units[g.u], prev = g.u > 0 ? g.units[g.u - 1] : [];
    let left = g.pos;
    const built = unit.map((l) => {
      let s = '';
      for (const t of tokens(l.t)) { if (t.w) { if (left <= 0) break; left--; s += esc(t.s); } else if (s) s += esc(t.s); }
      return s;
    });
    let at = 0; built.forEach((s, k) => { if (s) at = k; });
    const html = prev.map((l) => `<span class="ln ctx">${esc(l.t)}</span>`).join('')
      + built.map((s, k) => `<span class="ln">${s}${k === at ? '<span class="cursor"></span>' : ''}</span>`).join('');
    return `<div class="page built">${html}</div>
      <div class="chips">${g.chips.map((c, j) => g.used.has(j) ? '' : `<button class="b3 c-sky wchip${g.flash === 'c' + j ? ' shake' : ''}" data-act="chip" data-id="${j}" ${g.flash === 'c' + j ? 'style="--c:var(--bad);--cd:var(--bad-d)"' : ''}>${esc(c.w)}</button>`).join('')}</div>`;
  };
  g.on = (act, id) => {
    const j = +id, c = g.chips[j];
    if (g.pos >= g.words.length || g.used.has(j)) return;
    if (norm(c.w) === norm(g.words[g.pos])) {
      g.used.add(j); g.pos++;
      if (g.pos === g.words.length) {
        g.ok(null); draw();
        if (g.u < g.units.length - 1) later(() => { g.u++; setup(); draw(); }, 650); else { g.u++; maybeFinish(); }
        return;
      }
      sfx('tap'); draw();
    } else {
      g.bad('u' + g.u, g.units[g.u].map((l) => l.t).join('\n'), '');
      flash('c' + j);
    }
  };
  return g;
}

function makeNext() {
  const lines = selLines(), tasks = [];
  lines.forEach((l, k) => { if (k < lines.length - 1) tasks.push({ prev: l, next: lines[k + 1], before: lines[k - 1] }); });
  const g = base(Math.max(tasks.length, 1));
  g.title = 'Что дальше?';
  g.tasks = tasks; g.t = 0;
  const setup = () => {
    const { prev, next } = g.tasks[g.t];
    const pool = LINES.filter((l) => l.i !== next.i && l.i !== prev.i && wordsOf(l.t).length > 1)
      .sort((a, b) => Math.abs(a.i - next.i) - Math.abs(b.i - next.i)).slice(0, 6);
    g.opts = shuffle([next, ...shuffle(pool).slice(0, 2)]); g.okShown = false;
  };
  if (tasks.length) setup();
  g.done = () => g.t;
  g.hint = () => 'Какая строка идёт дальше?';
  g.body = () => {
    if (!g.tasks.length) return '<p>Выбери отрывок хотя бы из двух строк.</p>';
    const { prev, next, before } = g.tasks[g.t];
    return `<div class="prompt"><div class="lbl">${g.t + 1} из ${g.tasks.length}</div>
        <div class="v">${before ? `<span class="faint">${esc(before.t)}</span><br>` : ''}${esc(prev.t)}<br>…</div></div>
      <div class="opts">${g.opts.map((o) => {
        const cls = g.okShown && o.i === next.i ? ' ok pop' : g.flash === 'o' + o.i ? ' bad shake' : '';
        return `<button class="b3 c-card opt${cls}" data-act="opt" data-id="${o.i}">${esc(o.t)}</button>`;
      }).join('')}</div>`;
  };
  g.on = (act, id) => {
    if (g.okShown || g.t >= g.tasks.length) return;
    const { prev, next } = g.tasks[g.t];
    if (+id === next.i) {
      g.ok(null); g.okShown = true; draw();
      later(() => { g.t++; if (g.t < g.tasks.length) { setup(); draw(); } else maybeFinish(); }, 650);
    } else { g.bad('n' + next.i, prev.t + '\n' + next.t, ''); flash('o' + id); }
  };
  return g;
}

function makeGap() {
  const lines = selLines().filter((l) => wordsOf(l.t).some((w) => w.length >= 4));
  const all = [...new Set(LINES.flatMap((l) => wordsOf(l.t)).filter((w) => w.length >= 4))];
  const g = base(Math.max(lines.length, 1));
  g.title = 'Пропущенное слово';
  g.items = shuffle(lines).map((l) => {
    const target = wordsOf(l.t).reduce((a, b) => (b.length > a.length ? b : a));
    const others = shuffle(all.filter((w) => norm(w) !== norm(target) && Math.abs(w.length - target.length) <= 3)).slice(0, 3);
    return { l, target, opts: shuffle([target, ...others]) };
  });
  g.k = 0; g.okShown = false;
  g.done = () => g.k;
  g.hint = () => 'Какое слово выпало из строки?';
  g.body = () => {
    if (!g.items.length) return '<p>В отрывке нет подходящих строк.</p>';
    const it = g.items[g.k];
    let rep = false;
    const line = tokens(it.l.t).map((t) => {
      if (t.w && !rep && t.s === it.target) { rep = true; return g.okShown ? `<b class="pop" style="display:inline-block">${esc(t.s)}</b>` : '<span class="blank">&nbsp;</span>'; }
      return esc(t.s);
    }).join('');
    const prev = LINES[it.l.i - 1] && LINES[it.l.i - 1].st === it.l.st ? LINES[it.l.i - 1].t : '';
    return `<div class="prompt"><div class="lbl">${g.k + 1} из ${g.items.length}</div>
        <div class="v">${prev ? `<span class="faint">${esc(prev)}</span><br>` : ''}${line}</div></div>
      <div class="opts">${it.opts.map((w, j) => {
        const cls = g.okShown && w === it.target ? ' ok' : g.flash === 'w' + j ? ' bad shake' : '';
        return `<button class="b3 c-card opt${cls}" data-act="opt" data-id="${j}">${esc(w.toLowerCase())}</button>`;
      }).join('')}</div>`;
  };
  g.on = (act, id) => {
    if (g.okShown || g.k >= g.items.length) return;
    const it = g.items[g.k];
    if (it.opts[+id] === it.target) {
      g.ok(null); g.okShown = true; draw();
      later(() => { g.okShown = false; g.k++; if (g.k < g.items.length) draw(); else maybeFinish(); }, 750);
    } else { g.bad('g' + it.l.i, it.l.t, it.target.toLowerCase()); flash('w' + id); }
  };
  return g;
}

function makeRecite() {
  const lines = selLines();
  const g = base(lines.length);
  g.title = 'Расскажи наизусть';
  g.lines = lines; g.k = 0; g.state = {}; g.open = false;
  g.done = () => g.k;
  g.hint = () => (g.open ? 'Ты сказал так же? Отметь честно' : 'Скажи следующую строку вслух, потом открой и проверь себя');
  g.body = () => {
    const html = verseHtml(g.lines, (l) => {
      const k = g.lines.indexOf(l), st = g.state[l.i];
      if (k < g.k) return st === 'miss' ? `<span class="ln miss" style="display:inline">${esc(l.t)}</span>` : `${esc(l.t)} <span class="ok-mark">✓</span>`;
      if (k === g.k && g.open) return `<span class="pop" style="display:inline-block">${esc(l.t)}</span>`;
      return `<span class="ln hidden${k === g.k ? ' cur' : ''}" aria-label="Скрытая строка">${esc(l.t)}</span>`;
    });
    return `<div class="page verse recite">${html}</div>
      <div class="row2">${g.open
        ? '<button class="b3 c-pink btn" data-act="miss">Ошибся</button><button class="b3 c-mint btn" data-act="ok">Сказал верно</button>'
        : '<button class="b3 c-violet btn" data-act="open">Открыть строку</button>'}</div>`;
  };
  g.on = (act) => {
    if (g.k >= g.lines.length) return;
    if (act === 'open') { g.open = true; sfx('tap'); return draw(); }
    const l = g.lines[g.k];
    if (act === 'ok') { g.ok(null); g.state[l.i] = 'ok'; }
    if (act === 'miss') { g.bad('r' + l.i, l.t, ''); g.state[l.i] = 'miss'; }
    g.k++; g.open = false; draw(); maybeFinish();
  };
  g.head = () => { const n = g.stars(); return n === 3 ? 'Ты выучил отрывок!' : n === 2 ? 'Почти! Повтори строки с ошибками' : 'Пройди ещё раз «Исчезающий текст»'; };
  g.stat = () => { const n = g.total - g.missed.size; return `Без ошибок: ${n} ${plural(n, 'строка', 'строки', 'строк')} из ${g.total}`; };
  return g;
}

const stripNum = (t) => String(t || '').replace(/^\s*(?:[0-9]{1,2}|[а-яa-z])\s*[).:]\s*|^\s*[•\-–—]\s*/i, '').trim();
let myLessons = (store.get('lessons') || []).map((L) => (L.steps ? { ...L, steps: L.steps.map((st) => ({ ...st, items: (st.items || []).map(stripNum) })) } : L));

function subjectKeyOf(name, kind) {
  if (kind === 'poem') return 'literature';
  const n = String(name || '').toLowerCase();
  const table = [['истор', 'history'], ['литер', 'literature'], ['геогр', 'geography'], ['биол', 'biology'], ['матем', 'math'], ['алгебр', 'math'],
    ['геометр', 'math'], ['русск', 'russian'], ['англ', 'english'], ['обществ', 'social'], ['физик', 'physics'], ['хим', 'chemistry'], ['окружающ', 'world']];
  const hit = table.find(([k]) => n.includes(k));
  return hit ? hit[1] : 'other';
}
const subjectOf = (key, L) => SUBJECTS[key] || { name: (L && L.subjectName) || 'Другое', pic: 'book', bg: '#f1ebe2' };

  }
  const key = subjectKeyOf(x.subject, x.kind), years = (x.events || []).map((e) => e.year);
  return { id, kind: 'history', color: 'c-pink', subjectKey: key, subjectName: x.subject, subject: subjectOf(key).name === 'Другое' ? (x.subject || 'Параграф') : subjectOf(key).name,
    title: x.title, years: years.length ? (years.length > 1 ? `${Math.min(...years)}–${Math.max(...years)}` : String(years[0])) : '',
    persons: (x.persons || []).map((p, k) => ({ id: 'p' + k, name: p.name, text: p.text })),
    terms: (x.terms || []).map((t, k) => ({ id: 't' + k, term: t.term, text: t.text })),
    events: (x.events || []).map((e, k) => ({ id: 'e' + k, year: e.year, text: e.text })),
    facts: x.facts || [], words: x.words || [], steps: (x.steps || []).map((st) => ({ ...st, items: (st.items || []).map(stripNum) })), groups: x.groups || [], quiz: x.quiz || [], mathTopics: x.mathTopics || [], questions: x.questions || [], map: null, fromPhoto: true, created: Date.now() };
}
