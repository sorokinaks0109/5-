<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Смутное время в играх</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Ruslan+Display&display=swap">
<style>
/* Макет: одна узкая колонка как в телефоне; сверху параграф, ниже игры. Название — древнерусским шрифтом, всё остальное спокойное. */
:root {
  --bg: #f2f4f9;
  --surface: #ffffff;
  --ink: #18203a;
  --muted: #5a6482;
  --line: #dce1ee;
  --accent: #2b4fd8;
  --accent-soft: #e3e8fc;
  --on-accent: #ffffff;
  --gold: #d4930c;
  --ok: #1d8752;
  --ok-soft: #dcf2e5;
  --bad: #cc3a2e;
  --bad-soft: #fbe2df;
  --land: #e9eedf;
  --water: #8db6e3;
  --font-display: "Ruslan Display", "Golos Text", Georgia, serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131d; --surface: #182031; --ink: #e8ecf6; --muted: #9aa4c0; --line: #2a3450;
    --accent: #8098ff; --accent-soft: #232f58; --on-accent: #0c1330; --gold: #f0b73a;
    --ok: #4cc488; --ok-soft: #173a29; --bad: #ff7d6e; --bad-soft: #43221f;
    --land: #1c2622; --water: #3a6496; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131d; --surface: #182031; --ink: #e8ecf6; --muted: #9aa4c0; --line: #2a3450;
  --accent: #8098ff; --accent-soft: #232f58; --on-accent: #0c1330; --gold: #f0b73a;
  --ok: #4cc488; --ok-soft: #173a29; --bad: #ff7d6e; --bad-soft: #43221f;
  --land: #1c2622; --water: #3a6496; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2 { text-wrap: balance; margin: 0; }

/* Главный экран */
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.lesson { display: grid; gap: 6px; padding-block: 8px 20px; }
.lesson h1 { font: 400 40px/1.1 var(--font-display); letter-spacing: .01em; }
.lesson .years { font-size: 18px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
.demo {
  display: grid; gap: 10px; padding: 14px 16px; margin-bottom: 22px;
  border: 1.5px dashed var(--line); border-radius: var(--radius); color: var(--muted); font-size: 14px;
}
.demo p { margin: 0; }
.photo-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px; border-radius: 12px; border: 0; background: var(--accent-soft); color: var(--muted);
  font-weight: 600; cursor: not-allowed;
}
.games { display: grid; gap: 12px; }
.game-card {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px;
  width: 100%; text-align: left; padding: 16px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line);
  transition: transform .12s ease, border-color .12s ease;
}
.game-card:hover { border-color: var(--accent); }
.game-card:active { transform: scale(.98); }
.game-card .kind { grid-column: 1 / -1; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.game-card .name { font-size: 20px; font-weight: 700; }
.game-card .sub { grid-column: 1; color: var(--muted); font-size: 14px; min-width: 0; }
.game-card .best { grid-column: 2; grid-row: 2 / 4; display: flex; gap: 2px; }
.star { width: 18px; height: 18px; }
.star path { fill: var(--line); }
.star.on path { fill: var(--gold); }
.foot { margin-top: 24px; color: var(--muted); font-size: 13px; }

/* Шапка игры */
.top { display: grid; gap: 10px; margin-bottom: 16px; }
.top-row { display: flex; align-items: center; gap: 10px; }
.back { border: 0; background: none; padding: 6px 0; color: var(--accent); font-weight: 600; }
.top-row .count { margin-left: auto; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.top h2 { font-size: 24px; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.hint { color: var(--muted); font-size: 15px; margin: 0 0 14px; }

/* Общие плашки */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 9px 14px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface);
  font-weight: 600; font-size: 15px;
}
.chip.sel { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.chip.done { opacity: .35; pointer-events: none; text-decoration: line-through; }

/* Соедини */
.deeds { display: grid; gap: 8px; margin-top: 16px; }
.deed {
  display: grid; gap: 4px; width: 100%; text-align: left; padding: 12px 14px;
  border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 15px;
}
.deed.sel { border-color: var(--accent); background: var(--accent-soft); }
.deed.ok { border-color: var(--ok); background: var(--ok-soft); pointer-events: none; }
.deed.bad { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s; }
.deed .who { font-weight: 700; color: var(--ok); font-size: 14px; }

/* Мемори */
.memo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mcard {
  min-height: 108px; padding: 12px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--surface); display: grid; align-content: center; gap: 4px; text-align: center;
  font-size: 14px; line-height: 1.3; transition: transform .2s ease, background .2s ease;
}
.mcard.back {
  background: var(--accent);
  background-image: radial-gradient(circle at 50% 50%, transparent 0 18px, rgba(255,255,255,.12) 19px 21px, transparent 22px),
    repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 6px, transparent 6px 12px);
  border-color: transparent; color: var(--on-accent); font: 400 26px var(--font-display);
}
.mcard.open { border-color: var(--accent); transform: scale(1.02); }
.mcard.term .t { font-size: 17px; font-weight: 700; }
.mcard .lbl { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.mcard.matched { border-color: var(--ok); background: var(--ok-soft); opacity: .75; }
.mcard.miss { border-color: var(--bad); background: var(--bad-soft); }

/* Лента времени */
.current {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2;
  padding: 14px 16px; margin-bottom: 14px; border-radius: var(--radius);
  background: var(--accent); color: var(--on-accent); box-shadow: 0 8px 20px -12px rgba(20,30,70,.6);
}
.current .lbl { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
.current p { margin: 4px 0 0; font-size: 17px; font-weight: 600; }
.tl { list-style: none; margin: 0; padding: 0; position: relative; display: grid; gap: 8px; }
.tl::before { content: ""; position: absolute; left: 39px; top: 8px; bottom: 8px; width: 3px; background: var(--line); border-radius: 3px; }
.tl li { display: grid; grid-template-columns: 82px 1fr; gap: 10px; align-items: center; min-height: 48px; }
.year {
  position: relative; z-index: 1; width: 82px; padding: 10px 0; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--surface);
  font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums;
}
.year:hover { border-color: var(--accent); }
.year.ok { background: var(--ok); border-color: var(--ok); color: var(--surface); pointer-events: none; }
.year.bad { background: var(--bad-soft); border-color: var(--bad); animation: shake .35s; }
.tl .txt { font-size: 15px; min-width: 0; }
.tl .txt.empty { height: 2px; border-bottom: 1.5px dashed var(--line); }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* Карта */
.mapbox { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: var(--land); margin-bottom: 14px; }
.mapbox svg { display: block; width: 100%; height: auto; }
.m-land { fill: var(--land); }
.m-river { fill: none; stroke: var(--water); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.m-lake { fill: var(--water); }
.m-cap { fill: var(--muted); font: 600 15px var(--font-body); }
.m-scale { stroke: var(--muted); stroke-width: 2; fill: none; }
.pt { cursor: pointer; }
.pt .hit { fill: transparent; }
.pt .dot { fill: var(--surface); stroke: var(--ink); stroke-width: 3; transition: r .15s ease; }
.pt.sel .dot { fill: var(--accent); stroke: var(--accent); }
.pt.ok .dot { fill: var(--ok); stroke: var(--ok); }
.pt.bad .dot { fill: var(--bad); stroke: var(--bad); }
.pt:hover .dot { stroke: var(--accent); }
.pt text { fill: var(--ink); font: 700 19px var(--font-body); paint-order: stroke; stroke: var(--land); stroke-width: 5px; stroke-linejoin: round; pointer-events: none; }
.question { padding: 14px 16px; border-radius: var(--radius); background: var(--accent); color: var(--on-accent); margin-bottom: 14px; font-size: 17px; font-weight: 600; }
.question .lbl { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; opacity: .8; margin-bottom: 4px; }

/* Итог */
.result { display: grid; gap: 16px; justify-items: center; text-align: center; padding-top: 24px; }
.result .stars { display: flex; gap: 6px; }
.result .star { width: 54px; height: 54px; }
.result .star.on { animation: pop .45s ease backwards; }
.result .star.on:nth-child(2) { animation-delay: .15s; }
.result .star.on:nth-child(3) { animation-delay: .3s; }
@keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.2); } }
.result h2 { font-size: 26px; }
.result .stat { color: var(--muted); font-variant-numeric: tabular-nums; }
.review { width: 100%; text-align: left; display: grid; gap: 8px; }
.review h3 { margin: 8px 0 0; font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.review .item { padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: 15px; }
.review .item b { display: block; color: var(--ok); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%; }
.btn { padding: 13px 22px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.main { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

#toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
  max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 12px;
  background: var(--ink); color: var(--bg); font-weight: 600; font-size: 15px;
  opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 10;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

const $app = document.getElementById('app');
const $toast = document.getElementById('toast');
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('trener:' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('trener:' + k, JSON.stringify(v)); } catch (e) { /* без памяти тоже работает */ } },

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function shuffle(a) {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function chunk(a, n) {
  const k = Math.ceil(a.length / n), size = Math.ceil(a.length / k), out = [];
  for (let i = 0; i < a.length; i += size) out.push(a.slice(i, i + size));

}

const STAR = '<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/>';

const plural = (n, one, few, many) => {
  const m10 = n % 10, m100 = n % 100;
  return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many;
};

/* ---------- Игры ---------- */
let game = null;

// Общая основа: счёт верных и неверных, список того, на чём ошибся.
function base(total) {
  return {
    total, right: 0, wrong: 0, missed: new Map(), flash: null, finished: false,
    miss(key, q, right) { this.wrong++; if (!this.missed.has(key)) this.missed.set(key, { q, right }); },
    stars() {
      const first = (this.total - this.missed.size) / this.total;
      return first >= 0.9 ? 3 : first >= 0.6 ? 2 : 1;
    },
  };
}
function flash(id, cls, ms = 650) {
  game.flash = { id, cls }; draw();
  const g = game;
  setTimeout(() => { if (game === g && g.flash && g.flash.id === id) { g.flash = null; draw(); } }, ms);
}
function maybeFinish() {
  if (game.done() < game.total) return;
  const g = game;
  setTimeout(() => {
    if (game !== g) return;
    g.finished = true;
    const best = store.get('best') || {};
    best[g.id] = Math.max(best[g.id] || 0, g.stars());
    store.set('best', best);
    draw();
  }, 700);
}

const GAMES = [
  { id: 'match', kind: 'Пары', name: 'Соедини', sub: 'Кто что сделал: 10 деятелей Смуты', make: makeMatch },
  { id: 'memory', kind: 'Пары', name: 'Мемори', sub: 'Найди термин и его значение', make: makeMemory },
  { id: 'timeline', kind: 'Порядок', name: 'Лента времени', sub: 'Расставь 9 событий по годам', make: makeTimeline },
  { id: 'map', kind: 'Карта', name: 'Карта Смуты', sub: 'Подпиши города и найди, где что было', make: makeMap },
];

/* Соедини: деятель → что он сделал */
function makeMatch() {
  const g = base(LESSON.persons.length);
  g.title = 'Соедини';
  g.rounds = chunk(shuffle(LESSON.persons), 5);
  g.r = 0; g.doneIds = new Set();
  const setup = () => { const items = g.rounds[g.r]; g.left = shuffle(items); g.deeds = shuffle(items); g.sel = null; };
  setup();
  g.done = () => g.doneIds.size;
  g.hint = () => `Нажми на имя, потом на то, что этот человек сделал. Раунд ${g.r + 1} из ${g.rounds.length}.`;
  g.body = () => `
    <div class="chips">${g.left.map((p) => `<button class="chip${g.doneIds.has(p.id) ? ' done' : ''}${g.sel && g.sel.side === 'l' && g.sel.id === p.id ? ' sel' : ''}" data-act="l" data-id="${p.id}">${esc(p.name)}</button>`).join('')}</div>
    <div class="deeds">${g.deeds.map((p) => {
      const ok = g.doneIds.has(p.id), bad = g.flash && g.flash.id === p.id;
      const sel = g.sel && g.sel.side === 'r' && g.sel.id === p.id;
      return `<button class="deed${ok ? ' ok' : ''}${sel ? ' sel' : ''}${bad ? ' bad' : ''}" data-act="r" data-id="${p.id}">${ok ? `<span class="who">${esc(p.name)}</span>` : ''}${esc(p.text)}</button>`;
    }).join('')}</div>`;
  g.on = (side, id) => {
    if (g.doneIds.has(id)) return;
    if (!g.sel || g.sel.side === side) { g.sel = { side, id }; return draw(); }
    const name = side === 'l' ? id : g.sel.id, deed = side === 'r' ? id : g.sel.id;
    g.sel = null;
    if (name === deed) {
      g.right++; g.doneIds.add(name);
      if (g.rounds[g.r].every((p) => g.doneIds.has(p.id)) && g.r < g.rounds.length - 1) {
        draw(); setTimeout(() => { if (game === g) { g.r++; setup(); draw(); } }, 600); return;
      }
      draw(); maybeFinish();
    } else {
      const p = LESSON.persons.find((x) => x.id === name);
      g.miss(name, p.name, p.text);
      flash(deed, 'bad');
    }
  };
  g.review = () => [...g.missed.values()];
  return g;
}

/* Мемори: термин ↔ значение */
function makeMemory() {
  const g = base(LESSON.terms.length);
  g.title = 'Мемори';
  g.rounds = chunk(shuffle(LESSON.terms), 4);
  g.r = 0; g.pairs = 0; g.open = []; g.lock = false;
  const setup = () => {
    g.cards = shuffle(g.rounds[g.r].flatMap((t) => [
      { pid: t.id, type: 'term', text: t.term }, { pid: t.id, type: 'def', text: t.text },
    ]));
    g.open = [];
  };
  setup();
  g.done = () => g.pairs;
  g.hint = () => `Открывай по две карточки и ищи пару: термин и его значение. Раунд ${g.r + 1} из ${g.rounds.length}.`;
  g.body = () => `<div class="memo">${g.cards.map((c, i) => {
    const shown = c.matched || g.open.includes(i);
    if (!shown) return `<button class="mcard back" data-act="card" data-id="${i}" aria-label="Закрытая карточка">?</button>`;
    const miss = g.lock && g.open.includes(i);
    return `<button class="mcard ${c.type}${c.matched ? ' matched' : ' open'}${miss ? ' miss' : ''}" data-act="card" data-id="${i}">
      <span class="lbl">${c.type === 'term' ? 'термин' : 'значение'}</span><span class="t">${esc(c.text)}</span></button>`;
  }).join('')}</div>`;
  g.on = (act, id) => {
    const i = +id, c = g.cards[i];
    if (g.lock || c.matched || g.open.includes(i)) return;
    g.open.push(i);
    if (g.open.length < 2) return draw();
    const [a, b] = g.open.map((k) => g.cards[k]);
    if (a.pid === b.pid) {
      a.matched = b.matched = true; g.open = []; g.right++; g.pairs++;
      if (g.cards.every((x) => x.matched) && g.r < g.rounds.length - 1) {
        draw(); setTimeout(() => { if (game === g) { g.r++; setup(); draw(); } }, 700); return;
      }
      draw(); maybeFinish();
    } else {
      g.wrong++; g.lock = true; draw();
      setTimeout(() => { if (game === g) { g.open = []; g.lock = false; draw(); } }, 1400);
    }
  };
  // В мемори промахи неизбежны: считаем их относительно числа пар.
  g.stars = () => { const k = g.wrong / g.total; return k <= 1 ? 3 : k <= 2 ? 2 : 1; };
  g.stat = () => `Пар: ${g.total} · промахов: ${g.wrong}`;
  g.review = () => LESSON.terms.map((t) => ({ q: t.term.replace('­', ''), right: t.text }));
  g.reviewTitle = 'Все термины параграфа';
  return g;
}

/* Лента времени: событие → год */
function makeTimeline() {
  const g = base(LESSON.events.length);
  g.title = 'Лента времени';
  g.queue = shuffle(LESSON.events);
  g.placed = new Set();
  g.done = () => g.placed.size;
  g.hint = () => 'Нажми на год, когда это случилось.';
  g.body = () => {
    const cur = g.queue[0];
    const years = [...LESSON.events].sort((a, b) => a.year - b.year);
    return `
      ${cur ? `<div class="current"><div class="lbl">Когда это было?</div><p>${esc(cur.text)}</p></div>` : ''}
      <ol class="tl">${years.map((e) => {
        const ok = g.placed.has(e.id), bad = g.flash && g.flash.id === e.id;
        return `<li><button class="year${ok ? ' ok' : ''}${bad ? ' bad' : ''}" data-act="year" data-id="${e.id}">${e.year}</button>
          <div class="txt${ok ? '' : ' empty'}">${ok ? esc(e.text) : ''}</div></li>`;
      }).join('')}</ol>`;
  };
  g.on = (act, id) => {
    const cur = g.queue[0];
    if (!cur || g.placed.has(id)) return;
    if (id === cur.id) {
      g.right++; g.placed.add(id); g.queue.shift(); draw(); maybeFinish();
    } else {
      g.miss(cur.id, cur.text, String(cur.year));
      flash(id, 'bad');
    }
  };
  g.review = () => [...g.missed.values()];
  return g;
}

/* Карта: сначала подписать города, потом найти, где что было */
const MAP_W = 640, MAP_H = 360, K = 62;
const proj = (lon, lat) => [Math.round((lon - 27.5) * 0.56 * K), Math.round((59.2 - lat) * K)];

function mapSvg(g, labeled) {
  const M = LESSON.map;
  const rivers = M.rivers.map((r) => `<polyline class="m-river" points="${r.map((p) => proj(...p).join(',')).join(' ')}"/>`).join('');
  const [lx, ly] = proj(31.3, 58.25);
  const km100 = Math.round(K * 100 / 111);
  const pts = M.points.map((p) => {
    const [x, y] = proj(p.lon, p.lat);
    const cls = g.flash && g.flash.id === p.id ? g.flash.cls : g.sel === p.id ? 'sel' : labeled(p.id) && g.phase === 'label' ? 'ok' : '';
    const label = labeled(p.id) ? `<text x="${x + p.dx}" y="${y + p.dy}" text-anchor="${p.anchor}">${esc(p.name)}</text>` : '';
    return `<g class="pt ${cls}" data-act="pt" data-id="${p.id}" role="button" tabindex="0" aria-label="${labeled(p.id) ? esc(p.name) : 'Точка на карте'}">
      <circle class="hit" cx="${x}" cy="${y}" r="22"/><circle class="dot" cx="${x}" cy="${y}" r="${cls ? 11 : 9}"/>${label}</g>`;
  }).join('');
  return `<div class="mapbox"><svg viewBox="0 0 ${MAP_W} ${MAP_H}" role="img" aria-label="Схема: Русское государство в начале XVII века">
    <rect class="m-land" width="${MAP_W}" height="${MAP_H}"/>
    <ellipse class="m-lake" cx="${lx}" cy="${ly}" rx="16" ry="10"/>
    ${rivers}
    <text class="m-cap" x="${proj(41.6, 57.6)[0]}" y="${proj(41.6, 57.6)[1] + 30}">р. Волга</text>
    <text class="m-cap" x="${proj(39.9, 54.4)[0]}" y="${proj(39.9, 54.4)[1] + 8}">р. Ока</text>
    <text class="m-cap" x="${proj(28.2, 53.8)[0]}" y="${proj(28.2, 53.8)[1] + 6}">р. Днепр</text>
    <g transform="translate(${MAP_W - 130} ${MAP_H - 22})"><path class="m-scale" d="M0 -6V0H${km100}V-6"/><text class="m-cap" x="${km100 + 8}" y="4">100 км</text></g>
    ${pts}
  </svg></div>`;
}

function makeMap() {
  const M = LESSON.map;
  const g = base(M.points.length + M.questions.length);
  g.title = 'Карта Смуты';
  g.phase = 'label';
  g.named = new Set();
  g.chips = shuffle(M.points);
  g.sel = null; g.chip = null;
  g.qs = shuffle(M.questions); g.qi = 0;
  g.done = () => g.named.size + g.qi;
  g.hint = () => g.phase === 'label'
    ? 'Выбери название и нажми на точку, где этот город.'
    : 'Нажми на место, о котором говорится в вопросе.';
  g.body = () => {
    if (g.phase === 'label') {
      return mapSvg(g, (id) => g.named.has(id)) + `<div class="chips">${g.chips.map((p) =>
        `<button class="chip${g.named.has(p.id) ? ' done' : ''}${g.chip === p.id ? ' sel' : ''}" data-act="chip" data-id="${p.id}">${esc(p.name)}</button>`).join('')}</div>`;
    }
    const q = g.qs[g.qi];
    return (q ? `<div class="question"><span class="lbl">Где это было? ${g.qi + 1} из ${g.qs.length}</span>${esc(q.q)}</div>` : '')
      + mapSvg(g, () => true);
  };
  const name = (id) => M.points.find((p) => p.id === id).name;
  const tryLabel = () => {
    if (!g.chip || !g.sel) return draw();
    const chip = g.chip, pt = g.sel;
    g.chip = null; g.sel = null;
    if (chip === pt) {
      g.right++; g.named.add(pt); draw();
      if (g.named.size === M.points.length) {
        setTimeout(() => { if (game === g) { g.phase = 'where'; toast('Все города подписаны. Теперь вопросы'); draw(); } }, 700);
      }
    } else {
      g.miss('l:' + chip, `Где ${name(chip)}?`, 'Отметь на схеме ещё раз');
      flash(pt, 'bad');
    }
  };
  g.on = (act, id) => {
    if (g.phase === 'label') {
      if (g.named.has(id)) return;
      if (act === 'chip') g.chip = g.chip === id ? null : id;
      if (act === 'pt') g.sel = g.sel === id ? null : id;
      if (!g.chip && g.sel) { toast('Теперь выбери название'); }
      return tryLabel();
    }
    const q = g.qs[g.qi];
    if (!q || act !== 'pt') return;
    if (id === q.point) {
      g.right++; g.qi++; toast(name(id) + ' — верно'); flash(id, 'ok', 700); maybeFinish();
    } else {
      g.miss('q:' + q.point, q.q, name(q.point));
      flash(id, 'bad');
    }
  };
  g.review = () => [...g.missed.values()];
  return g;
}

/* ---------- Экраны ---------- */
function home() {
  const best = store.get('best') || {};
  $app.innerHTML = `
    <header class="lesson">
      <div class="eyebrow">${esc(LESSON.subject)} · ${esc(LESSON.grade)}</div>
      <h1>${esc(LESSON.title)}</h1>
      <div class="years">${esc(LESSON.years)}</div>
    </header>
    <section class="demo">
      <p>Это пример на одном параграфе. Потом здесь будет кнопка, которая соберёт такие же игры по фото страниц вашего учебника.</p>
      <button class="photo-btn" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        Сфотографировать параграф · скоро
      </button>
    </section>
    <div class="games">${GAMES.map((x) => `
      <button class="game-card" data-act="play" data-id="${x.id}">
        <span class="kind">${x.kind}</span>
        <span class="name">${x.name}</span>
        <span class="best" aria-label="Лучший результат: ${best[x.id] || 0} из 3">${stars(best[x.id] || 0)}</span>
        <span class="sub">${x.sub}</span>
      </button>`).join('')}
    </div>
    <p class="foot">Звёзды за лучший результат хранятся только на этом устройстве.</p>`;
}

function result() {
  const g = game, n = g.stars();
  const head = n === 3 ? 'Отлично, ты это знаешь!' : n === 2 ? 'Хорошо! Повтори ошибки и сыграй ещё раз' : 'Сыграй ещё раз — во второй раз будет легче';
  const first = g.total - g.missed.size;
  const stat = g.stat ? g.stat() : `С первого раза: ${first} из ${g.total} · ${g.wrong} ${plural(g.wrong, 'ошибка', 'ошибки', 'ошибок')}`;
  const items = g.review();
  $app.innerHTML = `
    <div class="result">
      <div class="stars">${stars(n)}</div>
      <h2>${head}</h2>
      <div class="stat">${stat}</div>
      ${items.length ? `<div class="review"><h3>${g.reviewTitle || 'Над чем поработать'}</h3>
        ${items.map((m) => `<div class="item">${esc(m.q)}<b>${esc(m.right)}</b></div>`).join('')}</div>` : ''}
      <div class="actions">
        <button class="btn main" data-act="play" data-id="${g.id}">Ещё раз</button>
        <button class="btn" data-act="home">Все игры</button>
      </div>
    </div>`;
}

function draw() {
  if (!game) return home();
  if (game.finished) return result();
  const pct = Math.round(game.done() / game.total * 100);
  $app.innerHTML = `
    <div class="top">
      <div class="top-row"><button class="back" data-act="home">← Все игры</button>
        <span class="count">${game.done()} из ${game.total}</span></div>
      <h2>${game.title}</h2>
      <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    </div>
    <p class="hint">${game.hint()}</p>
    ${game.body()}`;
}

function act(el) {
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'home') { game = null; draw(); window.scrollTo(0, 0); return; }
  if (a === 'play') {
    const def = GAMES.find((x) => x.id === id);
    game = def.make(); game.id = id; draw(); window.scrollTo(0, 0); return;
  }
  if (game && !game.finished) game.on(a, id);
}
$app.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (el) act(el); });
$app.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('g[data-act]');
  if (el) { e.preventDefault(); act(el); }
});

draw();
</script>
</body>
</html>
