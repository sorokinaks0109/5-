  const head = g.head ? g.head() : n === 3 ? 'Супер! Ты это знаешь' : n === 2 ? 'Хорошо! Повтори ошибки' : 'Ещё раз — и будет лучше';
  const stat = g.stat ? g.stat() : `С первого раза: ${g.total - g.missed.size} из ${g.total} · ${g.wrong} ${plural(g.wrong, 'ошибка', 'ошибки', 'ошибок')}`;
  const items = g.review ? g.review() : [...g.missed.values()];
  const list = gamesOf(L), idx = list.findIndex((x) => x.id === g.id), nx = S.task ? null : list[idx + 1];
  const verse = L.kind === 'poem';
  const tp = S.task ? todayPlan() : null, nextTask = tp && tp.tasks.find((x) => !doneTasks[x.id]);
  return `<div class="screen result">
    <div class="res-cat">${catImg(n === 3 ? 'trophy' : n === 2 ? 'happy' : 'oops', 'jump-in')}</div>
    <div class="big-stars">${[1, 2, 3].map((i) => star(i <= n)).join('')}</div>
    <h2>${head}</h2>
    <div class="pts">${g.score}<small>очков</small></div>
    <div class="stat">${stat}</div>
    ${items.length ? `<div class="review"><h3>${g.reviewTitle || (verse ? 'Трудные места' : 'Над чем поработать')}</h3>${items.map((m) =>
      `<div class="item${verse ? ' verse-item' : ''}">${esc(m.q).replace(/\n/g, '<br>')}${m.right ? `<b>${esc(m.right)}</b>` : ''}</div>`).join('')}</div>` : ''}
    <div class="actions">
      ${S.task ? (nextTask ? `<button class="b3 c-yellow btn" data-act="task" data-id="${nextTask.id}">Дальше: ${taskName(nextTask).name}</button>`
        : '<button class="b3 c-mint btn" data-act="home">На сегодня всё! На главную</button>') : ''}
      ${nx ? `<button class="b3 c-yellow btn" data-act="play" data-id="${nx.id}">Дальше: ${nx.name}</button>` : ''}
      <button class="b3 ${nx || S.task ? 'c-card' : 'c-yellow'} btn" data-act="play" data-id="${g.id}">Ещё раз</button>
      <button class="b3 c-card btn" data-act="${S.task ? 'plan' : 'lesson-back'}">${S.task ? 'Весь план' : verse ? 'К шагам' : 'Все игры'}</button>
    </div>
  </div>`;
}

function draw() {
  const v = { home: vHome, lesson: vLesson, pick: vPick, game: vGame, result: vResult, due: vDue, plan: vPlan, subject: vSubject, shoot: vShoot, loading: vLoading, photoerr: vPhotoErr }[S.screen];
  $app.innerHTML = v();
  $app.classList.toggle('enter', S.enter);
  S.enter = false;
}

/* ---------- Нажатия ---------- */
$app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'home': taskRange = null; return go('home', { lesson: null, game: null, task: null });
    case 'pet': { const c = el.querySelector('.cat'); c.classList.remove('jump'); void c.offsetWidth; c.classList.add('jump'); sfx('ok'); return; }
    case 'soon': toast('Скоро'); return;
    case 'photo': return pickPhotos();
    case 'cam': camIn.click(); return;
    case 'reshoot': return pickPhotos();
    case 'gallery': photoIn.click(); return;
    case 'shot-del': { const [x] = shots.splice(+id, 1); if (x) URL.revokeObjectURL(x.url); return draw(); }
    case 'send': return sendPhotos();
    case 'subject': return go('subject', { subjectKey: id });
    case 'sound': soundOn = !soundOn; store.set('sound', soundOn); if (soundOn) sfx('ok'); return draw();
    case 'lesson': {
      const L = lessonById(id);
      if (!L) return;
      if (L.kind === 'poem') usePoem(L);
      if (L.kind === 'poem' && !range) return go('pick', { lesson: L, pick: { a: null, b: null } });
      return go('lesson', { lesson: L });
    }
    case 'lesson-back':
      if (S.task) { taskRange = null; return go('plan', { game: null, task: null }); }
      return go('lesson', { game: null, lesson: S.lesson || POEM });
    case 'due': return go('due', { due: null });
    case 'due-pick': S.due = id; sfx('tap'); return draw();
    case 'due-done': makePlan(S.due); S.planFrom = 'lesson'; sfx('win'); toast('План готов!'); return go('plan', { lesson: POEM });
    case 'plan':
      if (S.screen === 'home' || S.screen === 'lesson') S.planFrom = S.screen;
      usePoem(planLesson());
      taskRange = null; return go('plan', { lesson: POEM, game: null, task: null });
    case 'plan-del':
      if (!S.confirmDel) { S.confirmDel = true; toast('Нажми ещё раз, чтобы удалить план'); setTimeout(() => { S.confirmDel = false; }, 2500); return; }
      S.confirmDel = false; plan = null; store.set('plan', null); return go('lesson', { lesson: POEM });
    case 'task': {
      usePoem(planLesson());
      const x = findTask(id); if (!x) return;
      taskRange = { a: x.a, b: x.b };
      const gm = POEM_GAMES.find((q) => q.id === x.game), g = gm.make(POEM); g.id = x.game; withIntro(g, x.game, POEM);
      return go('game', { lesson: POEM, game: g, task: x });
    }
    case 'pick': return go('pick', { pick: { a: range.a, b: range.b } });
    case 'line': {
      const p = S.pick, i = +id;
      if (p.a == null || p.b != null) { p.a = i; p.b = null; } else { p.b = i; }
      sfx('tap'); return draw();
    }
    case 'all': S.pick = { a: 0, b: LINES.length - 1 }; sfx('tap'); return draw();
    case 'pick-done': {
      const p = S.pick, b = p.b == null ? p.a : p.b;
      range = { a: Math.min(p.a, b), b: Math.max(p.a, b) }; store.set(rangeStoreKey(POEM), range);
      return go('lesson');
    }
    case 'play': {
      if (!S.task) taskRange = null;
      const x = gamesOf(S.lesson).find((q) => q.id === id);
      const g = x.make(S.lesson); g.id = id; withIntro(g, id, S.lesson);
      return go('game', { game: g });
    }
    case 'how': if (S.game && S.game.introList) { S.game.intro = 0; window.scrollTo(0, 0); draw(); } return;
    case 'exnext': S.game.intro++; return draw();
    case 'exback': S.game.intro = Math.max(0, S.game.intro - 1); return draw();
    case 'exdone': { const seen = store.get('seen') || {}; seen[S.game.introKey] = 1; store.set('seen', seen); S.game.intro = -1; window.scrollTo(0, 0); return draw(); }
    default: if (S.game && S.screen === 'game' && !S.game.finished) S.game.on(a, id);
  }
});
$app.addEventListener('change', (e) => {
  if (e.target.id === 'due-date' && e.target.value) { S.due = e.target.value; draw(); }
});
document.addEventListener('keydown', (e) => {
  if (S.screen === 'game' && S.game && S.game.math && !S.game.finished && !(S.game.intro >= 0) && (/^[0-9.,]$/.test(e.key) || e.key === 'Backspace' || e.key === 'Enter')) { e.preventDefault(); S.game.key(e.key); }
});
$app.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('g[data-act]');
  if (el) { e.preventDefault(); el.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});

/* ---------- Фото страницы → урок ---------- */
const photoIn = document.getElementById('photo-in');
function clientId() {
  let id = store.get('client');
  if (!id) {
    const a = new Uint8Array(12); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => { a[i] = Math.random() * 256; });
    id = 'c' + [...a].map((x) => x.toString(16).padStart(2, '0')).join('');
    store.set('client', id);
  }
  return id;
}
const camIn = document.getElementById('cam-in');
// Снятые страницы до отправки: файл и уменьшенная копия для миниатюры.
let shots = [];
function pickPhotos() {
  if (!API_URL) return toast('Скоро: подключаем распознавание фото');
  shots.forEach((x) => URL.revokeObjectURL(x.url)); shots = [];
  go('shoot');
}
function addShots(files) {
  const room = 4 - shots.length;
  [...files].slice(0, room).forEach((f) => shots.push({ file: f, url: URL.createObjectURL(f) }));
  if (files.length > room) toast('Не больше 4 страниц за раз');
  sfx('tap'); draw();
}
function vShoot() {
  const n = shots.length;
  return `<div class="screen">
    <div class="bar-top"><button class="round" data-act="home" aria-label="Назад">${icon('back')}</button>
      <div class="grow"><div style="font:900 20px var(--f-display)">Что задали?</div><div class="crumb">Сними 1–4 страницы: параграф или стих целиком</div></div></div>
    ${n ? `<div class="shots">${shots.map((x, k) => `<div class="shot"><img src="${x.url}" alt="Страница ${k + 1}"><span class="no">${k + 1}</span>
      <button class="del" data-act="shot-del" data-id="${k}" aria-label="Убрать страницу ${k + 1}">×</button></div>`).join('')}</div>`
      : `<div class="shelf-empty"><img src="${CAT('camera')}" alt=""><span>Сними страницу ровно, при хорошем свете, чтобы был виден весь текст</span></div>`}
    ${n < 4 ? `<div class="row2">
      <button class="b3 c-orange btn" data-act="cam">${icon('camera')} ${n ? 'Ещё страница' : 'Камера'}</button>
      <button class="b3 c-card btn" data-act="gallery">Из галереи</button></div>` : ''}
    <button class="b3 c-yellow btn" data-act="send" ${n ? '' : 'disabled'}>Готово, разобрать${n ? ` (${n} ${plural(n, 'страница', 'страницы', 'страниц')})` : ''}</button>
  </div>`;
}
// Сжимаем фото до 1600 точек по длинной стороне: текст читается, а запрос лёгкий.
function toJpeg(file, max = 1600) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Не получилось открыть фото. Попробуй сфотографировать ещё раз')); };
    img.src = url;
  });
}
async function sendPhotos() {
  const list = shots.map((x) => x.file);
  if (!list.length) return;
  let tick;
  try {
    go('loading', { loadPct: 8, loadNote: '' });
    const setPct = (v) => { S.loadPct = v; const bar = document.querySelector('#app .prog i'); if (bar && S.screen === 'loading') bar.style.width = v + '%'; };
    const images = [];
    for (const f of list) images.push(await toJpeg(f));
    setPct(20);
    tick = setInterval(() => setPct(Math.min(92, (S.loadPct || 20) + 3)), 1200);
    const ctrl = new AbortController(), stop = setTimeout(() => ctrl.abort(), 90000);
    let res, data;
    try {
      res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ images, clientId: clientId() }), signal: ctrl.signal });
      data = await res.json().catch(() => ({}));
    } catch (e) {
      throw new Error(e.name === 'AbortError' ? 'Страница читалась слишком долго. Попробуй ещё раз' : 'Нет связи с сервером. Проверь интернет и попробуй ещё раз');
    } finally { clearTimeout(stop); }
    if (!res.ok || !data.lesson) throw new Error(data.error || 'Сервер не смог прочитать страницу');
    const L = lessonFromServer(data.lesson);
    shots.forEach((x) => URL.revokeObjectURL(x.url)); shots = [];
    myLessons.push(L); store.set('lessons', myLessons);
    clearInterval(tick);
    sfx('win');
    toast(data.cached ? 'Эту страницу уже разбирали — урок готов!' : `Готово!${typeof data.left === 'number' ? ' Новых фото на сегодня: ' + data.left : ''}`);
    if (L.kind === 'poem') { usePoem(L); return go('pick', { lesson: L, pick: { a: null, b: null } }); }
    return go('lesson', { lesson: L });
  } catch (e) {
    clearInterval(tick);
    go('photoerr', { photoErr: e.message });
  }
}
photoIn.addEventListener('change', () => { addShots(photoIn.files); photoIn.value = ''; });
camIn.addEventListener('change', () => { addShots(camIn.files); camIn.value = ''; });

// Заставка: кот машет лапой и покачивается, потом исчезает сам или по нажатию.
(function splash() {
  const el = document.getElementById('splash');
  const hide = () => { el.classList.add('out'); setTimeout(() => el.remove(), 450); };
  el.addEventListener('click', hide);
  setTimeout(hide, 2300);
})();

usePoem(PERCHATKA);
draw();
</script>
