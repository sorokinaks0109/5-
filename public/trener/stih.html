<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Учим «Перчатку»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Ruslan+Display&display=swap">
<style>
/* Макет: одна колонка как в телефоне. Стихи набраны книжным шрифтом, всё остальное — тем же, что в играх по истории. */
:root {
  --bg: #f2f4f9;
  --surface: #ffffff;
  --ink: #18203a;
  --muted: #5a6482;
  --line: #dce1ee;
  --accent: #2b4fd8;
  --accent-soft: #e3e8fc;
  --on-accent: #ffffff;
  --gold: #d4930c;
  --ok: #1d8752;
  --ok-soft: #dcf2e5;
  --bad: #cc3a2e;
  --bad-soft: #fbe2df;
  --font-display: "Ruslan Display", "Golos Text", Georgia, serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-verse: "Lora", Georgia, "Times New Roman", serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131d; --surface: #182031; --ink: #e8ecf6; --muted: #9aa4c0; --line: #2a3450;
    --accent: #8098ff; --accent-soft: #232f58; --on-accent: #0c1330; --gold: #f0b73a;
    --ok: #4cc488; --ok-soft: #173a29; --bad: #ff7d6e; --bad-soft: #43221f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131d; --surface: #182031; --ink: #e8ecf6; --muted: #9aa4c0; --line: #2a3450;
  --accent: #8098ff; --accent-soft: #232f58; --on-accent: #0c1330; --gold: #f0b73a;
  --ok: #4cc488; --ok-soft: #173a29; --bad: #ff7d6e; --bad-soft: #43221f; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font-body); -webkit-tap-highlight-color: transparent; }
#app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.lesson { display: grid; gap: 6px; padding-block: 8px 18px; }
.lesson h1 { font: 400 42px/1.1 var(--font-display); }
.lesson .by { font-size: 16px; color: var(--muted); }
.lesson .by b { color: var(--ink); font-weight: 600; }
.section-h { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; }
.note { font-size: 14px; color: var(--muted); margin: 0 0 12px; }

/* Выбор частей */
.parts { display: grid; gap: 8px; }
.part {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
  width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--surface);
}
.part .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; }
.part.on { border-color: var(--accent); background: var(--accent-soft); }
.part.on .box { background: var(--accent); border-color: var(--accent); }
.part.on .box::after { content: ""; width: 10px; height: 6px; border: solid var(--on-accent); border-width: 0 0 2.5px 2.5px; transform: translateY(-1px) rotate(-45deg); }
.part .first { font: italic 400 16px/1.35 var(--font-verse); min-width: 0; }
.part .n { font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.part .learned { color: var(--ok); }
.sel-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.link { border: 0; background: none; padding: 4px 0; color: var(--accent); font-weight: 600; font-size: 14px; }

/* Режимы */
.modes { display: grid; gap: 10px; }
.mode {
  display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 4px 12px;
  width: 100%; text-align: left; padding: 14px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line);
}
.mode:hover { border-color: var(--accent); }
.mode:disabled { opacity: .5; cursor: not-allowed; }
.mode .step { grid-row: 1 / 3; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 18px; }
.mode .name { font-size: 18px; font-weight: 700; }
.mode .sub { grid-column: 2; color: var(--muted); font-size: 14px; }
.mode .best { grid-column: 3; grid-row: 1 / 3; display: flex; gap: 2px; }
.star { width: 16px; height: 16px; }
.star path { fill: var(--line); }
.star.on path { fill: var(--gold); }

/* Шапка режима */
.top { display: grid; gap: 10px; margin-bottom: 14px; }
.top-row { display: flex; align-items: center; gap: 10px; }
.back { border: 0; background: none; padding: 6px 0; color: var(--accent); font-weight: 600; }
.top-row .count { margin-left: auto; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.top h2 { font-size: 24px; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.hint { color: var(--muted); font-size: 15px; margin: 0 0 14px; }

/* Стих */
.verse { padding: 18px 18px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); font: 400 19px/1.6 var(--font-verse); }
.verse .ln { display: block; }
.verse .gap { display: block; height: .7em; }
.w-hid {
  border: 0; padding: 0 1px; background: none; font: inherit; color: var(--accent);
  border-bottom: 2px solid var(--accent); border-radius: 0; letter-spacing: .02em;
}
.w-hid.peek { color: var(--ink); background: var(--accent-soft); }
.w-mute { color: var(--line); }
.level { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
.level .dots { display: flex; gap: 6px; flex: 1; }
.level .dots i { flex: 1; height: 6px; border-radius: 6px; background: var(--line); }
.level .dots i.on { background: var(--accent); }
.level .lv { font-size: 14px; color: var(--muted); white-space: nowrap; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { padding: 13px 20px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.main { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.good { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--ink); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.row .btn { flex: 1 1 140px; }

/* Собери строку */
.built { min-height: 96px; padding: 16px 18px; border-radius: var(--radius); background: var(--surface); border: 1.5px dashed var(--line); font: 400 19px/1.6 var(--font-verse); margin-bottom: 14px; }
.built .ctx { color: var(--muted); }
.built .cur { color: var(--ink); }
.built .cursor { display: inline-block; width: 2px; height: 1.1em; background: var(--accent); vertical-align: -0.15em; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font: 500 18px var(--font-verse); }
.chip.used { display: none; }
.chip.bad { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* Варианты */
.prompt { padding: 16px 18px; border-radius: var(--radius); background: var(--accent); color: var(--on-accent); margin-bottom: 14px; }
.prompt .lbl { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
.prompt .v { font: 400 19px/1.55 var(--font-verse); margin-top: 6px; }
.prompt .v .faint { opacity: .65; }
.prompt .blank { display: inline-block; min-width: 4em; border-bottom: 2px solid currentColor; }
.opts { display: grid; gap: 8px; }
.opt { width: 100%; text-align: left; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font: 400 18px/1.4 var(--font-verse); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s; }

/* Наизусть */
.recite .ln { display: block; }
.recite .ln.hidden { color: transparent; background: var(--line); border-radius: 6px; margin: 6px 0; height: 1.1em; }
.recite .ln.ok::after { content: " ✓"; color: var(--ok); font-family: var(--font-body); font-size: 15px; }
.recite .ln.miss { color: var(--bad); }

/* Итог */
.result { display: grid; gap: 16px; justify-items: center; text-align: center; padding-top: 24px; }
.result .stars { display: flex; gap: 6px; }
.result .star { width: 54px; height: 54px; }
.result .star.on { animation: pop .45s ease backwards; }
.result .star.on:nth-child(2) { animation-delay: .15s; }
.result .star.on:nth-child(3) { animation-delay: .3s; }
@keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.2); } }
.result h2 { font-size: 26px; }
.result .stat { color: var(--muted); font-variant-numeric: tabular-nums; }
.review { width: 100%; text-align: left; display: grid; gap: 8px; }
.review h3 { margin-top: 8px; font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.review .item { padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font: 400 17px/1.45 var(--font-verse); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%; }
.foot { margin-top: 24px; color: var(--muted); font-size: 13px; }

#toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
  max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 12px; background: var(--ink); color: var(--bg);
  font-weight: 600; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 10;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/*
  Текст стихотворения. Сейчас записан вручную; потом его будет присылать распознавание фото страницы.
  Пустая строка — граница строфы.
*/
const POEM = {
  author: 'Фридрих Шиллер',
  title: 'Перчатка',
  translator: 'перевод В. А. Жуковского',
  text: `Перед своим зверинцем,
С баронами, с наследным принцем,
Король Франциск сидел;
С высокого балкона он глядел
На поприще, сраженья ожидая;
За королем, обворожая
Цветущей прелестию взгляд,
Придворных дам являлся пышный ряд.

Король дал знак рукою —
Со стуком растворилась дверь,
И грозный зверь
С огромной головою,
Косматый лев
Выходит;
Кругом глаза угрюмо водит;
И вот, все оглядев,
Наморщил лоб с осанкой горделивой,
Пошевелил густою гривой,
И потянулся, и зевнул,
И лег. Король опять рукой махнул —
Затвор железной двери грянул,
И смелый тигр из-за решетки прянул;
Но видит льва, робеет и ревет,
Себя хвостом по ребрам бьет,
И крадется, косяся взглядом,
И лижет морду языком,
И, обошедши льва кругом,
Рычит и с ним ложится рядом.
И в третий раз король махнул рукой —
Два барса дружною четой
В один прыжок над тигром очутились;
Но он удар им тяжкой лапой дал,
А лев с рыканьем встал…
Они смирились,
Оскалив зубы, отошли,
И зарычали, и легли.

И гости ждут, чтоб битва началася.
Вдруг женская с балкона сорвалася
Перчатка… все глядят за ней…
Она упала меж зверей.
Тогда на рыцаря Делоржа с лицемерной
И колкою улыбкою глядит
Его красавица и говорит:
«Когда меня, мой рыцарь верный,
Ты любишь так, как говоришь,
Ты мне перчатку возвратишь».

Делорж, не отвечав ни слова,
К зверям идет,
Перчатку смело он берет
И возвращается к собранью снова.
У рыцарей и дам при дерзости такой
От страха сердце помутилось;
А витязь молодой,
Как будто ничего с ним не случилось,
Спокойно всходит на балкон;
Рукоплесканьем встречен он;
Его приветствуют красавицыны взгляды…
Но, холодно приняв привет ее очей,
В лицо перчатку ей
Он бросил и сказал: «Не требую награды».`,
};

/* ---------- Разбор текста ---------- */
// Строки с номером строфы; части — по 4 строки внутри строфы (короткий хвост приклеивается к предыдущей части).
const LINES = [];
POEM.text.split(/\n\s*\n/).forEach((st, si) => st.split('\n').forEach((t) => LINES.push({ t: t.trim(), st: si })));
LINES.forEach((l, i) => { l.i = i; });
const PARTS = [];
{
  const byStanza = {};
  LINES.forEach((l) => (byStanza[l.st] = byStanza[l.st] || []).push(l.i));
  Object.values(byStanza).forEach((ids) => {
    const groups = [];
    for (let k = 0; k < ids.length; k += 4) groups.push(ids.slice(k, k + 4));
    if (groups.length > 1 && groups[groups.length - 1].length < 3) groups[groups.length - 2].push(...groups.pop());
    groups.forEach((g) => PARTS.push(g));
  });
}
const WORD = /[А-Яа-яЁёA-Za-z]+(?:-[А-Яа-яЁё]+)*/g;
// Строка → куски: слова и всё остальное (пробелы, знаки).
function tokens(line) {
  const out = []; let last = 0;
  line.replace(WORD, (w, pos) => {
    if (pos > last) out.push({ s: line.slice(last, pos) });
    out.push({ s: w, w: true }); last = pos + w.length; return w;
  });
  if (last < line.length) out.push({ s: line.slice(last) });
  return out;
}
const wordsOf = (line) => line.match(WORD) || [];
const norm = (w) => w.toLowerCase().replace(/ё/g, 'е');

/* ---------- Мелочи ---------- */
const $app = document.getElementById('app');
const $toast = document.getElementById('toast');
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('stih:' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('stih:' + k, JSON.stringify(v)); } catch (e) { /* без памяти тоже работает */ } },
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let toastTimer;
function toast(msg) { $toast.textContent = msg; $toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $toast.classList.remove('show'), 1800); }
const STAR = '<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/>';
const stars = (n) => [1, 2, 3].map((i) => `<svg class="star${i <= n ? ' on' : ''}" viewBox="0 0 24 24" aria-hidden="true">${STAR}</svg>`).join('');
const plural = (n, one, few, many) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; };

/* ---------- Состояние ---------- */
let selected = new Set(store.get('parts') || [0]);
let learned = new Set(store.get('learned') || []);
let game = null;
const selLines = () => [...selected].sort((a, b) => a - b).flatMap((p) => PARTS[p]).map((i) => LINES[i]);
const selKey = () => [...selected].sort((a, b) => a - b).join(',');

// Строки выбранного отрывка с пустой строкой между строфами и между несмежными частями.
function verseHtml(lines, renderLine) {
  let html = '', prev = null;
  lines.forEach((l) => {
    if (prev && (l.st !== prev.st || l.i !== prev.i + 1)) html += '<span class="gap"></span>';
    html += `<span class="ln">${renderLine(l)}</span>`; prev = l;
  });
  return html;
}

/* ---------- Режимы ---------- */
const MODES = [
  { id: 'fade', name: 'Исчезающий текст', sub: 'Читай вслух, слова пропадают по одному шагу', make: makeFade },
  { id: 'build', name: 'Собери строку', sub: 'Слова рассыпались — сложи их по порядку', make: makeBuild },
  { id: 'next', name: 'Что дальше?', sub: 'Выбери строку, которая идёт следующей', make: makeNext },
  { id: 'gap', name: 'Пропущенное слово', sub: 'Вставь слово, которое выпало из строки', make: makeGap },
  { id: 'recite', name: 'Расскажи наизусть', sub: 'Рассказываешь сам, строки открываются для проверки', make: makeRecite },
];

function base(total) {
  return {
    total, right: 0, wrong: 0, missed: new Map(), finished: false, flash: null,
    miss(key, text) { this.wrong++; if (!this.missed.has(key)) this.missed.set(key, text); },
    stars() { const f = (this.total - this.missed.size) / this.total; return f >= 0.9 ? 3 : f >= 0.6 ? 2 : 1; },
  };
}
function finish() {
  const g = game;
  setTimeout(() => {
    if (game !== g) return;
    g.finished = true;
    const best = store.get('best') || {}; const k = g.id + ':' + selKey();
    best[k] = Math.max(best[k] || 0, g.stars()); store.set('best', best);
    if (g.id === 'recite' && g.stars() === 3) { selected.forEach((p) => learned.add(p)); store.set('learned', [...learned]); }
    draw();
  }, 600);
}
function flash(id, ms = 500) {
  const g = game; g.flash = id; draw();
  setTimeout(() => { if (game === g && g.flash === id) { g.flash = null; draw(); } }, ms);
}

/* 1. Исчезающий текст: 0 — весь текст, 1–3 — прячем четверть, половину, три четверти слов,
      4 — только первые буквы, 5 — только первое слово строки. */
function makeFade() {
  const g = base(1);
  g.title = 'Исчезающий текст';
  g.lines = selLines();
  g.level = 0; g.peek = new Set();
  // У каждого слова свой «порядок исчезновения», чтобы на каждом шаге пряталось больше, а не другое.
  g.rank = {};
  g.lines.forEach((l) => { let k = 0; tokens(l.t).forEach((t) => { if (t.w) g.rank[l.i + ':' + k++] = Math.random(); }); });
  g.peeks = 0;
  g.done = () => g.level; g.total = 5;
  g.hint = () => [
    'Прочитай отрывок вслух два раза. Потом нажми «Прятать слова».',
    'Читай вслух, пропущенные слова говори по памяти. Забыл — нажми на пропуск.',
    'Теперь спрятана половина. Читай вслух.',
    'Спрятаны почти все слова. Получится!',
    'Остались только первые буквы. Читай вслух целиком.',
    'Только первое слово каждой строки. Если рассказал без подсказок — переходи к «Расскажи наизусть».',
  ][g.level];
  const hide = (key, w, first) => {
    if (g.level === 0) return false;
    if (g.level === 5) return !first;
    if (g.level === 4) return true;
    return g.rank[key] < g.level * 0.25;
  };
  g.body = () => {
    const html = verseHtml(g.lines, (l) => {
      let k = 0;
      return tokens(l.t).map((t) => {
        if (!t.w) return esc(t.s);
        const key = l.i + ':' + k, first = k === 0; k++;
        if (!hide(key, t.s, first) || g.peek.has(key)) {
          return g.peek.has(key) ? `<button class="w-hid peek" data-act="peek" data-id="${key}">${esc(t.s)}</button>` : esc(t.s);
        }
        const shown = g.level === 5 ? '' : t.s[0];
        const blank = ' '.repeat(0) + '_'.repeat(Math.max(2, Math.round((t.s.length - shown.length) * 0.8)));
        return `<button class="w-hid" data-act="peek" data-id="${key}" aria-label="Подсказка">${esc(shown)}<span class="w-mute">${blank}</span></button>`;
      }).join('');
    });
    return `<div class="verse">${html}</div>
      <div class="level"><div class="dots">${[1, 2, 3, 4, 5].map((n) => `<i class="${n <= g.level ? 'on' : ''}"></i>`).join('')}</div>
        <span class="lv">Шаг ${g.level} из 5</span></div>
      <div class="row">
        <button class="btn" data-act="less" ${g.level === 0 ? 'disabled' : ''}>Показать больше</button>
        ${g.level < 5 ? `<button class="btn main" data-act="more">Прятать слова</button>` : `<button class="btn main" data-act="done">Готово</button>`}
      </div>`;
  };
  g.on = (act, id) => {
    if (act === 'peek') { if (g.peek.has(id)) g.peek.delete(id); else { g.peek.add(id); g.peeks++; } return draw(); }
    if (act === 'more') { g.level++; g.peek.clear(); return draw(); }
    if (act === 'less') { g.level--; g.peek.clear(); return draw(); }
    if (act === 'done') { g.finished = true; draw(); }
  };
  g.stars = () => (g.peeks <= 2 ? 3 : g.peeks <= 6 ? 2 : 1);
  g.result = () => ({
    head: 'Все шаги пройдены',
    stat: g.peeks ? `Подсмотрел ${g.peeks} ${plural(g.peeks, 'раз', 'раза', 'раз')}` : 'Ни разу не подсмотрел',
  });
  return g;
}

/* 2. Собери строку. Очень короткие строки («Выходит;») склеиваем со следующей. */
function makeBuild() {
  const lines = selLines();
  const units = [];
  let cur = [];
  lines.forEach((l, k) => {
    cur.push(l);
    const n = cur.reduce((s, x) => s + wordsOf(x.t).length, 0);
    const nextSame = lines[k + 1] && lines[k + 1].i === l.i + 1 && lines[k + 1].st === l.st;
    if (n >= 4 || !nextSame) { units.push(cur); cur = []; }
  });
  if (cur.length) units.push(cur);
  const g = base(units.length);
  g.title = 'Собери строку';
  g.units = units; g.u = 0;
  const setup = () => {
    const words = g.units[g.u].flatMap((l) => tokens(l.t).filter((t) => t.w).map((t) => t.s));
    g.words = words; g.pos = 0;
    g.chips = shuffle(words.map((w, k) => ({ w, k })));
    g.used = new Set();
  };
  setup();
  g.done = () => g.u;
  g.hint = () => 'Нажимай на слова по порядку. Знаки препинания встанут сами.';
  g.body = () => {
    const unit = g.units[g.u];
    const prev = g.u > 0 ? g.units[g.u - 1].map((l) => l.t) : [];
    // Собранная часть: показываем строки с уже поставленными словами и знаками.
    let left = g.pos;
    const built = unit.map((l) => {
      let s = '';
      for (const t of tokens(l.t)) {
        if (t.w) { if (left <= 0) break; left--; s += esc(t.s); } else if (left > 0 || s) s += esc(t.s);
      }
      return s;
    });
    let at = 0;
    built.forEach((s, k) => { if (s) at = k; });
    const html = prev.map((t) => `<span class="ln ctx">${esc(t)}</span>`).join('')
      + built.map((s, k) => `<span class="ln cur">${s}${k === at ? '<span class="cursor"></span>' : ''}</span>`).join('');
    return `<div class="built">${html}</div>
      <div class="chips">${g.chips.map((c, j) => `<button class="chip${g.used.has(j) ? ' used' : ''}${g.flash === 'c' + j ? ' bad' : ''}" data-act="chip" data-id="${j}">${esc(c.w)}</button>`).join('')}</div>`;
  };
  g.on = (act, id) => {
    const j = +id, c = g.chips[j];
    if (g.used.has(j)) return;
    if (norm(c.w) === norm(g.words[g.pos])) {
      g.used.add(j); g.pos++;
      if (g.pos === g.words.length) {
        g.right++; draw();
        if (g.u < g.units.length - 1) { setTimeout(() => { if (game === g) { g.u++; setup(); draw(); } }, 650); }
        else { g.u++; finish(); }
        return;
      }
      draw();
    } else {
      g.miss('u' + g.u, g.units[g.u].map((l) => l.t).join('\n'));
      flash('c' + j);
    }
  };
  return g;
}

/* 3. Что дальше? Показываем строку, выбираем следующую из трёх. */
function makeNext() {
  const lines = selLines();
  const tasks = [];
  lines.forEach((l, k) => { if (k < lines.length - 1) tasks.push({ prev: l, next: lines[k + 1] }); });
  const g = base(tasks.length);
  g.title = 'Что дальше?';
  g.tasks = tasks; g.t = 0;
  const setup = () => {
    const { next } = g.tasks[g.t];
    // Обманки — другие строки стихотворения, лучше всего соседние по тексту.
    const pool = shuffle(LINES.filter((l) => l.i !== next.i && l.i !== g.tasks[g.t].prev.i && wordsOf(l.t).length > 1));
    const near = pool.sort((a, b) => Math.abs(a.i - next.i) - Math.abs(b.i - next.i)).slice(0, 6);
    g.opts = shuffle([next, ...shuffle(near).slice(0, 2)]);
    g.okShown = false;
  };
  setup();
  g.done = () => g.t;
  g.hint = () => 'Какая строка идёт дальше?';
  g.body = () => {
    const { prev, next } = g.tasks[g.t];
    const before = LINES[prev.i - 1] && selLines().some((l) => l.i === prev.i - 1) ? LINES[prev.i - 1].t : '';
    return `<div class="prompt"><div class="lbl">${g.t + 1} из ${g.tasks.length}</div>
        <div class="v">${before ? `<span class="faint">${esc(before)}</span><br>` : ''}${esc(prev.t)}<br>…</div></div>
      <div class="opts">${g.opts.map((o) => {
        const cls = g.okShown && o.i === next.i ? ' ok' : g.flash === 'o' + o.i ? ' bad' : '';
        return `<button class="opt${cls}" data-act="opt" data-id="${o.i}">${esc(o.t)}</button>`;
      }).join('')}</div>`;
  };
  g.on = (act, id) => {
    if (g.okShown) return;
    const { prev, next } = g.tasks[g.t];
    if (+id === next.i) {
      g.right++; g.okShown = true; draw();
      setTimeout(() => {
        if (game !== g) return;
        g.t++;
        if (g.t < g.tasks.length) { setup(); draw(); } else finish();
      }, 600);
    } else {
      g.miss('n' + next.i, prev.t + '\n' + next.t);
      flash('o' + id);
    }
  };
  return g;
}

/* 4. Пропущенное слово: в каждой строке прячем самое длинное слово. */
function makeGap() {
  const lines = selLines().filter((l) => wordsOf(l.t).some((w) => w.length >= 4));
  const allWords = [...new Set(LINES.flatMap((l) => wordsOf(l.t)).filter((w) => w.length >= 4))];
  const g = base(lines.length);
  g.title = 'Пропущенное слово';
  g.items = shuffle(lines).map((l) => {
    const ws = wordsOf(l.t);
    const target = ws.reduce((a, b) => (b.length > a.length ? b : a));
    const others = shuffle(allWords.filter((w) => norm(w) !== norm(target) && Math.abs(w.length - target.length) <= 3)).slice(0, 3);
    return { l, target, opts: shuffle([target, ...others]) };
  });
  g.k = 0; g.okShown = false;
  g.done = () => g.k;
  g.hint = () => 'Какое слово пропало?';
  g.body = () => {
    const it = g.items[g.k];
    let replaced = false;
    const line = tokens(it.l.t).map((t) => {
      if (t.w && !replaced && t.s === it.target) { replaced = true; return g.okShown ? `<b>${esc(t.s)}</b>` : '<span class="blank">&nbsp;</span>'; }
      return esc(t.s);
    }).join('');
    const prev = LINES[it.l.i - 1] && LINES[it.l.i - 1].st === it.l.st ? LINES[it.l.i - 1].t : '';
    return `<div class="prompt"><div class="lbl">${g.k + 1} из ${g.items.length}</div>
        <div class="v">${prev ? `<span class="faint">${esc(prev)}</span><br>` : ''}${line}</div></div>
      <div class="opts">${it.opts.map((w, j) => {
        const cls = g.okShown && w === it.target ? ' ok' : g.flash === 'w' + j ? ' bad' : '';
        return `<button class="opt${cls}" data-act="opt" data-id="${j}">${esc(w.toLowerCase())}</button>`;
      }).join('')}</div>`;
  };
  g.on = (act, id) => {
    if (g.okShown) return;
    const it = g.items[g.k];
    if (it.opts[+id] === it.target) {
      g.right++; g.okShown = true; draw();
      setTimeout(() => {
        if (game !== g) return;
        g.okShown = false; g.k++;
        if (g.k < g.items.length) draw(); else finish();
      }, 700);
    } else {
      g.miss('g' + it.l.i, it.l.t);
      flash('w' + id);
    }
  };
  return g;
}

/* 5. Расскажи наизусть: ребёнок говорит строку вслух, открывает и честно отмечает. */
function makeRecite() {
  const lines = selLines();
  const g = base(lines.length);
  g.title = 'Расскажи наизусть';
  g.lines = lines; g.k = 0; g.state = {}; g.open = false;
  g.done = () => g.k;
  g.hint = () => g.open
    ? 'Ты сказал так же? Отметь честно.'
    : 'Расскажи следующую строку вслух, потом открой и проверь себя. Можно, чтобы проверял взрослый.';
  g.body = () => {
    const html = verseHtml(g.lines, (l) => {
      const k = g.lines.indexOf(l), st = g.state[l.i];
      if (k < g.k) return `<span class="${st === 'miss' ? 'ln miss' : 'ln ok'}" style="display:inline">${esc(l.t)}</span>`;
      if (k === g.k && g.open) return esc(l.t);
      return `<span class="ln hidden" aria-label="Скрытая строка">${esc(l.t)}</span>`;
    });
    return `<div class="verse recite">${html}</div><div style="height:14px"></div>
      <div class="row">${g.open
        ? `<button class="btn bad" data-act="miss">Ошибся</button><button class="btn good" data-act="ok">Сказал верно</button>`
        : `<button class="btn main" data-act="open">Открыть строку</button>`}</div>`;
  };
  g.on = (act) => {
    if (act === 'open') { g.open = true; return draw(); }
    const l = g.lines[g.k];
    if (act === 'ok') { g.right++; g.state[l.i] = 'ok'; }
    if (act === 'miss') { g.miss('r' + l.i, l.t); g.state[l.i] = 'miss'; }
    g.k++; g.open = false; draw();
    if (g.k >= g.lines.length) finish();
  };
  g.result = () => {
    const n = g.stars();
    return {
      head: n === 3 ? 'Ты выучил этот отрывок!' : n === 2 ? 'Почти! Повтори строки с ошибками' : 'Пройди ещё раз «Исчезающий текст»',
      stat: `Без ошибок: ${g.total - g.missed.size} ${plural(g.total - g.missed.size, 'строка', 'строки', 'строк')} из ${g.total}`,
    };
  };
  return g;
}

/* ---------- Экраны ---------- */
function home() {
  const best = store.get('best') || {};
  const nLines = selLines().length;
  $app.innerHTML = `
    <header class="lesson">
      <div class="eyebrow">Литература · наизусть</div>
      <h1>${esc(POEM.title)}</h1>
      <div class="by"><b>${esc(POEM.author)}</b>, ${esc(POEM.translator)}</div>
    </header>

    <div class="section-h">Что учим</div>
    <p class="note">Отметьте части, которые задали. Учить лучше по одной части, потом соединять.</p>
    <div class="parts">${PARTS.map((ids, p) => `
      <button class="part${selected.has(p) ? ' on' : ''}" data-act="part" data-id="${p}" aria-pressed="${selected.has(p)}">
        <span class="box"></span>
        <span class="first">${esc(LINES[ids[0]].t)}</span>
        <span class="n${learned.has(p) ? ' learned' : ''}">${learned.has(p) ? 'выучено' : 'строки ' + (ids[0] + 1) + '–' + (ids[ids.length - 1] + 1)}</span>
      </button>`).join('')}
    </div>
    <div class="sel-tools">
      <button class="link" data-act="all">Выбрать всё</button>
      <button class="link" data-act="clear">Снять выбор</button>
    </div>

    <div class="section-h">Как учить${nLines ? ` · ${nLines} ${plural(nLines, 'строка', 'строки', 'строк')}` : ''}</div>
    <div class="modes">${MODES.map((m, k) => {
      const b = best[m.id + ':' + selKey()] || 0;
      return `<button class="mode" data-act="play" data-id="${m.id}" ${nLines ? '' : 'disabled'}>
        <span class="step">${k + 1}</span><span class="name">${m.name}</span>
        <span class="best" aria-label="Лучший результат: ${b} из 3">${stars(b)}</span>
        <span class="sub">${m.sub}</span></button>`;
    }).join('')}</div>
    <p class="foot">Сверьте текст с учебником: в разных изданиях бывают отличия в знаках препинания. Выбор частей и звёзды хранятся только на этом устройстве.</p>`;
}

function result() {
  const g = game, n = g.stars();
  const r = g.result ? g.result() : {
    head: n === 3 ? 'Отлично!' : n === 2 ? 'Хорошо! Повтори трудные места' : 'Сыграй ещё раз — будет легче',
    stat: `С первого раза: ${g.total - g.missed.size} из ${g.total} · ${g.wrong} ${plural(g.wrong, 'ошибка', 'ошибки', 'ошибок')}`,
  };
  const items = [...g.missed.values()];
  const idx = MODES.findIndex((m) => m.id === g.id), nextMode = MODES[idx + 1];
  $app.innerHTML = `<div class="result">
      <div class="stars">${stars(n)}</div>
      <h2>${r.head}</h2>
      <div class="stat">${r.stat}</div>
      ${items.length ? `<div class="review"><h3>Трудные места</h3>${items.map((t) => `<div class="item">${esc(t).replace(/\n/g, '<br>')}</div>`).join('')}</div>` : ''}
      <div class="actions">
        ${nextMode ? `<button class="btn main" data-act="play" data-id="${nextMode.id}">Дальше: ${nextMode.name}</button>` : ''}
        <button class="btn${nextMode ? '' : ' main'}" data-act="play" data-id="${g.id}">Ещё раз</button>
        <button class="btn" data-act="home">К отрывку</button>
      </div></div>`;
}

function draw() {
  if (!game) return home();
  if (game.finished) return result();
  const pct = Math.round(game.done() / game.total * 100);
  $app.innerHTML = `
    <div class="top">
      <div class="top-row"><button class="back" data-act="home">← К отрывку</button>
        <span class="count">${game.done()} из ${game.total}</span></div>
      <h2>${game.title}</h2>
      <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    </div>
    <p class="hint">${game.hint()}</p>
    ${game.body()}`;
}

$app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'home') { game = null; draw(); window.scrollTo(0, 0); return; }
  if (a === 'part' || a === 'all' || a === 'clear') {
    if (a === 'part') { const p = +id; selected.has(p) ? selected.delete(p) : selected.add(p); }
    if (a === 'all') selected = new Set(PARTS.map((_, p) => p));
    if (a === 'clear') selected = new Set();
    store.set('parts', [...selected]); return draw();
  }
  if (a === 'play') { const m = MODES.find((x) => x.id === id); game = m.make(); game.id = id; draw(); window.scrollTo(0, 0); return; }
  if (game && !game.finished) game.on(a, id);
});

draw();
</script>
</body>
</html>
