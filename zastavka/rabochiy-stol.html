:root{
  --text:#f6f8fd;
  --muted:rgba(226,232,247,.66);
  --line:rgba(255,255,255,.12);
  --accent:#ffc96b;
  --accent2:#ff8f70;
  --ok:#7fe0a8;
  --danger:#ff8b8b;
  --violet:#a99bff;
  --sky:#7fd0ff;
  --font:"Manrope","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --font-d:"Comfortaa","Manrope","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1530;color:var(--text);font-family:var(--font);font-size:15px;
  -webkit-font-smoothing:antialiased}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit}

.layout{position:fixed;inset:0;display:grid;grid-template-columns:minmax(300px,390px) 1fr minmax(380px,500px);
  gap:24px;padding:26px;pointer-events:none}
.col{display:flex;flex-direction:column;gap:16px;min-height:0}
.col.mid{justify-content:flex-end;align-items:center;gap:10px}

/* плашки */
.panel{pointer-events:auto;position:relative;border-radius:22px;padding:18px 18px 16px;
  background:linear-gradient(165deg,rgba(32,40,78,.92),rgba(16,21,44,.9));
  border:1px solid var(--line);
  box-shadow:0 20px 50px rgba(3,6,22,.5),inset 0 1px 0 rgba(255,255,255,.09)}
.panel::before{content:"";position:absolute;left:22px;right:22px;top:-1px;height:3px;border-radius:0 0 4px 4px;background:var(--pc)}
.panel.tasks{--pc:linear-gradient(90deg,#ffc96b,#ff8f70);
  box-shadow:0 20px 50px rgba(3,6,22,.5),0 0 0 1px rgba(255,190,110,.22),0 0 46px rgba(255,160,90,.16),inset 0 1px 0 rgba(255,255,255,.09)}
.panel.projects{--pc:linear-gradient(90deg,#a99bff,#7fd0ff);
  box-shadow:0 20px 50px rgba(3,6,22,.5),0 0 0 1px rgba(169,155,255,.2),0 0 40px rgba(130,140,255,.13),inset 0 1px 0 rgba(255,255,255,.09)}
.panel.focus{--pc:linear-gradient(90deg,#7fe0a8,#7fd0ff)}
.panel.notes{--pc:linear-gradient(90deg,#ff9fb2,#ffc96b)}
.panel.clock{--pc:none;background:linear-gradient(140deg,rgba(54,62,124,.88),rgba(22,28,60,.86))}

.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.ttl{display:flex;align-items:center;gap:10px;margin:0;font-family:var(--font-d);font-size:16px;font-weight:700;letter-spacing:.01em}
.ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--ib);color:var(--ic);flex:none}
.ico svg{width:17px;height:17px}
.tasks .ico{--ib:rgba(255,201,107,.18);--ic:#ffc96b}
.projects .ico{--ib:rgba(169,155,255,.2);--ic:#c3b8ff}
.focus .ico{--ib:rgba(127,224,168,.18);--ic:#7fe0a8}
.notes .ico{--ib:rgba(255,159,178,.18);--ic:#ffb3c2}
.count{font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.07);padding:4px 10px;border-radius:999px}

/* часы */
.clock .time{font-size:74px;font-weight:250;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  text-shadow:0 0 30px rgba(160,180,255,.35)}
.clock .time .colon{animation:blink 2s steps(1) infinite;margin:0 2px}
@keyframes blink{50%{opacity:.3}}
.clock .date{margin-top:8px;font-family:var(--font-d);font-size:18px;font-weight:700;text-transform:capitalize}
.clock .hello{margin-top:8px;font-size:15px;color:var(--muted)}
.clock .hello [contenteditable]{color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:12px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12)}
.chip.bad{background:rgba(255,100,100,.3);border-color:rgba(255,130,130,.55);font-weight:600}
.chip.warm{background:rgba(255,180,90,.24);border-color:rgba(255,190,110,.45)}

/* редактируемое */
[contenteditable]{outline:none;border-radius:6px;cursor:text}
[contenteditable]:focus{background:rgba(255,255,255,.08);box-shadow:0 0 0 2px rgba(255,201,107,.4)}
[data-ph]:empty:before{content:attr(data-ph);color:var(--muted);pointer-events:none}
.focus .txt{font-family:var(--font-d);font-weight:700;font-size:19px;line-height:1.4;min-height:28px;padding:2px 4px;display:block}
.notes{flex:none}
.notes textarea{width:100%;height:70px;min-height:50px;resize:vertical;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  color:var(--text);font:inherit;line-height:1.5;outline:none;padding:8px 10px;border-radius:12px}
.notes textarea:focus{border-color:rgba(255,201,107,.5)}
.notes textarea::placeholder{color:var(--muted)}

/* задачи */
.tasks{flex:1;display:flex;flex-direction:column;min-height:0}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 11px;border-radius:999px;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--muted);cursor:pointer;transition:.15s}
.fchip:hover{color:var(--text);background:rgba(255,255,255,.12)}

<script>
(function(){

/* ---------- данные ---------- */
var KEY = "rabochiy-stol.v1";
function uid(){ return Math.random().toString(36).slice(2,10); }

/* даты */
function ymd(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }

  var a = uid(), b = uid(), c = uid(), d = uid(), now = Date.now();

    name: "Ксения", focus: "", notes: "", season: "auto", light: "auto", filter: "all", showDone: false,
    projects: [
      {id:a, name:"Развитие ИСМ", color:COLORS[0], due:addDays(37)},
      {id:b, name:"Тренинги", color:COLORS[1], due:null},
      {id:c, name:"Аспирантура", color:COLORS[2], due:addDays(90)},
      {id:d, name:"Регулярный менеджмент", color:COLORS[3], due:null}
    ],
    tasks: [
      {text:"Отправить отчёт по несоответствиям", pid:a, due:addDays(-1), star:true},
      {text:"Подготовить материалы к тренингу по 5S", pid:b, due:addDays(0), star:true},
      {text:"Согласовать график внутренних аудитов", pid:a, due:addDays(2)},
      {text:"Узнать требования к вступительным экзаменам", pid:c, due:addDays(6)},
      {text:"Собрать обратную связь после тренинга", pid:b, due:addDays(12)},
      {text:"Обновить доску визуализации отдела", pid:d, due:null},
      {text:"Это пример выполненной задачи", pid:a, done:true, doneAt:now}
    ].map(function(t, i){ t.created = now + i; return norm(t); })
  };
}
function migrate(d){
  d.projects = (Array.isArray(d.projects) ? d.projects : []).map(function(p, i){
    return {id:p.id || uid(), name:p.name || "Проект", color:p.color || COLORS[i % COLORS.length], due:p.due || null}; });
  var ids = d.projects.map(function(p){ return p.id; });
  d.tasks = (Array.isArray(d.tasks) ? d.tasks : []).map(norm);

}

function $(id){ return document.getElementById(id); }
function el(tag, cls, txt){ var n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; }

/* редактируемый текст: Enter — готово, Esc — отмена */
function editable(node, value, onSave, onEmpty){
  node.contentEditable = "true";
  node.spellcheck = true;
  node.textContent = value || "";

    var v = node.textContent.trim();

/* ---------- задачи: ранжирование ---------- */
var GROUPS = [["over","Просрочено"],["today","Сегодня"],["tomorrow","Завтра"],["week","Ближайшие 7 дней"],["later","Позже"],["nodate","Без срока"],["done","Выполнено"]];
function bucket(t){
  if (t.done) return 6;

function isOver(t){ var n = daysLeft(t.due); return !t.done && n !== null && n < 0; }

/* кнопка срока: клик — выбор даты */
function dueBtn(val, onSet, title){

/* ---------- часы ---------- */
function isoWeek(d){
  var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}
function plural(n, a, b, c){ var m = n % 100, k = n % 10; if (m > 10 && m < 20) return c; if (k === 1) return a; if (k > 1 && k < 5) return b; return c; }
function tick(){
  var d = new Date(), h = d.getHours(), m = d.getMinutes();
  $("time").innerHTML = String(h).padStart(2,"0") + '<span class="colon">:</span>' + String(m).padStart(2,"0");
  $("date").textContent = d.toLocaleDateString("ru-RU", {weekday:"long", day:"numeric", month:"long"});
  $("greet").textContent = h < 5 ? "Доброй ночи" : h < 12 ? "Доброе утро" : h < 18 ? "Добрый день" : "Добрый вечер";
  var chips = [isoWeek(d) + "-я неделя"];
  var qEnd = new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3 + 3, 1);
  var qd = Math.ceil((qEnd - d) / 864e5);
  chips.push("до конца квартала " + qd + " " + plural(qd, "день", "дня", "дней"));
  if (d.getMonth() >= 10){
    var ny = Math.ceil((new Date(d.getFullYear() + 1, 0, 1) - d) / 864e5);
    chips.push("🎄 до Нового года " + ny + " " + plural(ny, "день", "дня", "дней"));
  }
  var over = S.tasks.filter(isOver).length;
  var today = S.tasks.filter(function(t){ return !t.done && daysLeft(t.due) === 0; }).length;
  var box = $("chips"); box.innerHTML = "";
  if (over){ var o = el("span", "chip bad", "⚠ просрочено: " + over); box.appendChild(o); }
  if (today) box.appendChild(el("span", "chip warm", "на сегодня: " + today));
  chips.forEach(function(c){ box.appendChild(el("span", "chip", c)); });
  // в полночь пересчитать сроки
  var dayKey = ymd(d);
  if (tick.day && tick.day !== dayKey){ renderTasks(); renderProjects(); }
  tick.day = dayKey;
}

var FS_OK = !!(window.showOpenFilePicker && window.showSaveFilePicker);
var fh = null, writing = Promise.resolve(), fileTimer = null, lastSaved = null;
var PICK = {types:[{description:"Мои задачи", accept:{"application/json":[".json"]}}]};

function idb(){
  return new Promise(function(res, rej){
    var r = indexedDB.open("rabochiy-stol", 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore("kv"); };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
function idbGet(k){ return idb().then(function(db){ return new Promise(function(res){
  var q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = function(){ res(q.result || null); }; q.onerror = function(){ res(null); }; }); }); }
function idbSet(k, v){ return idb().then(function(db){ return new Promise(function(res){
  var t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = res; }); }).catch(function(){}); }

function scheduleFile(){ if (!fh) return; clearTimeout(fileTimer); fileTimer = setTimeout(writeFile, 300); }
function writeFile(){
  if (!fh) return writing;
  var h = fh, data = JSON.stringify(S, null, 2);
  writing = writing.then(function(){ return h.createWritable(); })
    .then(function(w){ return w.write(data).then(function(){ return w.close(); }); })
    .then(function(){ lastSaved = new Date(); renderFileStatus(); })
    .catch(function(e){
      console.warn(e);
      toast("Не получилось записать в файл. Нажмите «Открыть» в окошке сверху.");
      fh = null; renderFileStatus(); showBanner(h);
    });
  return writing;
}
function useHandle(h, readFirst){
  fh = h; savedHandle = h; idbSet("handle", h);
  if (!readFirst) return writeFile().then(afterConnect);
  return h.getFile().then(function(f){ return f.text(); }).then(function(txt){
    var d = null;
    if (txt.trim()){ try { d = JSON.parse(txt); } catch(e){ fh = null; throw new Error("bad"); } }
    if (d && Array.isArray(d.tasks)){
      S = fromData(d);
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
      renderAll(); buildScene();
    } else if (d){ fh = null; throw new Error("bad"); }
    else return writeFile();
  }).then(afterConnect);
}
function afterConnect(){ if (!fh) return; hideBanner(); renderFileStatus(); toast("Задачи сохраняются в файл «" + fh.name + "»"); }
function fail(e){
  if (e && e.name === "AbortError") return;     // нажали «Отмена» в окне выбора файла
  console.warn(e);
  toast(e && e.message === "bad" ? "В этом файле не задачи — выберите другой" : "Не получилось открыть файл");
  showBanner(null);
}
var savedHandle = null, warnedUnsaved = false;
function createFile(){
  window.showSaveFilePicker(Object.assign({suggestedName:"moi-zadachi.json", id:"zadachi"}, PICK))
    .then(function(h){ return useHandle(h, false); }).catch(fail);
}
function openFile(){
  window.showOpenFilePicker(Object.assign({id:"zadachi"}, PICK)).then(function(hs){
    return hs[0].requestPermission({mode:"readwrite"}).then(function(p){
      if (p !== "granted") throw new Error("perm");
      return useHandle(hs[0], true);
    });
  }).catch(fail);
}
function reopen(h){
  h.requestPermission({mode:"readwrite"}).then(function(p){
    if (p !== "granted") throw new Error("perm");
    return useHandle(h, true);
  }).catch(function(e){ fail(e); });
}
function connect(){ if (savedHandle) reopen(savedHandle); else openFile(); }
function hideBanner(){ $("banner").classList.remove("show"); }
function showBanner(h){
  if (!FS_OK) return;
  var b = $("banner"); b.innerHTML = "";
  if (h){
    b.appendChild(el("span", null, "Задачи лежат в файле «" + h.name + "». Браузер просит разрешение после каждого запуска."));
    var m = el("button", "main", "Открыть мои задачи"); m.onclick = function(){ reopen(h); };
    var o = el("button", null, "Другой файл"); o.onclick = openFile;
    b.append(m, o);
  } else {
    b.appendChild(el("span", null, "Откройте файл с задачами moi-zadachi.json — он лежит рядом с этой заставкой."));
    var c = el("button", "main", "Открыть мои задачи"); c.onclick = openFile;
    var o2 = el("button", null, "Создать новый файл"); o2.onclick = createFile;

}
function renderFileStatus(){

  if (fh){
    b.className = "fstat ok";
    b.textContent = "💾 " + fh.name + (lastSaved ? " · " + String(lastSaved.getHours()).padStart(2,"0") + ":" + String(lastSaved.getMinutes()).padStart(2,"0") : "");
    b.title = "Задачи сохраняются в этот файл автоматически. Клик — выбрать другой файл";
  } else {
    b.className = "fstat warn"; b.textContent = "💾 открыть мои задачи"; b.title = "Файл задач ещё не открыт. Клик — открыть";
  }
}
$("fstat").onclick = function(){ if (fh) showBanner(null); else connect(); };
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "hidden" && fh){ clearTimeout(fileTimer); writeFile(); }
});
function warnIfUnsaved(){
  if (!FS_OK || fh || warnedUnsaved) return;
  warnedUnsaved = true;

function startFile(){
  renderFileStatus();

  idbGet("handle").then(function(h){
    savedHandle = h;
    if (!h){ showBanner(null); return; }
    h.queryPermission({mode:"readwrite"}).then(function(p){
      if (p === "granted") useHandle(h, true).catch(fail);
      else showBanner(h);   // браузер просит одно нажатие для доступа к файлу
    }).catch(function(){ showBanner(h); });
  }).catch(function(){ showBanner(null); });
}

function currentSeason(){
  if (S.season !== "auto") return S.season;
  var m = new Date().getMonth();
  if (m === 10 || m === 11 || m <= 1) return "winter";   // ноябрь у нас уже зима

}
var SUN = {winter:[9,16.3], spring:[6,20], summer:[4.5,21.5], autumn:[7.5,18]};
function currentDark(){
  if (S.light === "day") return 0;
  if (S.light === "dusk") return 0.5;
  if (S.light === "night") return 1;
  var d = new Date(), h = d.getHours() + d.getMinutes() / 60, s = SUN[season];
  if (h < s[0] - 1 || h > s[1] + 1) return 1;
  if (h < s[0] + 0.5) return clamp((s[0] + 0.5 - h) / 1.5);
  if (h > s[1] - 0.5) return clamp((h - s[1] + 0.5) / 1.5);

/* палитры */
var SKY = {
  winter:{day:["#4f86c6","#8db4de","#dfeaf6"], dusk:["#2f3a7c","#a86a9e","#ffb27e"]},
  spring:{day:["#3f95e0","#86c4f2","#e9f6ff"], dusk:["#38407e","#c26f98","#ffc08a"]},

};

function skyCols(){
  var s = SKY[season];
  if (dark <= 0.5) return s.day.map(function(c, i){ return mix(c, s.dusk[i], dark * 2); });

var LAND = {

/* ---------- построение ---------- */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ["sky","far","mid"].forEach(function(k){ LAY[k].c.width = Math.round((W + PAD * 2) * DPR); LAY[k].c.height = Math.round((H + PAD * 2) * DPR); });
  buildScene();
}
function prep(L){
  L.x.setTransform(1,0,0,1,0,0); L.x.clearRect(0, 0, L.c.width, L.c.height);
  L.x.setTransform(DPR, 0, 0, DPR, PAD * DPR, PAD * DPR);

function buildScene(){
  season = currentSeason(); dark = currentDark();
  GY = Math.round(H * 0.79);
  var wide = W > 1100;
  VIS.l = wide ? 430 : 0; VIS.r = wide ? W - 540 : W; VIS.c = (VIS.l + VIS.r) / 2;
  genTown();

function genTown(){
  var R = rng(1234 + Math.round(W / 50));
  SC = {houses:[], trees:[], fences:[], lamps:[], tower:null, snowman:null, deco:[], wins:[], chimneys:[], garland:[], clock:null};
  var x = -PAD + R() * 16, idx = 0, towerDone = false;
  while (x < W + PAD){
    if (!towerDone && x > VIS.c - 110){
      var tw = 50;
      SC.tower = {x:VIS.c - tw / 2, w:tw, base:GY + 12, h:Math.max(150, H * 0.17), id:"t"};
      SC.trees.push({x:VIS.c - 52, base:GY + 10, h:84, kind:"fir", back:true});
      SC.trees.push({x:VIS.c + 54, base:GY + 12, h:96, kind:"fir", back:true});
      x = VIS.c + 80; towerDone = true; continue;
    }
    var r = R(), type = r < 0.42 ? "two" : r < 0.72 ? "cottage" : "long";
    var w = type === "cottage" ? 98 + R() * 24 : type === "two" ? 120 + R() * 34 : 152 + R() * 34;
    var h = type === "two" ? 108 + R() * 18 : 64 + R() * 14;
    SC.houses.push(makeHouse(R, x, w, h, type, idx++));
    x += w;
    var g = R();
    if (g < 0.36){ SC.trees.push({x:x + 24, base:GY + 14 + R() * 6, h:72 + R() * 56, kind:treeKind(R)}); x += 50 + R() * 16; }
    else if (g < 0.62){
      var fw = 36 + R() * 40;
      SC.fences.push({x:x + 8, w:fw, base:GY + 20, c:R() < 0.5 ? "#efe3cc" : "#8a6a4a"});
      SC.lamps.push({x:x + fw + 20, base:GY + 22});
      x += fw + 34;
    } else {
      if (R() < 0.6) SC.trees.push({x:x + 4, base:GY + 6, h:60 + R() * 50, kind:treeKind(R), back:true});
      x += 16 + R() * 22;
    }
  }
  // передний план
  var fx = VIS.c;
  if (season === "winter") SC.snowman = {x:fx - 170, y:GY + 74};
  for (var i = 0; i < 26; i++){
    SC.deco.push({x:VIS.l + R() * (VIS.r - VIS.l), y:GY + 40 + R() * (H - GY - 50), s:0.6 + R() * 0.8, k:R(), c:Math.floor(R() * 5)});
  }
}
function treeKind(R){
  var r = R();
  if (season === "winter") return r < 0.62 ? "fir" : "birch";
  if (season === "autumn") return r < 0.4 ? "birch" : r < 0.75 ? "round" : "fir";
  return r < 0.35 ? "birch" : r < 0.75 ? "round" : "fir";
}
function makeHouse(R, x, w, h, type, idx){
  var floors = type === "two" ? 2 : 1;
  var cols = type === "long" ? 4 : type === "two" ? (w > 140 ? 3 : 2) : 2;
  var hs = {
    type:type, x:x, w:w, h:h, base:GY + 12 + R() * 8, roofH:type === "long" ? 36 + R() * 10 : 44 + R() * 24,
    wall:pick(R, WALLS), roof:pick(R, ROOFS), trim:pick(R, TRIMS), shut:pick(R, SHUT), door:pick(R, DOORS), curt:pick(R, CURT),
    wood:R() < 0.55, shutters:R() < 0.5, attic:type !== "long" && R() < 0.65, canopy:R() < 0.6, lantern:R() < 0.75,
    chim:R() < 0.85 ? {x:x + w * (R() < 0.5 ? 0.22 : 0.66)} : null, wins:[]
  };
  var ww = type === "two" ? 20 : 19, wh = floors === 2 ? 24 : 26, fh = h / floors;
  var doorSlot = cols === 3 ? 1 : cols === 4 ? 1 : -1;
  hs.doorX = doorSlot >= 0 ? x + w * (doorSlot + 0.5) / cols : x + w / 2;
  for (var f = 0; f < floors; f++){
    for (var c = 0; c < cols; c++){
      if (f === 0 && c === doorSlot) continue;
      var cx = cols === 2 ? x + w * (c === 0 ? 0.24 : 0.76) : x + w * (c + 0.5) / cols;
      var top = hs.base - (f + 1) * fh;
      var wy = top + (fh - wh) / 2 - (f === 0 ? 4 : 0);
      hs.wins.push({x:cx - ww / 2, y:wy, w:ww, h:wh, id:idx + "-" + f + "-" + c, def:R() < 0.78, ground:f === 0, cat:R() < 0.07});
    }

  if (hs.attic) hs.atticWin = {id:idx + "-a", def:R() < 0.5};

}

/* ---------- небо ---------- */
function drawSky(){
  var x = prep(LAY.sky), c = skyCols();
  var g = x.createLinearGradient(0, -PAD, 0, GY);
  g.addColorStop(0, c[0]); g.addColorStop(0.55, c[1]); g.addColorStop(1, c[2]);
  x.fillStyle = g; x.fillRect(-PAD, -PAD, W + PAD * 2, H + PAD * 2);
  var bell = Math.sin(Math.PI * clamp(dark));
  // закатное свечение у горизонта
  if (bell > 0.05){
    x.save(); x.scale(1, 0.35);
    glow(x, VIS.c + 140, GY / 0.35, W * 0.7, "#ff9a5c", 0.45 * bell);
    x.restore();
  }
  // солнце
  if (dark < 0.8){
    var t = clamp(dark / 0.62);
    var sx = VIS.c + 160, sy = lerp(H * 0.15, GY - 60, t);
    var a = 1 - clamp((dark - 0.6) / 0.2);
    glow(x, sx, sy, lerp(200, 320, t), mix("#fff3c4", "#ff8a4a", t), 0.55 * a);
    glow(x, sx, sy, 70, "#fffbe6", 0.6 * a);
    x.globalAlpha = a; x.fillStyle = mix("#fffbea", "#ffb36a", t); circle(x, sx, sy, 30); x.globalAlpha = 1;
  }
  // луна
  if (dark > 0.45){
    var ma = clamp((dark - 0.45) / 0.4), mx = VIS.c + 230, my = H * 0.14;
    glow(x, mx, my, 150, "#dfe6ff", 0.22 * ma);
    glow(x, mx, my, 55, "#fff8e0", 0.35 * ma);
    x.globalAlpha = ma;
    x.fillStyle = "#f6f1dc"; circle(x, mx, my, 32);
    x.fillStyle = "rgba(170,160,130,.25)";
    [[-10,-8,7],[9,6,9],[-4,13,4],[12,-12,4],[-15,6,3]].forEach(function(k){ circle(x, mx + k[0], my + k[1], k[2]); });
    var sg = x.createRadialGradient(mx - 10, my - 10, 4, mx, my, 32);
    sg.addColorStop(0, "rgba(255,255,255,0)"); sg.addColorStop(1, "rgba(120,120,160,.25)");
    x.fillStyle = sg; circle(x, mx, my, 32);
    x.globalAlpha = 1;
  }
}

/* ---------- горы и дальний лес ---------- */
function ridge(R, y0, amp, rough){
  var n = 129, pts = new Array(n);
  pts[0] = y0 + (R() - 0.5) * amp; pts[n - 1] = y0 + (R() - 0.5) * amp;
  var step = n - 1, a = amp;
  while (step > 1){
    var half = step / 2;
    for (var i = half; i < n; i += step) pts[i] = (pts[i - half] + pts[i + half]) / 2 + (R() - 0.5) * a;
    step = half; a *= rough;
  }
  return pts;
}
function ridgePath(x, pts, bottom){
  var sw = (W + PAD * 2) / (pts.length - 1);
  x.beginPath(); x.moveTo(-PAD, bottom);
  for (var i = 0; i < pts.length; i++) x.lineTo(-PAD + i * sw, pts[i]);
  x.lineTo(W + PAD, bottom); x.closePath();
}
function drawFar(){
  var x = prep(LAY.far), P = LAND[season], c = skyCols(), hz = c[2], R = rng(77);
  // дальний хребет
  var p1 = ridge(R, GY - H * 0.2, H * 0.2, 0.55), top1 = Math.min.apply(null, p1);
  ridgePath(x, p1, GY + 40);
  x.fillStyle = sh(mix(P.m1, hz, 0.45), 0.75); x.fill();
  x.save(); ridgePath(x, p1, GY + 40); x.clip();
  var cap = x.createLinearGradient(0, top1, 0, top1 + H * 0.09);
  var capCol = season === "winter" || season === "spring" ? "#ffffff" : mix(hz, "#ffffff", 0.4);
  cap.addColorStop(0, rgba(sh(capCol, 0.6), season === "winter" ? 0.85 : 0.35)); cap.addColorStop(1, rgba(capCol, 0));
  x.fillStyle = cap; x.fillRect(-PAD, top1, W + PAD * 2, H * 0.1);
  var haze = x.createLinearGradient(0, GY - H * 0.12, 0, GY);
  haze.addColorStop(0, rgba(hz, 0)); haze.addColorStop(1, rgba(hz, 0.55));
  x.fillStyle = haze; x.fillRect(-PAD, GY - H * 0.12, W + PAD * 2, H * 0.12 + 40);
  x.restore();
  // ближний хребет
  var p2 = ridge(R, GY - H * 0.09, H * 0.07, 0.5);
  ridgePath(x, p2, GY + 40);
  x.fillStyle = sh(mix(P.m2, hz, 0.22), 0.7); x.fill();
  // огоньки дальней деревни
  if (dark > 0.5){
    var sw = (W + PAD * 2) / (p2.length - 1);
    for (var i = 0; i < 40; i++){
      var k = Math.floor(R() * p2.length), lx = -PAD + k * sw, ly = p2[k] + 8 + R() * 20;
      x.fillStyle = rgba("#ffd27a", 0.5 + R() * 0.4 * (dark - 0.5) * 2); x.fillRect(lx, ly, 1.6, 1.6);
    }
  }
  // кромка леса
  var fc = sh(mix(P.forest, hz, 0.3), 0.75);
  x.fillStyle = fc;
  x.beginPath(); x.moveTo(-PAD, GY + 20);
  for (var fx2 = -PAD; fx2 <= W + PAD; fx2 += 6){
    var th = 8 + R() * 16;
    x.lineTo(fx2, GY - 2); x.lineTo(fx2 + 3, GY - 2 - th); x.lineTo(fx2 + 6, GY - 2);
  }
  x.lineTo(W + PAD, GY + 20); x.closePath(); x.fill();
  if (season === "winter"){
    x.fillStyle = rgba(sh("#ffffff", 0.6), 0.5);
    for (var s2 = -PAD; s2 <= W + PAD; s2 += 6) if (R() < 0.5) x.fillRect(s2 + 2, GY - 10 - R() * 8, 2, 2);
  }
}

/* ---------- городок ---------- */
function drawMid(){
  var x = prep(LAY.mid);
  SC.wins = []; SC.chimneys = []; SC.garland = []; SC.clock = null;
  drawGround(x);
  SC.trees.forEach(function(t){ if (t.back) drawTree(x, t); });
  SC.fences.forEach(function(f){ drawFence(x, f); });
  if (SC.tower) drawTower(x, SC.tower);
  SC.houses.forEach(function(h){ drawHouse(x, h); });
  SC.trees.forEach(function(t){ if (!t.back) drawTree(x, t); });
  SC.lamps.forEach(function(l){ drawLamp(x, l); });
  drawFront(x);
}
function snowCol(){ return mix("#ffffff", "#aebde0", dark * 0.85); }
function drawGround(x){
  var P = LAND[season], gc = mix(P.ground, P.groundN, dark);
  var g = x.createLinearGradient(0, GY, 0, H + PAD);
  g.addColorStop(0, gc); g.addColorStop(1, mix(gc, SHADE, 0.3));
  x.fillStyle = g;
  x.beginPath(); x.moveTo(-PAD, H + PAD);
  for (var i = -PAD; i <= W + PAD; i += 14) x.lineTo(i, GY + 6 + Math.sin(i * 0.011) * 4 + Math.sin(i * 0.037) * 2);
  x.lineTo(W + PAD, H + PAD); x.closePath(); x.fill();
  // тропинка к башне
  if (SC.tower){
    var tx = SC.tower.x + SC.tower.w / 2, ty = SC.tower.base;
    x.fillStyle = season === "winter" ? mix("#dde5f1", "#7f90b8", dark) : sh(season === "autumn" ? "#c7a774" : "#d8c497", 0.6);
    x.beginPath(); x.moveTo(tx - 9, ty);
    x.bezierCurveTo(tx - 18, ty + 50, tx + 90, H - 90, tx + 40, H + PAD);
    x.lineTo(tx + 150, H + PAD);
    x.bezierCurveTo(tx + 150, H - 90, tx + 14, ty + 50, tx + 9, ty);
    x.closePath(); x.fill();
  }
}
function drawFront(x){
  var R = rng(9);
  SC.deco.forEach(function(d){
    if (season === "winter"){
      x.fillStyle = rgba("#ffffff", (0.5 + d.k * 0.5) * (1 - dark * 0.4));
      x.fillRect(d.x, d.y, 1.5, 1.5);
    } else if (season === "spring" || season === "summer"){
      var fc = (season === "spring" ? ["#ffd6e5","#fff3a8","#ffffff","#f7a8c8","#c9b6ff"] : ["#ff6b6b","#ffd34d","#ffffff","#c38bff","#ff9f43"])[d.c];
      for (var j = 0; j < 4; j++){
        var px = d.x + (R() - 0.5) * 18, py = d.y + (R() - 0.5) * 8;
        x.strokeStyle = sh("#3f7a34", 0.6); x.lineWidth = 1; x.beginPath(); x.moveTo(px, py); x.lineTo(px, py + 6 * d.s); x.stroke();
        x.fillStyle = sh(fc, 0.55); circle(x, px, py, 2.2 * d.s);
      }
    } else {
      var lc = ["#e0782a","#c9482a","#e9b23c","#b8562a","#d98a2a"][d.c];
      for (var k = 0; k < 6; k++){ x.fillStyle = sh(lc, 0.55); ell(x, d.x + (R() - 0.5) * 22, d.y + (R() - 0.5) * 5, 3.5 * d.s, 1.8 * d.s); }
    }
  });
  if (SC.snowman) drawSnowman(x, SC.snowman.x, SC.snowman.y);
}
function drawSnowman(x, cx, cy){
  var sc = snowCol();
  x.fillStyle = "rgba(60,80,140,.18)"; ell(x, cx + 4, cy + 2, 26, 5);
  [[0, -12, 18],[0, -38, 13],[0, -58, 9.5]].forEach(function(b){
    var g = x.createRadialGradient(cx + b[0] - b[2] * 0.4, cy + b[1] - b[2] * 0.4, 2, cx + b[0], cy + b[1], b[2]);
    g.addColorStop(0, sc); g.addColorStop(1, mix(sc, "#8ea2cc", 0.45));
    x.fillStyle = g; circle(x, cx + b[0], cy + b[1], b[2]);
  });
  x.fillStyle = "#222"; circle(x, cx - 3.5, cy - 60, 1.4); circle(x, cx + 3.5, cy - 60, 1.4);
  [cy - 42, cy - 36, cy - 30].forEach(function(y){ circle(x, cx, y, 1.5); });
  x.fillStyle = "#ff8a2a"; x.beginPath(); x.moveTo(cx, cy - 57); x.lineTo(cx + 12, cy - 55.5); x.lineTo(cx, cy - 54.5); x.fill();
  x.fillStyle = sh("#d9474a", 0.4); x.fillRect(cx - 11, cy - 50, 22, 5); x.fillRect(cx + 4, cy - 48, 5, 13);
  x.fillStyle = sh("#2b2f3a", 0.3); x.fillRect(cx - 9, cy - 69, 18, 3); x.fillRect(cx - 6, cy - 81, 12, 12);
  x.strokeStyle = sh("#6b4a2e", 0.4); x.lineWidth = 2;
  x.beginPath(); x.moveTo(cx - 12, cy - 40); x.lineTo(cx - 28, cy - 50); x.moveTo(cx + 12, cy - 40); x.lineTo(cx + 27, cy - 52); x.stroke();
}

/* деревья */
function drawTree(x, t){
  if (t.kind === "fir") return drawFir(x, t.x, t.base, t.h, t.back);
  if (t.kind === "birch") return drawBirch(x, t.x, t.base, t.h);
  return drawRound(x, t.x, t.base, t.h);
}
function drawFir(x, cx, base, h, back){
  var col = sh(back ? "#2c5747" : "#2f6150", 0.62), dk = sh("#1f4236", 0.62);
  x.fillStyle = sh("#5a3d2b", 0.6); x.fillRect(cx - 3, base - h * 0.14, 6, h * 0.14);
  for (var i = 0; i < 4; i++){
    var ty = base - h * 0.1 - i * h * 0.2, tw = h * (0.34 - i * 0.065), th = h * 0.36;
    x.fillStyle = col;
    x.beginPath(); x.moveTo(cx - tw, ty);
    x.quadraticCurveTo(cx - tw * 0.35, ty - th * 0.45, cx, ty - th);
    x.quadraticCurveTo(cx + tw * 0.35, ty - th * 0.45, cx + tw, ty);
    x.quadraticCurveTo(cx, ty - 6, cx - tw, ty); x.fill();
    x.fillStyle = dk;
    x.beginPath(); x.moveTo(cx, ty - th); x.quadraticCurveTo(cx + tw * 0.35, ty - th * 0.45, cx + tw, ty); x.quadraticCurveTo(cx + tw * 0.5, ty - 4, cx, ty - 3); x.fill();
    if (season === "winter"){
      x.fillStyle = snowCol();
      x.beginPath(); x.moveTo(cx - tw * 0.8, ty - 3);
      x.quadraticCurveTo(cx - tw * 0.3, ty - th * 0.5, cx, ty - th + 2);
      x.quadraticCurveTo(cx + tw * 0.25, ty - th * 0.55, cx + tw * 0.55, ty - 5);
      x.quadraticCurveTo(cx + tw * 0.1, ty - th * 0.3, cx - tw * 0.1, ty - 7);
      x.quadraticCurveTo(cx - tw * 0.45, ty - 2, cx - tw * 0.8, ty - 3); x.fill();
    }
  }
}
function drawBirch(x, cx, base, h){
  var bark = sh("#f1eee6", 0.6);
  x.fillStyle = bark;
  x.beginPath(); x.moveTo(cx - 3.5, base); x.lineTo(cx - 1.5, base - h * 0.9); x.lineTo(cx + 1.5, base - h * 0.9); x.lineTo(cx + 3.5, base); x.fill();
  x.fillStyle = sh("#2b2b2b", 0.3);
  for (var i = 0; i < 9; i++){ var my = base - 6 - i * h * 0.09; x.fillRect(cx - 3 + (i % 2) * 2, my, 3 + (i % 3), 1.5); }
  x.strokeStyle = sh("#5b4a3e", 0.5); x.lineWidth = 1.2;
  var R = rng(Math.round(cx * 7));
  for (var b = 0; b < 7; b++){
    var by = base - h * (0.35 + b * 0.08), dir = b % 2 ? 1 : -1, len = h * (0.22 - b * 0.015);
    x.beginPath(); x.moveTo(cx, by); x.quadraticCurveTo(cx + dir * len * 0.6, by - len * 0.3, cx + dir * len, by - len * 0.15 + R() * 6); x.stroke();
  }

  for (var ry = top - rh + 8, rr = 0; ry < top + 4; ry += 6, rr++){ x.fillStyle = "rgba(0,0,0,.2)"; x.fillRect(tx - 10, ry, w + 20, 1); x.fillStyle = "rgba(0,0,0,.1)"; for (var px = tx - 8 + (rr % 2) * 4; px < tx + w + 8; px += 8) x.fillRect(px, ry - 6, 1, 6); }
  var rg = x.createLinearGradient(cx, 0, tx + w + 8, 0); rg.addColorStop(0, "rgba(0,0,0,0)"); rg.addColorStop(1, "rgba(0,0,0,.28)");
  x.fillStyle = rg; x.fillRect(cx, top - rh, w, rh + 4);
  x.restore();
  if (season === "winter"){
    x.fillStyle = snowCol();
    x.beginPath(); x.moveTo(tx - 9, top + 4); x.lineTo(cx - 14, top - rh * 0.55); x.quadraticCurveTo(cx - 8, top - rh * 0.4, cx - 4, top - rh * 0.5);
    x.lineTo(cx + 12, top - rh * 0.3); x.quadraticCurveTo(cx + 20, top - rh * 0.1, tx + w + 9, top + 4); x.quadraticCurveTo(cx, top - 4, tx - 9, top + 4); x.fill();
  }
  x.strokeStyle = sh("#3a3a3a", 0.3); x.lineWidth = 2; x.beginPath(); x.moveTo(cx, top - rh); x.lineTo(cx, top - rh - 18); x.stroke();
  x.fillStyle = "#e9c45a"; circle(x, cx, top - rh - 2, 3);
  x.fillStyle = sh("#d9474a", 0.3); x.beginPath(); x.moveTo(cx + 1, top - rh - 18); x.lineTo(cx + 13, top - rh - 14.5); x.lineTo(cx + 1, top - rh - 11); x.fill();
}

/* ---------- живое: звёзды, облака, сияние ---------- */
function initStars(){
  var R = rng(5); stars = [];
  var n = Math.round(W * H / 7000);
  for (var i = 0; i < n; i++) stars.push({x:R() * W, y:R() * GY * 0.78, r:R() < 0.08 ? 1.6 + R() : 0.5 + R() * 0.9, p:R() * 6.28, s:0.6 + R() * 2.2});
}
function cloudColors(){
  var day = [["#ffffff",0.95],["#d3def0",0.9]], dusk = [["#ffd5b8",0.95],["#a7779f",0.85]], night = [["#4f5b8a",0.5],["#252e5a",0.45]];
  var a, b, t;
  if (dark <= 0.5){ a = day; b = dusk; t = dark * 2; } else { a = dusk; b = night; t = (dark - 0.5) * 2; }
  return [rgba(mix(a[0][0], b[0][0], t), lerp(a[0][1], b[0][1], t)), rgba(mix(a[1][0], b[1][0], t), lerp(a[1][1], b[1][1], t))];
}
function makeCloud(R){
  var w = 180 + R() * 220, h = 64 + R() * 46;
  var c = document.createElement("canvas"); c.width = Math.ceil(w * DPR); c.height = Math.ceil(h * DPR);
  var x = c.getContext("2d"); x.scale(DPR, DPR);
  x.filter = "blur(2.5px)"; x.fillStyle = "#fff";
  var n = 6 + Math.floor(R() * 5);
  for (var i = 0; i < n; i++){
    var k = i / (n - 1), r = h * (0.2 + 0.26 * Math.sin(Math.PI * k)) * (0.8 + R() * 0.4);
    circle(x, w * (0.14 + 0.72 * k), h * 0.66 - r * 0.55, r);
  }
  x.fillRect(w * 0.12, h * 0.5, w * 0.76, h * 0.22);
  x.filter = "none"; x.globalCompositeOperation = "source-in";
  var cc = cloudColors(), g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, cc[0]); g.addColorStop(1, cc[1]); x.fillStyle = g; x.fillRect(0, 0, w, h);
  return {c:c, w:w, h:h};
}
function initClouds(){
  var R = rng(31); clouds = [];
  var n = dark > 0.7 ? 3 : 6;
  for (var i = 0; i < n; i++) clouds.push({s:makeCloud(R), x:R() * (W + 400) - 200, y:H * (0.05 + R() * 0.3), v:3 + R() * 7, z:0.6 + R() * 0.5});
}
function getAuroraStrip(){
  if (auroraStrip) return auroraStrip;
  var c = document.createElement("canvas"); c.width = 1; c.height = 160;
  var x = c.getContext("2d"), g = x.createLinearGradient(0, 0, 0, 160);
  g.addColorStop(0, "rgba(170,100,255,0)"); g.addColorStop(0.45, "rgba(140,110,255,.22)");
  g.addColorStop(0.82, "rgba(90,255,180,.75)"); g.addColorStop(0.95, "rgba(170,255,215,.9)"); g.addColorStop(1, "rgba(170,255,215,0)");
  x.fillStyle = g; x.fillRect(0, 0, 1, 160);
  return (auroraStrip = c);
}

/* ---------- погода ---------- */
function makeParticles(){
  particles = [];
  var n = season === "winter" ? Math.round(W * H / 6000) : season === "summer" ? 45 : 60;
  if (reduced) n = Math.round(n / 4);
  for (var i = 0; i < n; i++) particles.push(newP(true));
}
function newP(anyY){
  var p = {x:Math.random() * W, y:anyY ? Math.random() * H : -20, ph:Math.random() * 6.28, vx:0};
  if (season === "winter"){ var z = Math.random(); p.r = 0.8 + z * 2.6; p.vy = 0.3 + z * 1.1; p.a = 0.45 + z * 0.5; }
  else if (season === "autumn"){ p.s = 5 + Math.random() * 5; p.vy = 0.5 + Math.random() * 0.8; p.rot = Math.random() * 6.28; p.vr = (Math.random() - 0.5) * 0.06;
    p.c = ["#e0782a","#d0482a","#e9b23c","#b8562a"][Math.floor(Math.random() * 4)]; }
  else if (season === "spring"){ p.s = 3 + Math.random() * 3; p.vy = 0.35 + Math.random() * 0.5; p.rot = Math.random() * 6.28; p.vr = (Math.random() - 0.5) * 0.05;
    p.c = ["#f7c6d6","#ffffff","#f2a7c0"][Math.floor(Math.random() * 3)]; }
  else { p.y = anyY ? Math.random() * H : H + 10; p.r = 1 + Math.random() * 2; p.vy = -(0.1 + Math.random() * 0.3); }
  return p;
}

/* ---------- салют ---------- */
function launch(tx, ty){
  rockets.push({x:tx + (Math.random() - 0.5) * 60, y:GY + 10, tx:tx, ty:ty, hue:Math.floor(Math.random() * 360)});
}
function burst(x0, y0, hue){
  var n = reduced ? 30 : 70;
  for (var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2, s = 1.2 + Math.random() * 3.2;
    sparks.push({x:x0, y:y0, vx:Math.cos(a) * s, vy:Math.sin(a) * s, life:1, hue:hue + (Math.random() - 0.5) * 40});
  }
}
function celebrate(){
  var l = VIS.l + 80, r = VIS.r - 80;
  for (var i = 0; i < 3; i++) (function(i){
    setTimeout(function(){ launch(l + Math.random() * (r - l), H * (0.15 + Math.random() * 0.2)); }, i * 380);
  })(i);
}

/* ---------- кадр ---------- */
var t0 = performance.now(), lastT = t0;
function layerAt(L, ox, oy){ ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(L.c, Math.round((ox - PAD) * DPR), Math.round((oy - PAD) * DPR)); }
function frame(now){
  var t = (now - t0) / 1000, dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (!reduced){ par.x += (mouse.nx - par.x) * 0.04; par.y += (mouse.ny - par.y) * 0.04; }
  var so = {x:-par.x * 4, y:-par.y * 2}, fo = {x:-par.x * 9, y:-par.y * 3.5}, mo = {x:-par.x * 18, y:-par.y * 6};

  layerAt(LAY.sky, so.x, so.y);
  ctx.setTransform(DPR, 0, 0, DPR, so.x * DPR, so.y * DPR);
  // звёзды
  var sa = clamp((dark - 0.35) / 0.4);
  if (sa > 0){
    for (var i = 0; i < stars.length; i++){
      var s = stars[i], a = sa * (0.55 + 0.45 * Math.sin(t * s.s + s.p));
      ctx.fillStyle = "rgba(255,255,255," + a.toFixed(3) + ")";
      if (s.r > 1.5){
        ctx.fillRect(s.x - s.r * 2, s.y - 0.4, s.r * 4, 0.8); ctx.fillRect(s.x - 0.4, s.y - s.r * 2, 0.8, s.r * 4);
        circle(ctx, s.x, s.y, s.r * 0.7);
      } else ctx.fillRect(s.x, s.y, s.r, s.r);
    }
  }
  // северное сияние
  if (season === "winter" && dark > 0.6){
    var A = 0.55 * clamp((dark - 0.6) / 0.35), strip = getAuroraStrip();
    ctx.globalCompositeOperation = "lighter";
    for (var rb = 0; rb < 2; rb++){
      for (var ax = -20; ax < W + 20; ax += 6){
        var yb = H * (0.24 + rb * 0.07) + Math.sin(ax * 0.0035 + t * 0.22 + rb * 2) * 34 + Math.sin(ax * 0.011 - t * 0.35 + rb) * 12;
        var hh = 120 + 60 * Math.sin(ax * 0.006 + t * 0.3 + rb * 1.3);
        ctx.globalAlpha = A * (0.5 + 0.5 * Math.sin(ax * 0.018 + t * 0.9 + rb * 3)) * (rb ? 0.6 : 1);
        ctx.drawImage(strip, ax, yb - hh, 7, hh);
      }
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  }
  // падающие звёзды
  if (dark > 0.6 && !reduced && now > nextMeteor){
    meteors.push({x:Math.random() * W * 0.8 + W * 0.1, y:Math.random() * H * 0.25, vx:-(6 + Math.random() * 4), vy:2.5 + Math.random() * 2, life:1});
    nextMeteor = now + 7000 + Math.random() * 12000;
  }
  for (var m = meteors.length - 1; m >= 0; m--){
    var me = meteors[m]; me.x += me.vx; me.y += me.vy; me.life -= 0.018;
    if (me.life <= 0){ meteors.splice(m, 1); continue; }
    var mg = ctx.createLinearGradient(me.x, me.y, me.x - me.vx * 10, me.y - me.vy * 10);
    mg.addColorStop(0, "rgba(255,255,255," + me.life + ")"); mg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.strokeStyle = mg; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(me.x, me.y); ctx.lineTo(me.x - me.vx * 10, me.y - me.vy * 10); ctx.stroke();
  }
  // облака
  for (var c = 0; c < clouds.length; c++){
    var cl = clouds[c];
    if (!reduced) cl.x += cl.v * dt;
    if (cl.x > W + 60) cl.x = -cl.s.w * cl.z - 60;
    ctx.drawImage(cl.s.c, cl.x, cl.y, cl.s.w * cl.z, cl.s.h * cl.z);
  }

  layerAt(LAY.far, fo.x, fo.y);
  layerAt(LAY.mid, mo.x, mo.y);

  // всё, что привязано к городку
  ctx.setTransform(DPR, 0, 0, DPR, mo.x * DPR, mo.y * DPR);
  if (SC.clock){
    var d = new Date(), hr = (d.getHours() % 12 + d.getMinutes() / 60) * Math.PI / 6 - Math.PI / 2, mn = (d.getMinutes() + d.getSeconds() / 60) * Math.PI / 30 - Math.PI / 2;
    ctx.strokeStyle = "#2e2418"; ctx.lineCap = "round";
    ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(SC.clock.x, SC.clock.y); ctx.lineTo(SC.clock.x + Math.cos(hr) * 7, SC.clock.y + Math.sin(hr) * 7); ctx.stroke();
    ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(SC.clock.x, SC.clock.y); ctx.lineTo(SC.clock.x + Math.cos(mn) * 11, SC.clock.y + Math.sin(mn) * 11); ctx.stroke();
    ctx.fillStyle = "#2e2418"; circle(ctx, SC.clock.x, SC.clock.y, 1.6);
  }
  if ((season === "winter" || season === "autumn") && !reduced){
    if (SC.chimneys.length && Math.random() < 0.3){
      var ch = SC.chimneys[Math.floor(Math.random() * SC.chimneys.length)];
      smoke.push({x:ch.x, y:ch.y, r:4, a:0.32, vx:0.12 + Math.random() * 0.2, vy:-0.45 - Math.random() * 0.3});
    }
    var scol = dark > 0.5 ? "190,200,230" : "246,248,252";
    for (var k = smoke.length - 1; k >= 0; k--){
      var sm = smoke[k]; sm.x += sm.vx + Math.sin(t + k) * 0.05; sm.y += sm.vy; sm.r += 0.13; sm.a -= 0.0024;
      if (sm.a <= 0){ smoke.splice(k, 1); continue; }
      ctx.fillStyle = "rgba(" + scol + "," + sm.a.toFixed(3) + ")"; circle(ctx, sm.x, sm.y, sm.r);
    }
  }
  if (SC.garland.length){
    for (var gi = 0; gi < SC.garland.length; gi++){
      var b = SC.garland[gi], tw = reduced ? 1 : 0.55 + 0.45 * Math.sin(t * 2.4 + b.p);
      var ga = (0.5 + dark * 0.5) * tw;
      if (dark > 0.3){ ctx.fillStyle = rgba(b.c, ga * 0.28); circle(ctx, b.x, b.y, 6); }
      ctx.fillStyle = rgba(b.c, Math.max(0.4, ga)); circle(ctx, b.x, b.y, 2.1);
    }
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // салют
  if (rockets.length || sparks.length){
    ctx.globalCompositeOperation = "lighter";
    for (var q = rockets.length - 1; q >= 0; q--){
      var rk = rockets[q], dx = rk.tx - rk.x, dy = rk.ty - rk.y;
      rk.x += dx * 0.06; rk.y += dy * 0.06 - 1.5;
      ctx.fillStyle = "hsla(" + rk.hue + ",100%,75%,.9)"; circle(ctx, rk.x, rk.y, 2);
      ctx.fillStyle = "hsla(" + rk.hue + ",100%,70%,.3)"; circle(ctx, rk.x, rk.y + 6, 1.5);
      if (rk.y <= rk.ty + 4){ burst(rk.x, rk.y, rk.hue); rockets.splice(q, 1); }
    }
    for (var z = sparks.length - 1; z >= 0; z--){
      var sp = sparks[z]; sp.x += sp.vx; sp.y += sp.vy; sp.vx *= 0.985; sp.vy = sp.vy * 0.985 + 0.035; sp.life -= 0.011;
      if (sp.life <= 0){ sparks.splice(z, 1); continue; }
      ctx.fillStyle = "hsla(" + sp.hue + ",100%," + (60 + sp.life * 25) + "%," + sp.life.toFixed(3) + ")";
      circle(ctx, sp.x, sp.y, 1.1 + sp.life * 1.3);
    }
    ctx.globalCompositeOperation = "source-over";
  }
  // осадки
  var wind = Math.sin(t * 0.15) * 0.4;
  for (var j = 0; j < particles.length; j++){
    var p = particles[j];
    var mdx = p.x - mouse.x, mdy = p.y - mouse.y, md = mdx * mdx + mdy * mdy;
    if (md < 6400 && md > 1){ var f = (1 - Math.sqrt(md) / 80) * 2.2; p.vx += mdx / Math.sqrt(md) * f * 0.3; }
    p.vx *= 0.94;
    if (season === "winter"){
      p.y += p.vy; p.x += Math.sin(t * 0.8 + p.ph) * 0.35 + wind * p.vy + p.vx;
      ctx.fillStyle = "rgba(255,255,255," + p.a.toFixed(2) + ")"; circle(ctx, p.x, p.y, p.r);
    } else if (season === "autumn" || season === "spring"){
      p.y += p.vy; p.x += Math.sin(t * 0.9 + p.ph) * 0.8 + wind + p.vx; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.max(0.15, Math.abs(Math.cos(t * 1.5 + p.ph))));
      ctx.fillStyle = mix(p.c, SHADE, dark * 0.45); ell(ctx, 0, 0, p.s, p.s * 0.5);
      ctx.restore();
    } else {
      p.y += p.vy; p.x += Math.sin(t * 0.6 + p.ph) * 0.4 + p.vx;
      if (dark > 0.4){
        var bl = 0.5 + 0.5 * Math.sin(t * 2 + p.ph * 3);
        ctx.fillStyle = "rgba(220,255,140," + (0.16 * bl) + ")"; circle(ctx, p.x, p.y, 7);
        ctx.fillStyle = "rgba(240,255,170," + (0.4 + 0.6 * bl) + ")"; circle(ctx, p.x, p.y, 1.8);
      } else { ctx.fillStyle = "rgba(255,255,240,.65)"; circle(ctx, p.x, p.y, p.r); }
    }
    if (p.y > H + 20 || p.y < -30 || p.x < -30 || p.x > W + 30) particles[j] = newP(false);
  }
  requestAnimationFrame(frame);
}

/* ---------- мышь: свет в окнах, салют ---------- */
function midPoint(e){ return {x:e.clientX + par.x * 18, y:e.clientY + par.y * 6}; }
function hitWin(pt){
  for (var i = SC.wins.length - 1; i >= 0; i--){ var w = SC.wins[i]; if (pt.x >= w.x - 2 && pt.x <= w.x + w.w + 2 && pt.y >= w.y - 2 && pt.y <= w.y + w.h + 2) return w; }
  return null;
}
window.addEventListener("mousemove", function(e){
  mouse.x = e.clientX; mouse.y = e.clientY;
  mouse.nx = e.clientX / W - 0.5; mouse.ny = e.clientY / H - 0.5;
  if (e.target === cv) cv.style.cursor = hitWin(midPoint(e)) ? "pointer" : (e.clientY < GY - 40 ? "crosshair" : "default");
});
document.addEventListener("mouseleave", function(){ mouse.x = mouse.y = -9999; mouse.nx = mouse.ny = 0; });
cv.addEventListener("click", function(e){
  var w = hitWin(midPoint(e));
  if (w){ toggled[w.id] = !toggled[w.id]; drawMid(); return; }
  if (e.clientY < GY - 40) launch(e.clientX, e.clientY);
});

function startScene(){
  var rt;
  window.addEventListener("resize", function(){ clearTimeout(rt); rt = setTimeout(resize, 150); });
  resize();
  setInterval(function(){ if (S.season === "auto" || S.light === "auto"){ var d0 = dark; season = currentSeason(); if (Math.abs(currentDark() - d0) > 0.02 || season !== document.body.dataset.scene) buildScene(); document.body.dataset.scene = season; } }, 60 * 1000);
  document.body.dataset.scene = season;
  requestAnimationFrame(frame);
  var hint = $("hint"); setTimeout(function(){ hint.classList.add("hide"); }, 12000);
}

/* ---------- запуск ---------- */
renderAll();
startFile();
tick();
setInterval(tick, 1000);
startScene();
try { localStorage.setItem(KEY + ".test", "1"); localStorage.removeItem(KEY + ".test"); }
catch(e){ storageOK = false; }
})();
</script>
