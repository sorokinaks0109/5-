<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мой рабочий стол</title>
<style>
:root{
  --panel: rgba(13,19,36,.55);
  --panel-b: rgba(255,255,255,.14);
  --text:#f3f6fb;
  --muted:rgba(243,246,251,.6);
  --accent:#ffd27a;
  --ok:#8fe3b0;
  --danger:#ff9a9a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1530;color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:15px}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block}

.layout{position:fixed;inset:0;display:grid;grid-template-columns:minmax(300px,390px) 1fr minmax(380px,500px);
  gap:24px;padding:28px;pointer-events:none}
.col{display:flex;flex-direction:column;gap:16px;min-height:0}
.col.mid{justify-content:flex-end;align-items:center}
.panel{pointer-events:auto;background:var(--panel);border:1px solid var(--panel-b);border-radius:18px;
  padding:16px 18px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  box-shadow:0 10px 40px rgba(0,0,0,.25)}
h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.count{font-size:13px;color:var(--muted)}

/* часы */
.clock .time{font-size:64px;font-weight:300;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock .time .colon{animation:blink 2s steps(1) infinite}
@keyframes blink{50%{opacity:.35}}
.clock .date{margin-top:6px;font-size:18px;text-transform:capitalize}
.clock .hello{margin-top:10px;font-size:15px;color:var(--muted)}
.clock .hello [contenteditable]{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12)}

/* редактируемые поля */
[contenteditable]{outline:none;border-radius:6px;cursor:text}
[contenteditable]:focus{background:rgba(255,255,255,.08);box-shadow:0 0 0 2px rgba(255,210,122,.35)}
[data-ph]:empty:before{content:attr(data-ph);color:var(--muted);pointer-events:none}

.focus .txt{font-size:20px;line-height:1.35;min-height:28px;padding:2px 4px;display:block}
.notes textarea{width:100%;min-height:120px;resize:vertical;background:transparent;border:0;color:var(--text);
  font:inherit;line-height:1.45;outline:none;padding:2px 4px;border-radius:6px}
.notes textarea:focus{background:rgba(255,255,255,.06)}
.notes textarea::placeholder{color:var(--muted)}
.notes{flex:none}
.notes textarea{min-height:70px;height:90px}

/* задачи */
.tasks{flex:1;display:flex;flex-direction:column;min-height:0}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;padding:5px 10px;border-radius:999px;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--muted);cursor:pointer}
.fchip:hover{color:var(--text)}
.fchip.on{background:rgba(255,255,255,.2);color:var(--text);border-color:rgba(255,255,255,.32)}
.fchip .n{font-variant-numeric:tabular-nums;opacity:.75}
.fchip .n.bad{color:var(--danger);opacity:1;font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c,#999);flex:none}
.add{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.add .row{display:flex;gap:8px}
.add input,.add select{min-width:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--text);
  border-radius:10px;padding:8px 11px;font:inherit;outline:none;color-scheme:dark}
.add input:focus,.add select:focus{border-color:rgba(255,210,122,.6)}
.add input::placeholder{color:var(--muted)}
.add select{flex:1}
.add select option{color:#111;background:#fff}
.add input[type=date]{flex:none;width:148px}
.plus{flex:none;background:var(--accent);color:#1b1f2b;border:0;border-radius:10px;padding:0 14px;font:inherit;font-weight:600;cursor:pointer}
ul{list-style:none;margin:0;padding:0}
.list{overflow:auto;min-height:0;flex:1;margin-right:-8px;padding-right:8px}
.list::-webkit-scrollbar{width:6px}.list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}
.group{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:14px 4px 4px}
.group .gn{font-weight:400;opacity:.8}
.group .link{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400}
.group .link + .link{margin-left:10px}
.group.over{color:var(--danger)}
.group.today{color:#ffbf7a}
.empty{color:var(--muted);padding:16px 4px}
.task{display:flex;align-items:flex-start;gap:10px;padding:7px 6px;border-radius:10px}
.task:hover{background:rgba(255,255,255,.06)}
.task.over{background:rgba(255,110,110,.09);box-shadow:inset 3px 0 0 var(--danger)}
.cb{flex:none;width:20px;height:20px;margin-top:1px;border-radius:6px;border:2px solid rgba(255,255,255,.5);background:transparent;
  cursor:pointer;padding:0;display:grid;place-items:center;color:#14301f;font-size:13px;font-weight:700}
.task.done .cb{background:var(--ok);border-color:var(--ok)}
.task .body{flex:1;min-width:0}
.task .tx{display:block;line-height:1.4;word-break:break-word;padding:0 2px}
.task.done .tx{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
.ptag{appearance:none;-webkit-appearance:none;font:inherit;font-size:12px;color:var(--muted);background:rgba(255,255,255,.07);border:0;
  border-left:3px solid var(--c,transparent);border-radius:6px;padding:2px 8px;cursor:pointer;max-width:180px;outline:none}
.ptag:hover{color:var(--text)}
.ptag option{color:#111;background:#fff}
.due{font:inherit;font-size:12px;border:0;border-radius:6px;padding:2px 8px;cursor:pointer;background:rgba(255,255,255,.07);color:var(--muted);white-space:nowrap}
.due:hover{filter:brightness(1.25)}
.due.over{background:rgba(255,110,110,.28);color:#ffd0d0;font-weight:600}
.due.today{background:rgba(255,160,80,.3);color:#ffdcb8;font-weight:600}
.due.soon{background:rgba(255,215,110,.18);color:#ffe9b0}
.due.none{opacity:0}
.task:hover .due.none,.proj:hover .due.none{opacity:1}
.dateinp{font:inherit;font-size:12px;background:rgba(255,255,255,.12);color:var(--text);border:1px solid rgba(255,210,122,.6);
  border-radius:6px;padding:1px 6px;color-scheme:dark;outline:none}
.ic{flex:none;background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;border-radius:6px;opacity:0}
.task:hover .ic,.proj:hover .ic,.ic.on{opacity:1}
.ic:hover{color:var(--text);background:rgba(255,255,255,.08)}
.ic.st.on{color:var(--accent)}
.task.star:not(.done) .tx{font-weight:600}
.foot{margin-top:8px;font-size:12.5px;color:var(--muted)}
.link{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;padding:0;text-decoration:underline dotted}
.link:hover{color:var(--text)}

/* проекты */
.projects{flex:1;display:flex;flex-direction:column;min-height:0}
.proj{padding:9px 8px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.proj:hover{background:rgba(255,255,255,.06)}
.proj.on{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.2)}
.prow{display:flex;align-items:center;gap:8px}
.pname{flex:1;min-width:0;font-weight:600;padding:0 2px;word-break:break-word}
.pmeta{display:flex;gap:10px;font-size:12.5px;color:var(--muted);margin-top:4px;padding-left:17px}
.pmeta .bad{color:var(--danger);font-weight:600}
.pmeta .pct{margin-left:auto;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:99px;background:rgba(255,255,255,.12);margin:6px 0 0 17px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--c)}
.chip.bad{background:rgba(255,110,110,.28);border-color:rgba(255,110,110,.45)}

/* панель снизу */
.toolbar{pointer-events:auto;display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;flex-wrap:wrap;justify-content:center}
.toolbar button{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.toolbar button:hover{color:var(--text);background:rgba(255,255,255,.08)}
.toolbar button.on{color:#1b1f2b;background:var(--accent)}
.sep{width:1px;height:18px;background:rgba(255,255,255,.18);margin:0 4px}

.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%) translateY(-20px);opacity:0;transition:.3s;
  background:rgba(13,19,36,.85);border:1px solid var(--panel-b);padding:10px 16px;border-radius:12px;font-size:14px;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:1050px){
  html,body{overflow:auto}
  .layout{position:relative;grid-template-columns:1fr;padding:16px;gap:16px}
  .projects{max-height:none}
  .tasks .list{max-height:60vh}
}
@media (prefers-reduced-motion:reduce){.clock .time .colon{animation:none}}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="layout">
  <div class="col">
    <section class="panel clock">
      <div class="time" id="time">--<span class="colon">:</span>--</div>
      <div class="date" id="date"></div>
      <div class="hello"><span id="greet">Добрый день</span>, <span id="name" contenteditable="true" spellcheck="false"></span></div>
      <div class="chips" id="chips"></div>
    </section>
    <section class="panel focus">
      <div class="head"><h2>Главное на сегодня</h2></div>
      <span class="txt" id="focus" contenteditable="true" data-ph="Одна вещь, после которой день прожит не зря…"></span>
    </section>
    <section class="panel projects">
      <div class="head"><h2>Проекты</h2><span class="count">клик — задачи проекта</span></div>
      <ul class="list" id="projList"></ul>
      <form class="add" id="projForm" autocomplete="off" style="margin:10px 0 0">
        <input id="projInput" placeholder="Новый проект и Enter">
      </form>
      <div class="foot">Двойной клик по названию — переименовать</div>
    </section>
    <section class="panel notes">
      <div class="head"><h2>Заметки</h2></div>
      <textarea id="notes" placeholder="Мысли, идеи для блога, кому перезвонить…" spellcheck="true"></textarea>
    </section>
  </div>

  <div class="col mid">
    <div class="panel toolbar" id="toolbar">
      <button data-season="auto" title="Сезон по календарю">Авто</button>
      <button data-season="winter" title="Зима">❄ Зима</button>
      <button data-season="spring" title="Весна">✿ Весна</button>
      <button data-season="summer" title="Лето">☀ Лето</button>
      <button data-season="autumn" title="Осень">🍂 Осень</button>
      <span class="sep"></span>
      <button data-light="auto" title="Небо по реальному времени">По часам</button>
      <button data-light="day">День</button>
      <button data-light="night">Вечер</button>
      <span class="sep"></span>
      <button id="exp" title="Сохранить резервную копию задач в файл">Сохранить копию</button>
      <button id="imp" title="Загрузить задачи из файла">Загрузить</button>
      <button id="fs" title="Во весь экран (F11)">⛶</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
  </div>

  <div class="col">
    <section class="panel tasks">
      <div class="head"><h2>Задачи</h2><span class="count" id="tcount"></span></div>
      <div class="filters" id="filters"></div>
      <form class="add" id="taskForm" autocomplete="off">
        <input id="taskInput" placeholder="Что сделать?">
        <div class="row">
          <select id="taskProj" title="Проект"></select>
          <input type="date" id="taskDue" title="Срок">
          <button class="plus" type="submit">Добавить</button>
        </div>
      </form>
      <ul class="list" id="taskList"></ul>
      <div class="foot">Сверху — самое срочное. ★ — важное в своей группе. Текст, проект и срок меняются прямо в списке.</div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
/* ---------- данные ---------- */
var KEY = "rabochiy-stol.v1";
function uid(){ return Math.random().toString(36).slice(2,10); }
var COLORS = ["#ffd27a","#8fd3ff","#c3a6ff","#8fe3b0","#ff9fb2","#ffb36b","#7fe0d6","#e7e7a0"];

/* даты */
function ymd(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function addDays(n){ var d = new Date(); d.setDate(d.getDate() + n); return ymd(d); }
function parseD(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function daysLeft(s){ if (!s) return null; var t = new Date(); t.setHours(0,0,0,0); return Math.round((parseD(s) - t) / 864e5); }
var MON = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"], WD = ["вс","пн","вт","ср","чт","пт","сб"];
function shortD(s){ var d = parseD(s); return d.getDate() + " " + MON[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? " " + d.getFullYear() : ""); }
function dueText(s){
  var n = daysLeft(s); if (n === null) return "+ срок";
  if (n < 0) return "просрочено · " + shortD(s);
  if (n === 0) return "сегодня";
  if (n === 1) return "завтра";
  if (n < 7) return WD[parseD(s).getDay()] + ", " + shortD(s);
  return shortD(s);
}
function dueClass(s){ var n = daysLeft(s); if (n === null) return "none"; if (n < 0) return "over"; if (n === 0) return "today"; if (n <= 3) return "soon"; return "later"; }

function norm(t){ return {id:t.id || uid(), text:String(t.text || ""), done:!!t.done, star:!!t.star, pid:t.pid || null,
  due:t.due || null, created:t.created || Date.now(), doneAt:t.doneAt || null}; }
function defaults(){
  var a = uid(), b = uid(), c = uid(), d = uid(), now = Date.now();
  return {
    name: "Ксения", focus: "", notes: "", season: "auto", light: "auto", filter: "all", showDone: false,
    projects: [
      {id:a, name:"Развитие ИСМ", color:COLORS[0], due:addDays(37)},
      {id:b, name:"Тренинги", color:COLORS[1], due:null},
      {id:c, name:"Аспирантура", color:COLORS[2], due:addDays(90)},
      {id:d, name:"Блог", color:COLORS[3], due:null}
    ],
    tasks: [
      {text:"Отправить отчёт по несоответствиям", pid:a, due:addDays(-1), star:true},
      {text:"Подготовить материалы к тренингу по 5S", pid:b, due:addDays(0), star:true},
      {text:"Согласовать график внутренних аудитов", pid:a, due:addDays(2)},
      {text:"Узнать требования к вступительным экзаменам", pid:c, due:addDays(6)},
      {text:"Собрать обратную связь после тренинга", pid:b, due:addDays(12)},
      {text:"Записать 10 тем для первых постов", pid:d, due:null},
      {text:"Это пример выполненной задачи", pid:a, done:true, doneAt:now}
    ].map(function(t, i){ t.created = now + i; return norm(t); })
  };
}
function migrate(d){
  d.projects = (Array.isArray(d.projects) ? d.projects : []).map(function(p, i){
    return {id:p.id || uid(), name:p.name || "Проект", color:p.color || COLORS[i % COLORS.length], due:p.due || null}; });
  var ids = d.projects.map(function(p){ return p.id; });
  d.tasks = (Array.isArray(d.tasks) ? d.tasks : []).map(norm);
  d.tasks.forEach(function(t){ if (t.pid && ids.indexOf(t.pid) < 0) t.pid = null; });
  if (d.filter !== "all" && d.filter !== "none" && ids.indexOf(d.filter) < 0) d.filter = "all";
  return d;
}
function fromData(d){
  var base = defaults();
  if (d && typeof d === "object") for (var k in base) if (d[k] !== undefined) base[k] = d[k];
  return migrate(base);
}
var storageOK = true;
function load(){
  var d = null;
  try { d = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e){ storageOK = false; }
  return fromData(d);
}
var S = load();
var saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){ if (storageOK) toast("Браузер не даёт сохранять. Делайте «Сохранить копию» перед закрытием."); storageOK = false; }
  }, 250);
}

function $(id){ return document.getElementById(id); }
function el(tag, cls, txt){ var n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; }
var toastT;
function toast(msg){ var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("show"); }, 3500); }

/* редактируемый текст: Enter — готово, Esc — отмена */
function editable(node, value, onSave, onEmpty){
  node.contentEditable = "true";
  node.spellcheck = true;
  node.textContent = value || "";
  var before = value || "";
  node.addEventListener("focus", function(){ before = node.textContent; });
  node.addEventListener("keydown", function(e){
    if (e.key === "Enter"){ e.preventDefault(); node.blur(); }
    if (e.key === "Escape"){ node.textContent = before; node.blur(); }
  });
  node.addEventListener("input", function(){ onSave(node.textContent.trim()); });
  node.addEventListener("blur", function(){
    var v = node.textContent.trim();
    if (!v && onEmpty) onEmpty(); else { node.textContent = v; onSave(v); }
  });
  node.addEventListener("paste", function(e){
    e.preventDefault();
    var t = (e.clipboardData || window.clipboardData).getData("text").replace(/\s+/g," ");
    document.execCommand("insertText", false, t);
  });
}

/* ---------- задачи: ранжирование ---------- */
var GROUPS = [["over","Просрочено"],["today","Сегодня"],["tomorrow","Завтра"],["week","Ближайшие 7 дней"],["later","Позже"],["nodate","Без срока"],["done","Выполнено"]];
function bucket(t){
  if (t.done) return 6;
  var n = daysLeft(t.due);
  if (n === null) return 5; if (n < 0) return 0; if (n === 0) return 1; if (n === 1) return 2; if (n <= 7) return 3; return 4;
}
function rank(a, b){
  var ba = bucket(a), bb = bucket(b);
  if (ba !== bb) return ba - bb;
  if (ba === 6) return (b.doneAt || 0) - (a.doneAt || 0);
  if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
  if (a.star !== b.star) return b.star - a.star;
  return a.created - b.created;
}
function proj(id){ for (var i = 0; i < S.projects.length; i++) if (S.projects[i].id === id) return S.projects[i]; return null; }
function inFilter(t, f){ return f === "all" || (f === "none" ? !t.pid : t.pid === f); }
function isOver(t){ var n = daysLeft(t.due); return !t.done && n !== null && n < 0; }

/* кнопка срока: клик — выбор даты */
function dueBtn(val, onSet, title){
  var b = el("button", "due " + dueClass(val), dueText(val)); b.type = "button"; b.title = title || "Срок";
  b.onclick = function(e){
    e.stopPropagation();
    var inp = document.createElement("input"); inp.type = "date"; inp.className = "dateinp"; inp.value = val || "";
    b.replaceWith(inp); inp.focus();
    try { inp.showPicker(); } catch(_){}
    var fin = false;
    function done(){ if (fin) return; fin = true; onSet(inp.value || null); }
    inp.onchange = function(){ if (!inp.value || +inp.value.slice(0,4) >= 2000) done(); };
    inp.onblur = done;
    inp.onkeydown = function(ev){ if (ev.key === "Enter"){ ev.preventDefault(); done(); } if (ev.key === "Escape"){ fin = true; inp.replaceWith(b); } };
    inp.onclick = function(ev){ ev.stopPropagation(); };
  };
  return b;
}
function projOptions(sel, value){
  sel.innerHTML = "";
  var o = el("option", null, "Без проекта"); o.value = ""; sel.appendChild(o);
  S.projects.forEach(function(p){ var x = el("option", null, p.name); x.value = p.id; sel.appendChild(x); });
  sel.value = value && proj(value) ? value : "";
}

function renderFilters(){
  var box = $("filters"); box.innerHTML = "";
  var opts = [{id:"all", name:"Все"}].concat(S.projects).concat([{id:"none", name:"Без проекта"}]);
  opts.forEach(function(o){
    var open = S.tasks.filter(function(t){ return !t.done && inFilter(t, o.id); });
    if (o.id === "none" && !open.length && S.filter !== "none") return;
    var over = open.filter(isOver).length;
    var b = el("button", "fchip" + (S.filter === o.id ? " on" : "")); b.type = "button";

function projStats(p){
  var ts = S.tasks.filter(function(t){ return t.pid === p.id; });
  var open = ts.filter(function(t){ return !t.done; });
  var dates = open.filter(function(t){ return t.due; }).map(function(t){ return t.due; }).sort();
  return {total:ts.length, done:ts.length - open.length, open:open.length, over:open.filter(isOver).length, next:dates[0] || null};
}
function cmpDate(a, b){ if (a === b) return 0; if (!a) return 1; if (!b) return -1; return a < b ? -1 : 1; }
function renderProjects(){
  var list = $("projList"); list.innerHTML = "";

/* ---------- часы ---------- */
function isoWeek(d){
  var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}
function plural(n, a, b, c){ var m = n % 100, k = n % 10; if (m > 10 && m < 20) return c; if (k === 1) return a; if (k > 1 && k < 5) return b; return c; }
function tick(){
  var d = new Date(), h = d.getHours(), m = d.getMinutes();
  $("time").innerHTML = String(h).padStart(2,"0") + '<span class="colon">:</span>' + String(m).padStart(2,"0");
  $("date").textContent = d.toLocaleDateString("ru-RU", {weekday:"long", day:"numeric", month:"long"});
  $("greet").textContent = h < 5 ? "Доброй ночи" : h < 12 ? "Доброе утро" : h < 18 ? "Добрый день" : "Добрый вечер";
  var chips = [isoWeek(d) + "-я неделя"];
  var qEnd = new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3 + 3, 1);
  var qd = Math.ceil((qEnd - d) / 864e5);
  chips.push("до конца квартала " + qd + " " + plural(qd, "день", "дня", "дней"));
  if (d.getMonth() >= 10){
    var ny = Math.ceil((new Date(d.getFullYear() + 1, 0, 1) - d) / 864e5);
    chips.push("🎄 до Нового года " + ny + " " + plural(ny, "день", "дня", "дней"));
  }
  var over = S.tasks.filter(isOver).length;
  var today = S.tasks.filter(function(t){ return !t.done && daysLeft(t.due) === 0; }).length;
  var box = $("chips"); box.innerHTML = "";
  if (over){ var o = el("span", "chip bad", "⚠ просрочено: " + over); box.appendChild(o); }
  if (today) box.appendChild(el("span", "chip", "на сегодня: " + today));
  chips.forEach(function(c){ box.appendChild(el("span", "chip", c)); });
  // в полночь пересчитать сроки
  var dayKey = ymd(d);
  if (tick.day && tick.day !== dayKey){ renderTasks(); renderProjects(); }
  tick.day = dayKey;
}

/* =====================================================
   СЦЕНА: домики, небо, погода
   ===================================================== */
var cv = $("scene"), ctx = cv.getContext("2d");
var bg = document.createElement("canvas"), bx = bg.getContext("2d");
var W = 0, H = 0, DPR = 1, groundY = 0;
var season = "winter", dark = 0;
var chimneys = [], garland = [], particles = [], smoke = [];
var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hx(c){ c = c.replace("#",""); return [parseInt(c.substr(0,2),16), parseInt(c.substr(2,2),16), parseInt(c.substr(4,2),16)]; }
function mix(a, b, t){
  var A = hx(a), B = hx(b);
  return "#" + A.map(function(v,i){ var x = Math.round(v + (B[i] - v) * t); return ("0" + x.toString(16)).slice(-2); }).join("");
}
function rgba(c, a){ var A = hx(c); return "rgba(" + A[0] + "," + A[1] + "," + A[2] + "," + a + ")"; }

function currentSeason(){
  if (S.season !== "auto") return S.season;
  var m = new Date().getMonth();
  if (m === 10 || m === 11 || m <= 1) return "winter";   // ноябрь у нас уже зима
  if (m <= 4) return "spring";
  if (m <= 7) return "summer";
  return "autumn";
}
var SUN = {winter:[9,16.3], spring:[6,20], summer:[4.5,21.5], autumn:[7.5,18]};
function currentDark(){
  if (S.light === "day") return 0;
  if (S.light === "night") return 1;
  var d = new Date(), h = d.getHours() + d.getMinutes() / 60, s = SUN[season];
  if (h < s[0] - 1 || h > s[1] + 1) return 1;
  if (h < s[0] + 0.5) return Math.max(0, Math.min(1, (s[0] + 0.5 - h) / 1.5));
  if (h > s[1] - 0.5) return Math.max(0, Math.min(1, (h - s[1] + 0.5) / 1.5));
  return 0;
}

var PAL = {
  winter:{skyT:"#6f97c4", skyB:"#dbe6f1", hill1:"#c6d4e4", hill2:"#e3ebf4", ground:"#f1f5fa", nightGround:"#a7b6d2", trees:"#2f5a4a"},
  spring:{skyT:"#5fa9e6", skyB:"#e2f2ff", hill1:"#8dbb76", hill2:"#a9cf86", ground:"#7fb661", nightGround:"#2f4a37", trees:"#f3b6c8"},
  summer:{skyT:"#3b92e3", skyB:"#c3e6ff", hill1:"#5f9a4c", hill2:"#79b35c", ground:"#64a045", nightGround:"#24402a", trees:"#3f7f39"},
  autumn:{skyT:"#6b98c9", skyB:"#f1d8b0", hill1:"#a7834e", hill2:"#c39a5a", ground:"#9a7340", nightGround:"#3a2e22", trees:"#e08a2e"}
};
var NIGHT_T = "#0a1230", NIGHT_B = "#26335e", DUSK = "#f2a578", SHADE = "#121a30";

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = bg.width = Math.round(W * DPR); cv.height = bg.height = Math.round(H * DPR);
  buildScene();
}

function buildScene(){
  season = currentSeason(); dark = currentDark();
  document.body.dataset.season = season;
  var P = PAL[season], R = rng(7);
  groundY = Math.round(H * 0.8);
  var x = bx; x.setTransform(DPR,0,0,DPR,0,0);

  // небо
  var bell = Math.sin(Math.PI * dark);
  var g = x.createLinearGradient(0, 0, 0, groundY);
  g.addColorStop(0, mix(P.skyT, NIGHT_T, dark));
  g.addColorStop(1, mix(mix(P.skyB, DUSK, bell * 0.7), NIGHT_B, dark));
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  // звёзды
  if (dark > 0.4){
    var sr = rng(3);
    for (var i = 0; i < W * H / 4500; i++){
      x.fillStyle = "rgba(255,255,255," + ((dark - 0.4) * (0.4 + sr() * 0.6)).toFixed(2) + ")";
      x.fillRect(sr() * W, sr() * groundY * 0.85, sr() < 0.1 ? 2 : 1, sr() < 0.1 ? 2 : 1);
    }
  }
  // луна или солнце
  var cx = W * 0.62, cy = H * 0.17;
  if (dark > 0.5){
    var gl = x.createRadialGradient(cx, cy, 10, cx, cy, 120);
    gl.addColorStop(0, "rgba(255,248,220,.35)"); gl.addColorStop(1, "rgba(255,248,220,0)");
    x.fillStyle = gl; x.fillRect(cx - 120, cy - 120, 240, 240);
    x.fillStyle = "#fbf3d5"; x.beginPath(); x.arc(cx, cy, 30, 0, 7); x.fill();
    x.fillStyle = mix(P.skyT, NIGHT_T, dark); x.beginPath(); x.arc(cx + 12, cy - 8, 27, 0, 7); x.fill();
  } else {
    var sy = H * (0.14 + dark * 0.4);
    var sg = x.createRadialGradient(cx, sy, 8, cx, sy, 140);
    sg.addColorStop(0, "rgba(255,244,200,.9)"); sg.addColorStop(0.25, "rgba(255,230,160,.35)"); sg.addColorStop(1, "rgba(255,230,160,0)");
    x.fillStyle = sg; x.fillRect(cx - 140, sy - 140, 280, 280);
    x.fillStyle = "#fff6d6"; x.beginPath(); x.arc(cx, sy, 26, 0, 7); x.fill();
  }

  // холмы
  hill(x, mix(P.hill2, SHADE, dark * 0.75), groundY - H * 0.16, 0.0021, 40, 1.3);
  hill(x, mix(P.hill1, SHADE, dark * 0.65), groundY - H * 0.09, 0.0034, 26, 4.1);

  // дальние деревья
  var trees = [];
  for (var tx = -20; tx < W + 20; tx += 26 + R() * 60) trees.push({x:tx, h:50 + R() * 70});
  trees.forEach(function(t){ drawTree(x, t.x, groundY - 4, t.h, R, 0.75); });

  // домики
  chimneys = []; garland = [];
  var hx0 = -30 + R() * 30;
  while (hx0 < W + 40){
    var w = 90 + R() * 80, h = 60 + R() * 70, base = groundY + 4 + R() * 10;
    drawHouse(x, hx0, base, w, h, R);
    if (R() < 0.45){ // дерево между домами
      drawTree(x, hx0 + w + 18, base + 6, 70 + R() * 50, R, 1);
      hx0 += w + 44 + R() * 40;
    } else hx0 += w + 14 + R() * 40;
  }

  // земля
  var gg = x.createLinearGradient(0, groundY, 0, H);
  var gc = mix(P.ground, P.nightGround, dark);
  gg.addColorStop(0, gc); gg.addColorStop(1, mix(gc, SHADE, 0.25));
  x.fillStyle = gg;
  x.beginPath(); x.moveTo(0, H);
  for (var gx = 0; gx <= W + 20; gx += 20) x.lineTo(gx, groundY + 20 + Math.sin(gx * 0.013) * 5 + Math.sin(gx * 0.041) * 3);
  x.lineTo(W, H); x.closePath(); x.fill();

  // частицы
  makeParticles();
  smoke = [];
}

function hill(x, color, y, f, amp, ph){
  x.fillStyle = color; x.beginPath(); x.moveTo(0, groundY + 30);
  for (var i = 0; i <= W + 20; i += 16) x.lineTo(i, y + Math.sin(i * f + ph) * amp + Math.sin(i * f * 2.7 + ph) * amp * 0.35);
  x.lineTo(W, groundY + 30); x.closePath(); x.fill();
}

function drawTree(x, tx, base, h, R, scale){
  var P = PAL[season];
  x.save();
  x.globalAlpha = scale < 1 ? 0.85 : 1;
  var trunk = mix("#5a3d2b", SHADE, dark * 0.6);
  if (season === "winter" || (season !== "spring" && R() < 0.35)){
    // ёлка
    var col = mix(season === "winter" ? "#2f5a4a" : "#2e5a38", SHADE, dark * 0.6);
    x.fillStyle = trunk; x.fillRect(tx - 3, base - h * 0.15, 6, h * 0.15);
    for (var i = 0; i < 3; i++){
      var ty = base - h * 0.12 - i * h * 0.26, tw = h * (0.38 - i * 0.09);
      x.fillStyle = col; x.beginPath(); x.moveTo(tx - tw, ty); x.lineTo(tx, ty - h * 0.42); x.lineTo(tx + tw, ty); x.closePath(); x.fill();
      if (season === "winter"){
        x.fillStyle = mix("#ffffff", "#9fb0d0", dark * 0.7);
        x.beginPath(); x.moveTo(tx - tw * 0.85, ty - 2); x.quadraticCurveTo(tx - tw * 0.4, ty - 9, tx, ty - h * 0.42 + 4);
        x.quadraticCurveTo(tx + tw * 0.2, ty - 12, tx + tw * 0.5, ty - 4); x.closePath(); x.fill();
      }
    }
  } else {
    // лиственное дерево
    x.strokeStyle = trunk; x.lineWidth = 5; x.beginPath(); x.moveTo(tx, base); x.lineTo(tx, base - h * 0.55); x.stroke();
    var base2 = season === "autumn" ? ["#e08a2e","#d0582a","#e9b23c"] : season === "spring" ? ["#f3b6c8","#f7cfdc","#e79ab3"] : ["#3f7f39","#4f9442","#5ea54d"];
    for (var k = 0; k < 6; k++){
      x.fillStyle = mix(base2[k % 3], SHADE, dark * 0.6);
      x.beginPath(); x.arc(tx + (R() - 0.5) * h * 0.45, base - h * 0.62 + (R() - 0.5) * h * 0.3, h * (0.16 + R() * 0.1), 0, 7); x.fill();
    }
  }
  x.restore();
}

var WALLS = ["#b5523b","#d8a657","#6f8fa8","#8a6f9e","#c9785a","#5f8a6a","#d9c7a6","#a4644a"];
var ROOFS = ["#4d2a26","#3a4456","#6b3b2f","#2f3d4f","#5b4636"];
var GAR = ["#ff5d5d","#ffd34d","#6ee0ff","#8cff8c","#ff8ae0"];

function drawHouse(x, hx0, base, w, h, R){
  var wall = mix(WALLS[Math.floor(R() * WALLS.length)], SHADE, dark * 0.55);
  var roof = mix(ROOFS[Math.floor(R() * ROOFS.length)], SHADE, dark * 0.4);
  var rh = 34 + R() * 30, top = base - h, ov = 10;
  // труба
  var hasCh = R() < 0.75, chx = hx0 + w * (R() < 0.5 ? 0.22 : 0.7), chw = 14;
  var roofAt = function(px){ var mid = hx0 + w / 2; return top - rh * (1 - Math.abs(px - mid) / (w / 2 + ov)); };
  if (hasCh){
    var cTop = roofAt(chx + chw / 2) - 22;
    x.fillStyle = mix("#7a4a3a", SHADE, dark * 0.5); x.fillRect(chx, cTop, chw, roofAt(chx + chw / 2) - cTop + 6);
    if (season === "winter"){ x.fillStyle = mix("#ffffff", "#a9b8d6", dark * 0.7); roundRect(x, chx - 2, cTop - 4, chw + 4, 6, 3); }
    chimneys.push({x: chx + chw / 2, y: cTop - 2});
  }
  // стены
  x.fillStyle = wall; x.fillRect(hx0, top, w, h);
  x.fillStyle = "rgba(0,0,0,.12)"; x.fillRect(hx0 + w * 0.72, top, w * 0.28, h);
  // крыша
  x.fillStyle = roof; x.beginPath(); x.moveTo(hx0 - ov, top + 2); x.lineTo(hx0 + w / 2, top - rh); x.lineTo(hx0 + w + ov, top + 2); x.closePath(); x.fill();
  if (season === "winter"){
    x.fillStyle = mix("#ffffff", "#a9b8d6", dark * 0.7);
    x.beginPath(); x.moveTo(hx0 - ov - 3, top + 4); x.lineTo(hx0 + w / 2, top - rh - 5); x.lineTo(hx0 + w + ov + 3, top + 4);
    x.lineTo(hx0 + w + ov - 6, top + 1);
    for (var s = 1; s <= 6; s++){ var px = hx0 + w + ov - (w + 2 * ov) * s / 7; x.quadraticCurveTo(px + 6, roofAt(px) + 14, px, roofAt(px) + 7); }
    x.lineTo(hx0 + w / 2, top - rh + 6); x.lineTo(hx0 - ov + 6, top + 1); x.closePath(); x.fill();
    // гирлянда по краю крыши
    var steps = Math.floor((w + 2 * ov) / 13);
    for (var gi = 0; gi <= steps; gi++){
      var gx = hx0 - ov + (w + 2 * ov) * gi / steps;
      garland.push({x: gx, y: roofAt(gx) + 9 + Math.sin(gi * 1.3) * 1.5, c: GAR[gi % GAR.length], p: R() * 6.28});
    }
  }
  // окна
  var cols = w > 130 ? 3 : 2, rows = h > 100 ? 2 : 1;
  var ww = 17, wh = 20, gapX = (w - cols * ww) / (cols + 1), gapY = (h - 34 - rows * wh) / (rows + 1);
  for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++){
    var wx = hx0 + gapX + c * (ww + gapX), wy = top + gapY + r * (wh + gapY);
    if (rows === 1 && c === Math.floor(cols / 2) && cols === 3) continue; // место для двери
    var lit = R() < 0.78;
    if (dark > 0.3 && lit){
      var gl = x.createRadialGradient(wx + ww / 2, wy + wh / 2, 2, wx + ww / 2, wy + wh / 2, 40);
      gl.addColorStop(0, "rgba(255,205,120," + (0.35 * dark) + ")"); gl.addColorStop(1, "rgba(255,205,120,0)");
      x.fillStyle = gl; x.fillRect(wx - 40, wy - 40, ww + 80, wh + 80);
      x.fillStyle = mix("#bcd3e6", "#ffd98a", Math.min(1, dark * 1.3));
    } else x.fillStyle = mix("#bcd3e6", "#2a3450", dark);
    x.fillRect(wx, wy, ww, wh);
    x.fillStyle = mix("#f4eee4", SHADE, dark * 0.5);
    x.fillRect(wx + ww / 2 - 1, wy, 2, wh); x.fillRect(wx, wy + wh / 2 - 1, ww, 2);
    x.fillRect(wx - 2, wy + wh, ww + 4, 3);
    if (season === "winter"){ x.fillStyle = mix("#ffffff", "#a9b8d6", dark * 0.7); roundRect(x, wx - 3, wy + wh, ww + 6, 4, 2); }
  }
  // дверь
  var dw = 18, dh = 30, dx = hx0 + w / 2 - dw / 2;
  x.fillStyle = mix("#4a2f22", SHADE, dark * 0.4); roundRect(x, dx, base - dh, dw, dh, 3);
  x.fillStyle = "#e6c36a"; x.beginPath(); x.arc(dx + dw - 5, base - dh / 2, 1.6, 0, 7); x.fill();
}
function roundRect(x, a, b, w, h, r){ x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); x.fill(); }

/* ---------- погода ---------- */
function makeParticles(){
  particles = [];
  var n = season === "winter" ? Math.round(W * H / 6500) : season === "summer" ? 45 : 55;
  if (reduced) n = Math.round(n / 4);
  for (var i = 0; i < n; i++) particles.push(newP(true));
}
function newP(anyY){
  var p = {x: Math.random() * W, y: anyY ? Math.random() * H : -20, ph: Math.random() * 6.28};
  if (season === "winter"){ var z = Math.random(); p.r = 0.8 + z * 2.6; p.vy = 0.3 + z * 1.1; p.a = 0.45 + z * 0.5; }
  else if (season === "autumn"){ p.s = 5 + Math.random() * 5; p.vy = 0.5 + Math.random() * 0.8; p.rot = Math.random() * 6.28; p.vr = (Math.random() - 0.5) * 0.06;
    p.c = ["#e0782a","#d0482a","#e9b23c","#b8562a"][Math.floor(Math.random() * 4)]; }
  else if (season === "spring"){ p.s = 3 + Math.random() * 3; p.vy = 0.35 + Math.random() * 0.5; p.rot = Math.random() * 6.28; p.vr = (Math.random() - 0.5) * 0.05;
    p.c = ["#f7c6d6","#ffffff","#f2a7c0"][Math.floor(Math.random() * 3)]; }
  else { p.y = anyY ? Math.random() * H : H + 10; p.r = 1 + Math.random() * 2; p.vy = -(0.1 + Math.random() * 0.3); }
  return p;
}

var t0 = performance.now();
function frame(now){
  var t = (now - t0) / 1000;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(bg, 0, 0);
  ctx.setTransform(DPR,0,0,DPR,0,0);

  // дым из труб
  if ((season === "winter" || season === "autumn") && !reduced){
    if (Math.random() < 0.25 && chimneys.length){
      var ch = chimneys[Math.floor(Math.random() * chimneys.length)];
      smoke.push({x: ch.x, y: ch.y, r: 4, a: 0.35, vx: 0.15 + Math.random() * 0.2, vy: -0.45 - Math.random() * 0.3});
    }
    var sc = dark > 0.5 ? "200,210,235" : "245,247,250";
    for (var i = smoke.length - 1; i >= 0; i--){
      var s = smoke[i]; s.x += s.vx; s.y += s.vy; s.r += 0.12; s.a -= 0.0025;
      if (s.a <= 0){ smoke.splice(i, 1); continue; }
      ctx.fillStyle = "rgba(" + sc + "," + s.a.toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
    }
  }

  // гирлянды
  if (garland.length){
    for (var g = 0; g < garland.length; g++){
      var b = garland[g], tw = 0.55 + 0.45 * Math.sin(t * 2.2 + b.p);
      if (reduced) tw = 1;
      var a = (0.45 + dark * 0.55) * tw;
      if (dark > 0.3){ ctx.fillStyle = rgba(b.c, a * 0.25); ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, 7); ctx.fill(); }
      ctx.fillStyle = rgba(b.c, Math.max(0.35, a)); ctx.beginPath(); ctx.arc(b.x, b.y, 2.1, 0, 7); ctx.fill();
    }
  }

  // осадки
  var wind = Math.sin(t * 0.15) * 0.4;
  for (var j = 0; j < particles.length; j++){
    var p = particles[j];
    if (season === "winter"){
      p.y += p.vy; p.x += Math.sin(t * 0.8 + p.ph) * 0.35 + wind * p.vy;
      ctx.fillStyle = "rgba(255,255,255," + p.a.toFixed(2) + ")";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    } else if (season === "autumn" || season === "spring"){
      p.y += p.vy; p.x += Math.sin(t * 0.9 + p.ph) * 0.8 + wind; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(t * 1.5 + p.ph) * 0.6 + 0.4 * Math.sign(Math.cos(t * 1.5 + p.ph) || 1));
      ctx.fillStyle = mix(p.c, SHADE, dark * 0.45);
      ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.5, 0, 0, 7); ctx.fill();
      ctx.restore();
    } else {
      p.y += p.vy; p.x += Math.sin(t * 0.6 + p.ph) * 0.4;
      if (dark > 0.4){
        var bl = 0.5 + 0.5 * Math.sin(t * 2 + p.ph * 3);
        ctx.fillStyle = "rgba(220,255,140," + (0.15 * bl) + ")"; ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, 7); ctx.fill();
        ctx.fillStyle = "rgba(240,255,170," + (0.4 + 0.6 * bl) + ")"; ctx.beginPath(); ctx.arc(p.x, p.y, 1.8, 0, 7); ctx.fill();
      } else {
        ctx.fillStyle = "rgba(255,255,240,.6)"; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
      }
    }
    if (p.y > H + 20 || p.y < -30 || p.x < -30 || p.x > W + 30) particles[j] = newP(false);
  }
  requestAnimationFrame(frame);
}

/* ---------- запуск ---------- */
renderAll();
tick();
setInterval(tick, 1000);
var rt; window.addEventListener("resize", function(){ clearTimeout(rt); rt = setTimeout(resize, 150); });
resize();
// раз в 5 минут пересчитываем небо (день → вечер), если включён режим «по часам»
setInterval(function(){ if (S.season === "auto" || S.light === "auto") buildScene(); }, 5 * 60 * 1000);
requestAnimationFrame(frame);
try { localStorage.setItem(KEY + ".test", "1"); localStorage.removeItem(KEY + ".test"); }
catch(e){ storageOK = false; toast("Браузер не даёт сохранять. Перед закрытием жмите «Сохранить копию»."); }
})();
</script>
