<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр «Великая степь»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kelly+Slab&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one narrow column, tab bar on top; each tab is a self-contained exercise. Palette: steppe sky (blue felt) + dry grass gold. */
:root{
  --bg:#f3f6f9; --surface:#ffffff; --surface2:#e8eef4;
  --fg:#17222e; --muted:#5a6878; --line:#d3dce6;
  --sky:#1f5f99; --sky-soft:#dbe8f4; --grass:#b8860b; --grass-soft:#f6ecd2;
  --ok:#2e7d4f; --ok-soft:#dcf0e3; --bad:#b23a3a; --bad-soft:#f7e0e0;
  --display:"Kelly Slab", "Georgia", serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1720; --surface:#17222e; --surface2:#1f2d3b;
  --fg:#e7edf3; --muted:#9aa9b9; --line:#2c3b4b;
  --sky:#79b4ea; --sky-soft:#1c3550; --grass:#e2b44a; --grass-soft:#3a3016;
  --ok:#6fcf97; --ok-soft:#173a27; --bad:#f08a8a; --bad-soft:#3f1d1d;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1720; --surface:#17222e; --surface2:#1f2d3b;
  --fg:#e7edf3; --muted:#9aa9b9; --line:#2c3b4b;
  --sky:#79b4ea; --sky-soft:#1c3550; --grass:#e2b44a; --grass-soft:#3a3016;
  --ok:#6fcf97; --ok-soft:#173a27; --bad:#f08a8a; --bad-soft:#3f1d1d;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;line-height:1.2;margin:0}
header.top{padding-block:28px 12px;display:grid;gap:6px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--grass);font-weight:800}
h1{font-size:clamp(28px,6vw,40px);color:var(--sky)}
.lead{color:var(--muted);margin:0;max-width:60ch}
.progress{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.done{background:var(--ok-soft);color:var(--ok)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:20px}
nav.tabs::-webkit-scrollbar{display:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tab{flex:0 0 auto;font:inherit;font-size:15px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  padding:7px 14px;border-radius:99px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--sky);border-color:var(--sky);color:var(--bg)}
.tab:focus-visible,.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,.card:focus-visible{outline:3px solid var(--grass);outline-offset:2px}

section.pane{display:grid;gap:18px}
.intro{color:var(--muted);margin:0}
h2{font-size:26px}
h3{font-size:20px;color:var(--sky)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.box.note{background:var(--grass-soft);border-color:transparent}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 16px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--sky);color:var(--bg);border-color:var(--sky)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.btn.warn{background:var(--grass);border-color:var(--grass);color:var(--bg)}
.btn:disabled{opacity:.5;cursor:default}

/* конспект */
.point{display:grid;gap:10px}
.point ul{margin:0;padding-left:20px;display:grid;gap:6px}
.point li{max-width:68ch}
b.k{color:var(--sky)}
mark{background:var(--grass-soft);color:var(--fg);padding:0 3px;border-radius:4px;font-weight:700}
.plan ol{margin:0;padding-left:22px;display:grid;gap:8px}
.plan .hint{color:var(--muted);font-size:15px}
.hidden-text .point ul{filter:blur(6px);user-select:none}

/* карточки */
.card{min-height:200px;display:grid;place-items:center;text-align:center;padding:24px;border-radius:16px;cursor:pointer;
  background:var(--surface);border:2px solid var(--line);user-select:none}
.card .face{display:grid;gap:10px}
.card .big{font-family:var(--display);font-size:clamp(28px,7vw,44px);color:var(--sky);line-height:1.15;font-variant-numeric:tabular-nums}
.card .back{font-size:19px;max-width:48ch}
.card .tap{font-size:13px;color:var(--muted)}
.card.flipped{background:var(--sky-soft);border-color:var(--sky)}
.counter{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:14px;font-weight:700;border:0;background:var(--surface);color:var(--muted);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sky-soft);color:var(--sky)}

/* лента */
.timeline{display:grid;gap:0;border-left:3px solid var(--grass);margin-left:6px}
.tl{display:grid;grid-template-columns:118px 1fr;gap:12px;padding:8px 0 8px 14px;position:relative}
.tl::before{content:"";position:absolute;left:-8px;top:16px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--grass)}
.tl .d{font-weight:800;color:var(--sky);font-variant-numeric:tabular-nums}
.tl .tag{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:6px;margin-left:6px;vertical-align:2px}
.tag.ru{background:var(--bad-soft);color:var(--bad)}
@media (max-width:480px){.tl{grid-template-columns:1fr;gap:0}}

/* сопоставление */
.match{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.col{display:grid;gap:8px;align-content:start;min-width:0}
.tile{font:inherit;font-size:15px;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 12px;border-radius:10px;cursor:pointer;line-height:1.35}
.tile.term{font-weight:800}
.tile.sel{border-color:var(--sky);background:var(--sky-soft)}
.tile.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);cursor:default}
.tile.wrong{animation:shake .35s;border-color:var(--bad);background:var(--bad-soft)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (max-width:520px){.match{grid-template-columns:1fr}}

/* сортировка */
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bin{border:2px dashed var(--line);border-radius:12px;padding:12px;min-height:90px;display:grid;gap:6px;align-content:start}
.bin h4{margin:0;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pool{display:flex;flex-wrap:wrap;gap:8px}

/* хронология */
.order{display:grid;gap:8px}
.order .tile{display:flex;gap:10px;align-items:flex-start}
.num{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--surface2);color:var(--muted);font-size:14px}
.tile.sel .num{background:var(--sky);color:var(--bg)}

/* тест */
.q{font-size:19px;font-weight:700;margin:0}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);padding:11px 14px;border-radius:10px;cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrongpick{border-color:var(--bad);background:var(--bad-soft)}
.explain{border-left:4px solid var(--grass);padding:6px 12px;background:var(--grass-soft);border-radius:0 8px 8px 0}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sky);transition:width .3s}
.score{font-family:var(--display);font-size:48px;color:var(--sky);font-variant-numeric:tabular-nums}

/* вопросы */
details.qa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0}
details.qa summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;gap:10px}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::before{content:"+";flex:0 0 22px;height:22px;border-radius:6px;background:var(--sky-soft);color:var(--sky);display:grid;place-items:center;font-weight:800}
details.qa[open] summary::before{content:"−"}
details.qa .ans{padding:0 16px 14px 48px;display:grid;gap:8px}
details.qa .ans ul{margin:0;padding-left:18px}
.qa .src{font-size:12px;font-weight:800;color:var(--grass);letter-spacing:.05em;text-transform:uppercase}
.selfcheck{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--muted)}
.qa.got{border-color:var(--ok)}
.qa.got summary::before{content:"✓";background:var(--ok-soft);color:var(--ok)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:560px}
th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{background:var(--surface2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
<header class="top">
  <div class="eyebrow">История Средних веков · § 15</div>
  <h1>Кочевники Великой степи и их соседи</h1>
  <p class="lead">Прочитай конспект, потренируй даты и понятия, пройди тест. Когда все галочки зелёные — ты готов пересказывать параграф.</p>
  <div class="progress" id="progress"></div>
</header>

<nav class="tabs" role="tablist" id="tabs"></nav>

<main id="main"></main>
</div>

const QUESTIONS = [
  {src:"Пункт 1", q:"Почему обитатели Великой степи вели кочевой образ жизни?", a:"Они разводили много скота: коней, коров, верблюдов. Стадам постоянно нужна свежая трава. Когда пастбище съедено, приходилось перекочёвывать на новое место. Поэтому и жилище у них было переносное — юрта."},
  {src:"Пункт 1", q:"Охарактеризуйте верования кочевников.", a:"Кочевники были язычниками. Они поклонялись явлениям природы. У каждого племени были свои верховные божества, а каждый род верил в своего духа-покровителя — духа земли, воды или растений."},
  {src:"Пункт 2", q:"Охарактеризуйте формы взаимоотношений кочевых и земледельческих народов.", a:"<ul><li><b>Набеги</b> — кочевники нападали на соседей за добычей и пленниками.</li><li><b>Дань</b> — земледельцы попадали в зависимость и годами платили кочевникам.</li><li><b>Торговля</b> — кочевые империи получали доходы от торговли с соседями.</li><li><b>Завоевание</b> — кочевники захватывали земли земледельцев и создавали на них свои государства.</li></ul>"},
  {src:"Пункт 2", q:"Назовите объединения, созданные кочевниками в раннее Средневековье. Какова была их судьба?", a:"<ul><li><b>Держава гуннов</b> — распалась после смерти Аттилы.</li><li><b>Аварский каганат</b> — разгромлен Карлом Великим.</li><li><b>Тюркский каганат</b> — распался на Западный и Восточный. Восточный разбили китайцы, на месте Западного возникли Великая Болгария и Хазарский каганат.</li><li><b>Сельджукский султанат</b> — распался на части, их потом завоевали монголы.</li></ul>Вывод: все они оказались непрочными."},
  {src:"Пункт 3", q:"В чём заключались причины побед монгольской армии? Перечислите не менее трёх причин.", a:"<ul><li>Железная дисциплина (за бегство одного казнили весь десяток).</li><li>Хорошая разведка — сведения от купцов, послов, пленных.</li><li>Продуманная тактика: атаки волнами — лучники, сабельные атаки, тяжёлая конница.</li><li>Осадные машины — тараны и катапульты, построенные пленными китайскими механиками.</li><li>Распри между правителями соседних стран.</li><li>Отличные наездники и стрелки, вся жизнь мужчин — с оружием.</li></ul>"},
  {src:"Пункт 3", q:"Как вели себя монголы в завоёванных странах?", a:"Жестоко: разрушали и сжигали города и деревни, истребляли жителей, забирали добычу, уводили ремесленников в рабство. Не разрушали только те поселения, которые сдавались без боя и соглашались платить дань."},
  {src:"Пункт 4", q:"Как кочевники относились к культурному наследию завоёванных ими народов?", a:"Часто не берегли его. Например, когда взяли Багдад, тысячи книг из знаменитого Дома мудрости бросили в ров с водой, чтобы по ним прошла конница."},
  {src:"Пункт 4", q:"Какие черты характера монгольского хана и багдадского халифа передаёт предание о тайнике с золотом?", a:"<b>Халиф</b> — жадный и недальновидный: копил золото, но не потратил его на защиту города, а потом пытался откупиться. <b>Хан</b> — жестокий и презирающий слабость: он не простил халифу жадность и казнил его вместе с семьёй."},
  {src:"Пункт 5", q:"Кто мог беспрепятственно передвигаться по монгольской державе?", a:"Тот, у кого была пайцза — специальный знак-пропуск. Это мог быть воин, купец или правитель завоёванной страны. На дорогах для них работали ямы — станции, где меняли лошадей, ели и ночевали."},
  {src:"Пункт 5", q:"Чем известен правитель Тимур?", a:"Тимур (Тамерлан) правил в 1370–1405 гг. Он не был потомком Чингисхана, но создал огромную империю: захватил большую часть Великого шёлкового пути, разбил хана Золотой Орды Тохтамыша, пленил турецкого султана Баязида I, разгромил Северную Индию, в 1395 г. ходил на Русь. Столица — Самарканд. Умер в 1405 г. в походе на Китай. Был неграмотным, но знал несколько языков и прекрасно играл в шахматы."},
  {src:"Итоговый 1", q:"Рассмотрите статую в начале параграфа. Кем предстаёт Чингисхан — полководцем или государственным деятелем? Почему в Монголии ему поставлен памятник?", a:"И тем и другим. Как полководец он создал непобедимую армию и завоевал огромные земли. Как государственный деятель — объединил монгольские племена, ввёл закон Ясу, создал державу. Для монголов он основатель их государства и национальный герой, поэтому ему поставили самую большую конную статую в мире (50 м, 250 т стали)."},

  {src:"Итоговый 3", q:"Какой ценой была создана Монгольская империя? Каким образом поддерживалось её единство?", a:"<b>Цена:</b> разрушенные города, гибель множества людей, рабство, упадок завоёванных стран, уничтоженные книги и памятники.<br><b>Единство держалось</b> на страхе (за неповиновение — смерть), законе Ясе, дани, наборе воинов, системе ямов и пайцзах, а также на веротерпимости: людям разных вер не мешали молиться своим богам."},

/* ============ КАРТОЧКИ ============ */
function flashcards(p, deck, key, opts){
  let mode = "front"; // front: показываем лицевую; reverse: оборот
  let queue = shuffle(deck), idx=0, known=0, flipped=false;
  const top=h("div",{class:"row",style:"justify-content:space-between"});
  const seg=h("div",{class:"seg",role:"group","aria-label":"Что показывать"});
  const b1=h("button",{"aria-pressed":"true"},opts.frontLabel), b2=h("button",{"aria-pressed":"false"},opts.backLabel);
  seg.append(b1,b2);
  const cnt=h("span",{class:"counter"});
  top.append(seg,cnt); p.append(top);
  const card=h("div",{class:"card",tabindex:"0",role:"button","aria-label":"Перевернуть карточку"});
  p.append(card);
  const ctr=h("div",{class:"row"});
  const no=h("button",{class:"btn"},"Ещё повторю"), yes=h("button",{class:"btn ok"},"Знаю ✓");
  ctr.append(no,yes); p.append(ctr);
  const status=h("p",{class:"intro"}); p.append(status);

  function show(){
    if(idx>=queue.length){
      card.className="card"; card.innerHTML=`<div class="face"><div class="big">Готово!</div><div class="back">Все карточки пройдены. Можно пройти ещё раз в другую сторону.</div></div>`;
      mark(key); cnt.textContent=""; no.hidden=true; yes.textContent="Начать заново"; yes.onclick=restart; return;
    }
    no.hidden=false; yes.textContent="Знаю ✓"; yes.onclick=good;
    const c=queue[idx]; flipped=false; card.className="card";
    const f = opts.front(c), b = opts.back(c);
    const showFront = mode==="front" ? f : b;
    card.innerHTML=`<div class="face"><div class="${mode==='front'?'big':'back'}">${showFront}</div><div class="tap">нажми, чтобы проверить</div></div>`;
    cnt.textContent=`${idx+1} из ${queue.length}`;
    status.textContent = known? `Выучено: ${known}` : "Сначала вспомни ответ сам, потом переверни карточку.";
  }
  function flip(){
    const c=queue[idx]; if(!c) return; flipped=!flipped;
    const f = opts.front(c), b = opts.back(c);
    if(flipped){ card.className="card flipped"; card.innerHTML=`<div class="face"><div class="${mode==='front'?'back':'big'}">${mode==='front'?b:f}</div></div>`; }
    else show();
  }
  function good(){ known++; idx++; show(); }
  function bad(){ queue.push(queue[idx]); idx++; show(); }
  function restart(){ queue=shuffle(deck); idx=0; known=0; show(); }
  card.onclick=flip; card.onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); } };
  no.onclick=bad;
  b1.onclick=()=>{ mode="front"; b1.setAttribute("aria-pressed","true"); b2.setAttribute("aria-pressed","false"); restart(); };
  b2.onclick=()=>{ mode="back"; b2.setAttribute("aria-pressed","true"); b1.setAttribute("aria-pressed","false"); restart(); };
  show();
}

      else { b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong"); }

    match.append(L,R); holder.append(match);

  const fb=h("p",{class:"intro"});

    if(!picked) return;
    if(picked.s.g===g){ picked.b.classList.remove("sel"); picked.b.classList.add("done"); bin.append(picked.b); picked=null; placed++; if(placed===SORT.length) fb.innerHTML="<b>Верно!</b> Люди: каган, хан, нукер. Управление и хозяйство: улус, курултай, юрта."; else fb.textContent="Правильно!"; }
    else { const b=picked.b; b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong"); fb.textContent="Подумай ещё: это человек или что-то другое?"; }
  }; });

function viewChrono(p){
  p.append(h("h2",{},"Хронология"));
  p.append(h("p",{class:"intro"},"Нажимай события по порядку: от самого раннего к самому позднему. Ошибся — нажми «Сбросить»."));
  const holder=h("div",{style:"display:grid;gap:12px"}); p.append(holder);
  let first=true, wins=0;
  function round(){
    holder.innerHTML="";
    let set;
    if(first){ set=CHRONO.map(x=>({...x})); holder.append(h("div",{class:"box note"},"<b>Задание из учебника.</b> Расположите события в хронологической последовательности.")); }
    else { set=shuffle(CHRONO_POOL).slice(0,5); }
    const list=h("div",{class:"order"});
    let order=[];
    const items=shuffle(set);
    items.forEach(it=>{
      const b=h("button",{class:"tile"},`<span class="num">·</span><span>${it.e}</span>`);
      b.onclick=()=>{ if(order.includes(it)) return; order.push(it); b.classList.add("sel"); b.querySelector(".num").textContent=order.length; if(order.length===items.length) check(); };
      it._b=b; list.append(b);
    });
    holder.append(list);
    const fb=h("div"); holder.append(fb);
    const row=h("div",{class:"row"});
    const reset=h("button",{class:"btn"},"Сбросить"), next=h("button",{class:"btn primary"},"Другие события");
    row.append(reset,next); holder.append(row);
    reset.onclick=()=>{ order=[]; items.forEach(it=>{ it._b.className="tile"; it._b.querySelector(".num").textContent="·"; }); fb.innerHTML=""; };
    next.onclick=()=>{ first=false; round(); };
    function check(){
      const correct=set.slice().sort((a,b)=>a.y-b.y);
      const ok=order.every((x,i)=>x===correct[i]);
      order.forEach((x,i)=>{ x._b.classList.remove("sel"); x._b.classList.add(x===correct[i]?"done":"wrong"); });
      if(ok){ wins++; if(wins>=2) mark("chrono"); fb.innerHTML=`<div class="explain"><b>Всё верно!</b> ${correct.map(c=>`${c.d||yearLabel(c.y)} — ${c.e}`).join(" → ")}</div>`; }
      else fb.innerHTML=`<div class="explain"><b>Есть ошибка.</b> Правильно: ${correct.map(c=>`${c.d||yearLabel(c.y)} — ${c.e}`).join(" → ")}. Нажми «Сбросить» и попробуй ещё.</div>`;
    }
  }
  function yearLabel(y){ return {450:"V в.",1206:"1206",1258:"1258",1405:"1405"}[y]||y; }
  round();
}

/* ============ ТЕСТ ============ */
function viewQuiz(p){
  p.append(h("h2",{},"Тест"));
  p.append(h("p",{class:"intro"},"10 вопросов, каждый раз новые. Набери 9 или 10 — и тема у тебя в кармане."));
  const holder=h("div",{style:"display:grid;gap:14px"}); p.append(holder);
  let set, i, score, wrong;
  function start(){ set=shuffle(QUIZ).slice(0,10).map(q=>{ const idx=shuffle(q.o.map((_,k)=>k)); return {...q, o:idx.map(k=>q.o[k]), a:idx.indexOf(q.a)}; }); i=0; score=0; wrong=[]; show(); }
  function show(){
    holder.innerHTML="";
    if(i>=set.length) return finish();
    const q=set[i];
    holder.append(h("div",{class:"row",style:"justify-content:space-between"},`<span class="counter">Вопрос ${i+1} из ${set.length}</span><span class="counter">Верно: ${score}</span>`));
    const bar=h("div",{class:"bar"},`<i style="width:${i/set.length*100}%"></i>`); holder.append(bar);
    holder.append(h("p",{class:"q"},q.q));
    const opts=h("div",{class:"opts"});
    let answered=false;
    q.o.forEach((o,k)=>{ const b=h("button",{class:"opt"},o); b.onclick=()=>{
      if(answered) return; answered=true;
      if(k===q.a){ score++; b.classList.add("right"); }
      else { b.classList.add("wrongpick"); opts.children[q.a].classList.add("right"); wrong.push(q); }
      if(q.ex) holder.append(h("div",{class:"explain"},q.ex));
      const n=h("button",{class:"btn primary"}, i+1<set.length?"Дальше →":"Результат"); n.onclick=()=>{ i++; show(); }; holder.append(n); n.focus();
    }; opts.append(b); });
    holder.append(opts);
  }
  function finish(){
    if(score>=9) mark("quiz");
    const msg = score>=9?"Отлично! Ты хорошо знаешь тему.": score>=7?"Хорошо, но есть что повторить.":"Перечитай конспект и попробуй ещё раз.";
    holder.append(h("div",{class:"box",style:"text-align:center;display:grid;gap:6px"},`<div class="score">${score} / ${set.length}</div><div>${msg}</div>`));
    if(wrong.length){
      const b=h("div",{class:"box"},"<h3>Где ошибся</h3>");
      const ul=h("ul",{style:"margin:8px 0 0;padding-left:20px;display:grid;gap:6px"});
      wrong.forEach(q=>ul.append(h("li",{},`${q.q} — <b>${q.o[q.a]}</b>`)));
      b.append(ul); holder.append(b);
    }
    const r=h("button",{class:"btn primary"},"Пройти ещё раз"); r.onclick=start; holder.append(r);
  }
  start();
}

/* ============ ВОПРОСЫ ============ */
function viewQA(p){
  p.append(h("h2",{},"Все вопросы параграфа"));
  p.append(h("p",{class:"intro"},"Сначала ответь вслух сам. Потом открой ответ и сравни. Если ответил правильно, отметь галочку."));
  const cnt=h("p",{class:"counter"}); p.append(cnt);
  function upd(){ const n=QUESTIONS.filter((_,i)=>S.gotQA[i]).length; cnt.textContent=`Отвечено: ${n} из ${QUESTIONS.length}`; if(n===QUESTIONS.length) mark("qa"); }
  QUESTIONS.forEach((q,i)=>{
    const d=h("details",{class:"qa"+(S.gotQA[i]?" got":"")});
    d.append(h("summary",{},`<span><span class="src">${q.src}</span><br>${q.q}</span>`));
    const ans=h("div",{class:"ans"}, `<div>${q.a}</div>`);
    const lab=h("label",{class:"selfcheck"});
    const cb=h("input",{type:"checkbox",id:"qa"+i}); cb.checked=!!S.gotQA[i];
    cb.onchange=()=>{ S.gotQA[i]=cb.checked; d.classList.toggle("got",cb.checked); save(); upd(); };
    lab.append(cb, document.createTextNode("Я ответил(а) сам(а) правильно"));
    ans.append(lab); d.append(ans); p.append(d);
  });
  upd();
  const reset=h("button",{class:"btn",style:"justify-self:start"},"Сбросить весь прогресс");
  let armed=false;
  reset.onclick=()=>{ if(!armed){ armed=true; reset.textContent="Точно сбросить? Нажми ещё раз"; return; } S={done:{},gotQA:{},tab:"read"}; save(); renderTabs(); render(); };
  p.append(reset);
}

renderTabs(); renderProgress(); render();
</script>
