<div id="bar">
  <button id="bPrev" title="Назад (←)">◀</button><button id="bNext" title="Вперёд (→, пробел)">▶</button>
  <span id="cnt"></span><div class="prog"><i id="pr"></i></div>
  <button id="bMenu" title="Все слайды (M)">☰ Слайды</button><button id="bFull" title="Полный экран (F)">⛶</button>
</div>
<div id="menu"><ol id="list"></ol></div>

<script>
(function(){
const stage=document.getElementById('stage');
const slides=[...document.querySelectorAll('.slide')];
let i=0;
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

/* кирпичи на слайде «система» */
const B=document.getElementById('bricks');
if(B){for(let k=0;k<15;k++){const b=document.createElement('div');const r=Math.floor(k/5),c=k%5;
  b.style.cssText=`position:absolute;width:96px;height:44px;background:#C0573A;border:3px solid #8a3a24;border-radius:4px;transition:all .9s cubic-bezier(.3,1.3,.5,1);transition-delay:${k*0.05}s`;
  b.dataset.x=(c*102+(r%2?51:0))+'px';b.dataset.y=(250-r*50)+'px';
  b.style.left=(Math.random()*420)+'px';b.style.top=(150+Math.random()*120)+'px';b.style.transform=`rotate(${Math.random()*80-40}deg)`;B.appendChild(b)}}
function buildWall(on){if(!B)return;[...B.children].forEach(b=>{if(on){b.style.left=b.dataset.x;b.style.top=b.dataset.y;b.style.transform='none'}})}

function frags(s){return [...s.querySelectorAll('.f')]}
let auto=[];
function stopAuto(){auto.forEach(clearTimeout);auto=[]}
function reveal(f){f.classList.add('on');if(f.hasAttribute('data-bricks'))buildWall(true)}
function autoReveal(s){stopAuto();const fs=frags(s);const step=+(s.dataset.step||1100);const first=+(s.dataset.first||700);
  fs.forEach((f,k)=>auto.push(setTimeout(()=>reveal(f),first+k*step)))}
function show(n,allFrags){
  stopAuto();
  slides[i].classList.remove('active');
  i=Math.max(0,Math.min(slides.length-1,n));const s=slides[i];
  frags(s).forEach(f=>f.classList.toggle('on',!!allFrags));
  s.classList.add('active');
  const fr=s.querySelector('iframe[data-src]');if(fr&&!fr.src)fr.src=fr.dataset.src;
  if(s.querySelector('#bricks'))buildWall(!!allFrags);
  document.getElementById('cnt').textContent=`${i+1} / ${slides.length}`;
  document.getElementById('pr').style.width=((i+1)/slides.length*100)+'%';
  history.replaceState(null,'','#'+(i+1));
  if(!allFrags)autoReveal(s);
  [...document.querySelectorAll('#list li')].forEach((li,k)=>li.style.fontWeight=k===i?'700':'');
}
function next(){const h=frags(slides[i]).filter(f=>!f.classList.contains('on'));
  if(h.length){stopAuto();h.forEach(reveal);return}
  if(i<slides.length-1)show(i+1,false)}
function prev(){if(i>0)show(i-1,true)}
document.addEventListener('keydown',e=>{
  if(document.getElementById('menu').classList.contains('open')){if(e.key==='Escape'||e.key==='m'||e.key==='ь')toggleMenu();return}
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next()}
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}
  else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);
  else if(e.key==='f'||e.key==='а')full();else if(e.key==='m'||e.key==='ь')toggleMenu();
});
addEventListener('message',e=>{if(e.data&&e.data.deck==='next')next();if(e.data&&e.data.deck==='prev')prev()});
stage.addEventListener('click',e=>{if(e.target.closest('iframe,button,a,input'))return;if(slides[i].dataset.ex)return;next()});
function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}
function toggleMenu(){document.getElementById('menu').classList.toggle('open')}
document.getElementById('bPrev').onclick=prev;document.getElementById('bNext').onclick=next;
document.getElementById('bFull').onclick=full;document.getElementById('bMenu').onclick=toggleMenu;
const L=document.getElementById('list');
slides.forEach((s,k)=>{const li=document.createElement('li');li.textContent=(s.dataset.ex?'🎮 ':'')+s.dataset.title;if(s.dataset.ex)li.className='ex';li.onclick=()=>{toggleMenu();show(k,false)};L.appendChild(li)});
document.getElementById('menu').addEventListener('click',e=>{if(e.target.id==='menu')toggleMenu()});
show((parseInt(location.hash.slice(1))||1)-1,false);
})();
</script>
</body>
</html>
