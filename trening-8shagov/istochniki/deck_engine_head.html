<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>8 шагов решения проблем</title>
<style>
:root{--blue:#003196;--sky:#0097D8;--green:#48A044;--orange:#E65907;--purple:#7957B2;--teal:#00A7A3;--yellow:#F2C500;--red:#CD242C;--ink:#1B1B1B;--muted:#5d6470;--bg:#F4F6FA}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0f1a33;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;background:var(--bg);overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.slide{position:absolute;inset:0;display:none;flex-direction:column}
.slide.active{display:flex}
.hd{display:flex;align-items:center;gap:18px;padding:22px 48px;color:#fff;background:var(--blue);min-height:96px}
.hd h2{margin:0;font-size:44px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.hd .tag{margin-left:auto;font-size:18px;background:rgba(255,255,255,.18);padding:6px 14px;border-radius:20px}
.hd.green{background:var(--green)}.hd.purple{background:var(--purple)}.hd.teal{background:var(--teal)}.hd.orange{background:var(--orange)}
.body{flex:1;padding:36px 56px 64px;display:flex;flex-direction:column;justify-content:center;gap:26px;position:relative}
.row{display:flex;gap:28px;align-items:stretch}
.col{flex:1;display:flex;flex-direction:column;gap:16px}
.lead{font-size:42px;line-height:1.3;margin:0}
.big{font-size:54px;font-weight:700;line-height:1.2;margin:0}
.muted{color:var(--muted)}
p{font-size:32px;line-height:1.4;margin:0}
.card{background:#fff;border-radius:18px;padding:28px 32px;box-shadow:0 2px 10px rgba(0,30,90,.08);font-size:30px;line-height:1.4}
.card h3{margin:0 0 12px;font-size:25px;text-transform:uppercase;letter-spacing:.5px;color:var(--orange)}
.card.term{border-top:8px solid var(--orange)}
.card.how{border-top:8px solid var(--teal)}.card.how h3{color:var(--teal)}
.card.fact{border-left:10px solid var(--yellow);background:#FFFBE6}.card.fact h3{color:#8a6d00}
.chip{display:inline-block;padding:10px 22px;border-radius:30px;font-size:28px;color:#fff;margin:6px}
/* появление */
.f{opacity:0;transform:translateY(18px);transition:opacity .45s,transform .45s}
.f.on{opacity:1;transform:none}
.slide.active .a{animation:up .6s both;animation-delay:var(--d,0s)}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.pop.on,.slide.active .pop.a{animation:pop .5s both;animation-delay:var(--d,0s)}
/* нижняя панель */
#bar{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(10,20,45,.85);color:#fff;font-size:15px;z-index:10;opacity:.25;transition:opacity .3s}
#bar:hover{opacity:1}
#bar button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:4px 12px;font-size:15px;cursor:pointer}
#bar .prog{flex:1;height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
#bar .prog i{display:block;height:100%;background:var(--green);transition:width .3s}
#menu{position:fixed;inset:0;background:rgba(10,20,45,.92);z-index:20;display:none;overflow:auto;padding:40px}
#menu.open{display:block}
#menu ol{columns:3;color:#fff;font-size:17px;max-width:1300px;margin:0 auto}
#menu li{margin:6px 0;cursor:pointer}#menu li:hover{color:var(--yellow)}
#menu li.ex{color:#8fd88a}
.frame{flex:1;border:0;width:100%;background:#F4F6FA}
.slide[data-ex]{padding-bottom:44px;background:#F4F6FA}
.exhd{display:flex;align-items:center;gap:16px;padding:16px 40px;background:var(--green);color:#fff}
.exhd h2{margin:0;font-size:32px;text-transform:uppercase}
.exhd .tag{margin-left:auto;font-size:17px;background:rgba(255,255,255,.2);padding:5px 14px;border-radius:20px}
.chat{display:flex;align-items:center;gap:26px;background:#fff;border-radius:20px;padding:30px 36px;font-size:36px;box-shadow:0 2px 10px rgba(0,30,90,.08)}
.chat .ic{font-size:64px}
.num{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--yellow);color:var(--ink);font-weight:800;font-size:26px;flex:none}
.fpanel{border:4px solid;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:16px}
.fph{font-size:34px;font-weight:800}.fph small{display:block;font-size:22px;font-weight:400;color:#555}
.fgrid{display:grid;gap:14px;flex:1;align-content:center}
.ftile{background:#fff;border:3px solid;border-radius:14px;padding:16px 10px;text-align:center;font-size:23px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;line-height:1.2}
.ftile span{font-size:40px}
.xl .card{font-size:37px}.sm .card{font-size:25px;padding:20px 26px}.sm .lead{font-size:34px}.tight .card{padding:16px 28px;font-size:28px}.tight{gap:12px!important}.xl p{font-size:38px}.xl .lead{font-size:46px}.xl .card h3{font-size:28px}
.note{position:absolute;bottom:22px;left:56px;font-size:16px;color:var(--muted)}
</style>
</head>
