<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Соберите 8 шагов</title><style>
*{box-sizing:border-box}
.embed header{display:none}.embed main{padding-top:12px;padding-bottom:6px;gap:12px}.embed .help{display:none}html.embed{zoom:1.1}.embed body{min-height:0}.embed body{background:#fff}
html,body{margin:0;min-height:100%}
body{font-family:"Segoe UI",Arial,sans-serif;background:#F2F2F2;color:#1B1B1B;font-size:20px;display:flex;flex-direction:column;min-height:100vh}
header{background:#00478D;color:#fff;display:flex;align-items:center;gap:18px;padding:14px 28px;flex-wrap:wrap}
header h1{margin:0;font-size:30px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
header .mech{background:rgba(255,255,255,.2);border-radius:20px;padding:4px 12px;font-size:15px}
header .slide{margin-left:auto;font-size:16px;opacity:.9}
header a{color:#fff;text-decoration:none;font-size:16px;border:1px solid rgba(255,255,255,.6);padding:6px 12px;border-radius:6px}
main{flex:1;padding:20px 28px;display:flex;flex-direction:column;gap:16px;max-width:1500px;width:100%;margin:0 auto}
.task{background:#fff;border-left:6px solid #0094DF;padding:14px 18px;font-size:22px}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:18px;padding:10px 22px;border-radius:8px;border:0;cursor:pointer;background:#00478D;color:#fff}
button.sec{background:#fff;color:#00478D;border:2px solid #00478D}
button:disabled{opacity:.4;cursor:default}
.score{font-size:20px;font-weight:600}
.help{font-size:15px;color:#666}
.why{background:#00478D;color:#fff;padding:12px 18px;border-radius:8px;font-size:18px;min-height:48px}
.why:empty{display:none}
.card{background:#fff;border:2px solid #0094DF;border-radius:8px;padding:10px 14px;cursor:pointer;user-select:none;font-size:18px;line-height:1.25;box-shadow:0 1px 3px rgba(0,0,0,.12);transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.card.sel{background:#FFF6B3;border-color:#E6A800;box-shadow:0 0 0 4px rgba(230,168,0,.3)}
.ok{border-color:#48A044!important;background:#E6F4E5!important}
.bad{border-color:#CD242C!important;background:#FBE4E5!important}
.miss{border-color:#E6A800!important;border-style:dashed!important}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:64px;padding:12px;background:#fff;border:2px dashed #C8C8C8;border-radius:8px}
.pool:empty::after{content:"Все карточки разложены. Нажмите «Проверить»";color:#888;align-self:center}
/* колонки */
.cols{display:grid;gap:14px;flex:1}
.col{background:#fff;border-radius:8px;display:flex;flex-direction:column;min-height:180px;cursor:pointer;border:2px solid transparent}
.col.hot{border-color:#E6A800}
.col h2{margin:0;color:#fff;font-size:20px;text-transform:uppercase;padding:10px 14px;border-radius:6px 6px 0 0}
.col h2 small{display:block;font-size:14px;text-transform:none;font-weight:400;opacity:.9}
.drop{flex:1;padding:10px;display:flex;flex-direction:column;gap:8px}
/* плитки */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{background:#fff;border:3px solid #D6D6D6;border-radius:14px;padding:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-size:19px;position:relative;transition:transform .12s}
.tile:hover{transform:scale(1.03)}
.tile .ic{font-size:48px;line-height:1}
.tile.on{border-color:#00478D;background:#E8EEFB}
.tile.on::after{content:"✓";position:absolute;top:8px;right:12px;font-size:26px;color:#00478D;font-weight:700}
/* мишень */
.tgt-wrap{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:stretch}
.target{width:100%}
.tg-out{background:#E3F3FB;border:3px solid #0094DF;border-radius:18px;padding:14px;min-height:430px;display:flex;flex-direction:column;gap:12px;cursor:pointer}
.tg-out.hot,.tg-in.hot{outline:4px solid #E6A800}
.tg-in{background:#E6F4E5;border:3px solid #48A044;border-radius:16px;padding:14px;flex:1;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.tg-h{font-size:22px;font-weight:700;color:#00478D}.tg-h small{display:block;font-size:15px;font-weight:400;color:#555}
.tg-in .tg-h{color:#2E7D32}
.tg-c{display:inline-block;background:#00478D;color:#fff;border-radius:20px;padding:2px 14px;font-size:18px;margin-left:8px}
.tg-zone{display:flex;flex-wrap:wrap;gap:10px;min-height:90px;align-content:flex-start}
.tg-zone .card{font-size:19px}
.tgt-wrap .pool{flex-direction:column;align-content:flex-start;gap:6px}
.tgt-wrap .pool .card{font-size:15px;padding:6px 10px}
/* пары */
.match{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:18% ;align-items:start}
.match .colm{display:flex;flex-direction:column;gap:14px}
.match svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.match .card{min-height:64px;display:flex;align-items:center}
.match .tg{border-color:#7957B2}
/* перевёртыши */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.flip{perspective:1000px;height:170px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.flip .f{background:#fff;border:3px solid #0094DF;font-size:20px}
.flip .f small{color:#999;font-size:14px;margin-top:10px}
.flip .b{transform:rotateY(180deg);color:#fff}
.flip .b b{font-size:30px;text-transform:uppercase}
.flip .b span{font-size:16px;margin-top:8px}
/* свайп */
.swipe{display:flex;flex-direction:column;align-items:center;gap:20px;flex:1}
.stat{display:flex;gap:28px;align-items:center;font-size:22px;font-weight:600}
.timebar{width:min(900px,100%);height:12px;background:#D6D6D6;border-radius:6px;overflow:hidden}
.timebar i{display:block;height:100%;background:#E65907;transition:width 1s linear}
.sw-card{width:min(760px,100%);min-height:200px;background:#fff;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;text-align:center;font-size:30px;padding:30px;transition:transform .25s,opacity .25s}
.sw-card.goL{transform:translateX(-120%) rotate(-12deg);opacity:0}
.sw-card.goR{transform:translateX(120%) rotate(12deg);opacity:0}
.sw-btns{display:flex;gap:24px;width:min(760px,100%)}
.sw-btns button{flex:1;font-size:26px;padding:22px;font-weight:700}
.flash{min-height:56px;font-size:19px;text-align:center;max-width:900px}
.flash.badf{color:#CD242C}.flash.okf{color:#2E7D32}
.sw-card.right{background:#E6F4E5}.sw-card.wrong{background:#FBE4E5}
.sw-btns button:disabled{opacity:.35}
/* гонка */
.track{position:relative;height:96px;background:repeating-linear-gradient(90deg,#3b3b3b 0 40px,#444 40px 80px);border-radius:14px;overflow:hidden}
.track::before{content:"";position:absolute;left:0;right:0;top:46px;border-top:4px dashed #fff;opacity:.7}
.track .flag{position:absolute;right:10px;top:18px;font-size:52px}
.track .car{position:absolute;top:14px;font-size:58px;transition:left 1s cubic-bezier(.3,1.4,.5,1);transform:scaleX(-1)}
.track .cp{position:absolute;bottom:6px;width:10px;height:10px;border-radius:50%;background:#777;transform:translateX(-50%)}
.track .cp.ok{background:#48A044!important}.track .cp.bad{background:#CD242C!important}
.hint{background:#fff;color:#7957B2;border:2px solid #7957B2}
.opt.gone{opacity:.15!important;pointer-events:none}
.confetti{position:fixed;top:-20px;font-size:26px;animation:fall 1.6s ease-in forwards;pointer-events:none;z-index:99}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
/* пропуски */
.sent{background:#fff;border-radius:10px;padding:9px 14px;font-size:19px;line-height:1.45}
.blank{display:inline-block;min-width:150px;border:0;border-bottom:3px solid #00478D;background:#F2F5FB;color:#00478D;font-weight:700;padding:0 10px;margin:0 6px;border-radius:6px 6px 0 0;font-size:19px;cursor:pointer}
.blank.sel{background:#FFF6B3;border-color:#E6A800}
.blank.ok{border-bottom-color:#48A044!important;color:#2E7D32}
.blank.bad{border-bottom-color:#CD242C!important;color:#CD242C}
.sent .w{display:block;font-size:14px;color:#555;margin-top:2px}
.bank{display:flex;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:#F2F2F2;padding:8px 0;z-index:3}
.bank button{background:#7957B2;font-size:20px;padding:10px 24px;border-radius:24px}
/* таблица */
.slots{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:10px}
.slots .hd{color:#fff;font-weight:700;padding:10px 14px;border-radius:8px;font-size:18px}
.slots .hd small{display:block;font-weight:400;font-size:14px}
.slots .rh{background:#fff;border-left:6px solid #00478D;padding:12px;font-size:17px;border-radius:8px}
.slots .cell{background:#fff;border:2px dashed #C8C8C8;border-radius:8px;min-height:80px;padding:8px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.slots .cell.hot{border-color:#E6A800}
/* порядок */
.order{display:flex;flex-direction:column;gap:10px;max-width:900px;width:100%;margin:0 auto}
.orow{display:flex;align-items:center;gap:14px;background:#fff;border-radius:10px;padding:12px 16px;font-size:21px;box-shadow:0 1px 3px rgba(0,0,0,.12);cursor:grab;border:2px solid transparent}
.orow .n{width:40px;height:40px;border-radius:50%;background:#00478D;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.orow .t{flex:1}
.orow .w{display:block;font-size:15px;color:#555}
.orow button{padding:6px 12px;font-size:18px}
.orow.drag{opacity:.4}
/* квиз */
.big{font-size:30px;line-height:1.3;background:#fff;padding:26px 30px;border-radius:10px}
.big img{display:block;margin:14px 0 0;max-height:220px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.opt{background:#fff;color:#00478D;border:3px solid #00478D;font-size:24px;padding:20px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:12px;min-height:90px}
.opt.ok{background:#48A044!important;border-color:#48A044;color:#fff}
.opt.bad{background:#CD242C!important;border-color:#CD242C;color:#fff}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:8px;border-radius:4px;background:#D0D0D0}
.progress i.ok{background:#48A044}.progress i.bad{background:#CD242C}.progress i.cur{background:#E6A800}
.timer{font-size:36px;font-weight:700;color:#E65907;min-width:70px;text-align:right}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.team{background:#fff;border-radius:10px;padding:10px 16px;display:flex;align-items:center;gap:14px;font-size:22px;font-weight:700}
.team b{font-size:40px;margin-left:auto}
.team button{font-size:16px;padding:8px 14px}
.final{text-align:center;font-size:34px;background:#fff;padding:40px;border-radius:10px}
.final b{font-size:80px;color:#48A044;display:block}
/* меню */
.hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.hub a{background:#fff;border-radius:10px;padding:18px 20px;text-decoration:none;color:#1B1B1B;border-top:6px solid #0094DF;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.hub a:hover{box-shadow:0 4px 12px rgba(0,0,0,.18)}
.hub small{color:#777;font-size:15px;display:block;margin-bottom:6px}
.hub span{font-size:22px;font-weight:600;display:block}
.hub em{font-style:normal;color:#7957B2;font-size:15px}
.final ul{text-align:left;font-size:18px;max-width:800px;margin:20px auto 0}
.final li{margin:8px 0}
/* ===== дополнения для тренинга по КРД ===== */
.casebox{background:#fff;border-left:8px solid var(--c,#00478D);border-radius:10px;padding:12px 18px;display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:19px;line-height:1.35;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.casebox .ctag{grid-column:1/-1;font-weight:700;color:var(--c,#00478D);text-transform:uppercase;font-size:15px;letter-spacing:.5px}
.casebox .lbl{color:#5d6470;font-size:14px;text-transform:uppercase;font-weight:700;padding-top:3px}
.act{background:#fff;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.12);padding:22px 30px;font-size:27px;line-height:1.3;text-align:center;min-height:110px;display:flex;align-items:center;justify-content:center;transition:background .25s}
.act.right{background:#E6F4E5}.act.wrong{background:#FBE4E5}
.act small{display:block;font-size:15px;color:#777;margin-bottom:6px}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.bin{background:#fff;color:#1B1B1B;border:3px solid var(--c);font-size:24px;font-weight:700;padding:12px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.bin small{font-size:15px;font-weight:400;color:#555}
.bin .k{font-size:13px;font-weight:400;color:#999}
.bin.ok{color:#2E7D32;box-shadow:0 0 0 4px rgba(72,160,68,.25)}
.bin.bad{color:#CD242C}
.bin:disabled{opacity:1;cursor:default}
.rank{display:inline-block;margin-top:6px;font-size:30px;font-weight:700;color:#00478D}
.final .rank{display:block;margin:4px 0 10px}
.final h3{font-size:22px;margin:18px 0 6px;color:#00478D}
.final details{margin-top:12px;font-size:18px}.final summary{cursor:pointer;color:#CD242C;font-weight:600}
.final .mist{max-height:230px;overflow:auto;text-align:left;font-size:17px;max-width:1000px;margin:6px auto 0;background:#FBE4E5;border-radius:8px;padding:8px 14px 8px 30px}
.final .mist li{margin:5px 0}
/* рыбья кость */
.fishtop{display:grid;grid-template-columns:1fr 260px;gap:14px}
.fcard{background:#fff;border:3px solid #00478D;border-radius:14px;padding:12px 18px;font-size:23px;font-weight:600;line-height:1.3;min-height:76px;display:flex;align-items:center;box-shadow:0 4px 14px rgba(0,49,150,.15)}
.fcard small{font-size:14px;color:#777;font-weight:400;margin-right:12px;white-space:nowrap}
.fcard.done{border-color:#48A044;background:#E6F4E5}
.trash{background:#fff;border:3px dashed #9aa3b5;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:19px;font-weight:700;color:#5d6470;padding:6px;text-align:center}
.trash small{font-weight:400;font-size:13px}
.fish{position:relative;display:grid;grid-template-columns:repeat(3,1fr) 210px;grid-template-rows:auto 34px auto;gap:0 12px}
.zone.zt::after,.zone.zb::after{content:"";position:absolute;left:62%;width:5px;height:30px;background:var(--c);border-radius:3px}
.zone.zt::after{bottom:-31px;transform:rotate(-38deg);transform-origin:top}
.zone.zb::after{top:-31px;transform:rotate(38deg);transform-origin:bottom}
.zone{position:relative;background:rgba(255,255,255,.92);border:2px dashed #C8C8C8;border-radius:12px;padding:8px 10px;min-height:118px;cursor:pointer;display:flex;flex-direction:column;gap:5px;transition:transform .12s,box-shadow .12s}
.zone:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.zone .zh{font-size:19px;font-weight:700;color:var(--c)}
.zone .zd{font-size:13px;color:#666;line-height:1.2}
.zone .chips{display:flex;flex-direction:column;gap:4px}
.zone .chip2{font-size:13px;line-height:1.2;background:#F4F6FA;border-left:4px solid var(--c);border-radius:4px;padding:3px 6px;cursor:help}
.zone.flashok{border:2px solid #48A044;background:#E6F4E5}.zone.flashbad{border:2px solid #CD242C;background:#FBE4E5}
.zone.target{border:3px solid #E6A800;background:#FFF6B3}
.trash.flashok{border-color:#48A044;background:#E6F4E5}.trash.flashbad{border-color:#CD242C;background:#FBE4E5}.trash.target{border:3px solid #E6A800;background:#FFF6B3}
.fhead{grid-column:4;grid-row:1/4;align-self:center;background:linear-gradient(135deg,#FFE7A3,#FFC94D);border-radius:20px 90px 90px 20px;padding:20px 26px 20px 18px;font-size:19px;font-weight:700;line-height:1.3}
.fhead small{display:block;font-size:13px;color:#8a6d00;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.spine{grid-column:1/4;grid-row:2;position:relative}
.spine::before{content:"";position:absolute;left:0;right:-12px;top:50%;height:7px;margin-top:-3px;background:#00478D;border-radius:4px}
.spine::after{content:"";position:absolute;right:-24px;top:50%;margin-top:-12px;border-left:20px solid #00478D;border-top:12px solid transparent;border-bottom:12px solid transparent}
.trash .chips{display:flex;flex-direction:column;gap:3px;margin-top:4px;width:100%}
.trash .chip2{font-size:12px;font-weight:400;background:#F4F6FA;border-radius:4px;padding:2px 5px;color:#333}
/* 5 почему */
.wtiles{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.wtile{background:#fff;border-radius:14px;border-top:8px solid var(--c);padding:20px 24px;cursor:pointer;box-shadow:0 2px 10px rgba(0,30,90,.1);text-align:left;color:#1B1B1B;font-size:19px;display:flex;flex-direction:column;gap:8px;border-left:0;border-right:0;border-bottom:0}
.wtile:hover{box-shadow:0 6px 18px rgba(0,30,90,.18)}
.wtile b{font-size:26px}.wtile em{font-style:normal;color:#5d6470;font-size:16px}
.wgrid{display:grid;grid-template-columns:400px 1fr;gap:18px;align-items:start}
.chain{background:#fff;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.3}
.chain .lk{display:flex;gap:8px;align-items:flex-start}
.chain .lk i{font-style:normal;flex:none;width:26px;height:26px;border-radius:50%;background:#D0D0D0;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.chain .lk.ok i{background:#48A044}.chain .lk.cur i{background:#E6A800}
.chain .lk.cur{font-weight:700}
.chain .lk span{color:#777}
.chain .lk.ok span{color:#1B1B1B}
.chain .pr{background:#FFF6B3;border-radius:8px;padding:6px 10px;font-weight:700;font-size:15px}
.chain .rt{background:#E6F4E5;border-radius:8px;padding:6px 10px;font-weight:700;color:#2E7D32}
.wq{font-size:28px;font-weight:700;color:#00478D;margin:0 0 4px}
.wopts{display:flex;flex-direction:column;gap:10px}
.wopt{background:#fff;color:#1B1B1B;border:3px solid #00478D;font-size:21px;padding:12px 18px;text-align:left;font-weight:600;display:flex;gap:14px;align-items:center;line-height:1.25}
.wopt b{flex:none;width:34px;height:34px;border-radius:50%;background:#00478D;color:#fff;display:grid;place-items:center;font-size:17px}
.wopt.ok{background:#E6F4E5;border-color:#48A044}.wopt.ok b{background:#48A044}
.wopt.bad{background:#FBE4E5;border-color:#CD242C;opacity:.75}.wopt.bad b{background:#CD242C}
.wopt:disabled{cursor:default;opacity:1}
.wopt.bad:disabled{opacity:.75}
.therefore{background:#fff;border-left:8px solid #48A044;border-radius:10px;padding:14px 20px;font-size:21px;line-height:1.5}
.therefore div{opacity:0;transform:translateX(-12px);transition:all .45s}
.therefore div.on{opacity:1;transform:none}
.therefore em{font-style:normal;color:#48A044;font-weight:700}
/* выбери КРД */
.popts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.popt{background:#fff;color:#1B1B1B;border:3px solid #00478D;font-size:18px;padding:10px 14px;text-align:left;font-weight:500;display:flex;flex-direction:column;gap:5px;line-height:1.28;min-height:80px}
.popt .ph{display:flex;gap:12px;align-items:flex-start}
.popt .ph b{flex:none;width:32px;height:32px;border-radius:50%;background:#00478D;color:#fff;display:grid;place-items:center;font-size:17px}
.popt .lab{display:none;font-size:15px;font-weight:700;padding:3px 10px;border-radius:12px;align-self:flex-start}
.popt.rev .lab{display:inline-block}
.popt.rev{opacity:.8}
.popt.good{border-color:#48A044;background:#E6F4E5;opacity:1}.popt.good .lab{background:#48A044;color:#fff}.popt.good .ph b{background:#48A044}
.popt.wrong{border-color:#CD242C;background:#FBE4E5;opacity:1}.popt.wrong .lab{background:#CD242C;color:#fff}.popt.wrong .ph b{background:#CD242C}
.popt.rev:not(.good):not(.wrong) .lab{background:#E1E5EE;color:#333}
.popt:disabled{cursor:default}
.popt .pw{display:none;font-size:14px;color:#444;line-height:1.25}
.popt.rev .pw{display:block}
/* гонка в космосе */

<body><header><h1>Соберите 8 шагов</h1><span class="mech">Расставь по порядку</span><span class="slide">к слайду 30</span><a href="index.html">Все упражнения</a></header><main><div class="task">Расставьте шаги метода по порядку: перетащите строки или нажимайте стрелки.</div><div class="order" id="order"></div><div class="why" id="why"></div><div class="bar"><button id="bCheck">Проверить</button><button class="sec" id="bAns">Показать ответы</button><button class="sec" id="bRe">Заново</button><span class="score" id="score"></span></div></main><script>const DATA={"steps": [{"t": "Определение проблемы", "why": "Что хотим улучшить, насколько и когда? Инструмент: 5W1H."}, {"t": "Сбор информации о проблеме", "why": "Какие данные нужны? Цель по SMART."}, {"t": "Поиск корневых причин", "why": "Диаграмма Исикавы, 5 почему, Парето."}, {"t": "Генерация вариантов решений", "why": "Мозговой штурм без критики."}, {"t": "Выбор приоритетного решения", "why": "Матрица 2×2, рейтинговое голосование."}, {"t": "Разработка плана мероприятий", "why": "Кто, что и когда делает."}, {"t": "Реализация и отслеживание", "why": "Совещания не реже раза в две недели, «было – стало»."}, {"t": "Стандартизация и тиражирование", "why": "Изменить стандарты и рассказать коллегам."}]};

const D = DATA;
const $ = s => document.querySelector(s);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e}
const why=$('#why'), score=$('#score');

const box=$('#order');let drag=null;
function build(){
  box.innerHTML='';why.textContent='';score.textContent='';
  let s=shuffle(D.steps.map((x,i)=>({...x,i})));while(s.every((x,k)=>x.i===k))s=shuffle(s);
  s.forEach(x=>{
    const r=el('div','orow',`<span class="n"></span><span class="t">${x.t}<span class="w"></span></span><button class="sec up">▲</button><button class="sec dn">▼</button>`);
    r.dataset.i=x.i;r.draggable=true;r.querySelector('.w').dataset.why=x.why||'';
    r.querySelector('.up').onclick=()=>{if(r.previousElementSibling)box.insertBefore(r,r.previousElementSibling);num()};
    r.querySelector('.dn').onclick=()=>{if(r.nextElementSibling)box.insertBefore(r.nextElementSibling,r);num()};
    r.addEventListener('dragstart',()=>{drag=r;r.classList.add('drag')});
    r.addEventListener('dragend',()=>{r.classList.remove('drag');drag=null;num()});
    r.addEventListener('dragover',e=>{e.preventDefault();if(!drag||drag===r)return;const b=r.getBoundingClientRect();box.insertBefore(drag,e.clientY<b.top+b.height/2?r:r.nextElementSibling)});
    box.appendChild(r);
  });num();
}
function num(){[...box.children].forEach((r,k)=>{r.querySelector('.n').textContent=k+1;r.classList.remove('ok','bad')})}
function check(){let ok=0;[...box.children].forEach((r,k)=>{const good=+r.dataset.i===k;r.classList.add(good?'ok':'bad');if(good)ok++;r.querySelector('.w').textContent=good?r.querySelector('.w').dataset.why:''});
  score.textContent=`На своём месте: ${ok} из ${D.steps.length}`}
function answers(){[...box.children].sort((a,b)=>a.dataset.i-b.dataset.i).forEach(r=>box.appendChild(r));num();check()}
$('#bCheck').onclick=check;$('#bAns').onclick=answers;$('#bRe').onclick=build;
build();
</script></body></html>
